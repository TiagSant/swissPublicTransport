<!DOCTYPE html>
<!--
  swissPublicTransport — Sprint 9 prototype: my places
  - US-21: save Home, Work and other named places (from an address, a stop, my position or the map); rename, remove, undo.
  - US-22: my places as one-tap chips on the Journey page, ordered by use, also suggested while typing.
  - US-23: address search (stops, addresses, places of interest) in the From / To fields and when saving a place.
  - US-27: removing the stop on screen shows the next most-used stop.
  - US-33: departure alarms adapt to when they are set (on board: cancelled; less time: ring at once with the time left).
  - US-35: get-off reminders follow the live time of each ride, and my position (GPS) while the page is open.
  - US-36: finish on foot — the last ride compared with walking; learned per place; the bus always stays as an alternative.
           Same at the start: walk to where the second ride leaves instead of taking the first one.
  - US-38: a followed journey shows every step live (delays, platforms, progress); a missed connection is detected
           and alternatives are offered: the next run of the same line, another route, or finishing on foot.
  - US-39: a tight connection says it plainly (walk vs time between the rides) and offers options with a comfortable
           margin: an earlier first bus, a later run, another route; the waiting time at each change, live.
  - US-40: German, Italian and Romansh, in addition to English and French.
  Sprint 8: journey details
  - US-28: the details of a journey open inside the result, one at a time.
  - US-29: each ride is drawn in the colour of its line.
  - US-30: unfold the intermediate stops of a ride, with their times.
  - US-31: reminder one stop before each stop where the rider gets off (switch in Settings ⚙).
  - US-32: each walk on a map, from where to where.
  - BUG-03: consecutive walks are merged into one.
  Sprint 7: official data (opentransportdata.swiss)
  - TECH-05: data from the official Swiss open-data platform (OJP 2.0): stop search, stops nearby, departures
             with real time and platforms, journeys. The answers are turned into the shape the app already used
             (assets/ojp.js), so every screen works the same with either source.
  - TECH-06: the personal API key is entered in Settings ⚙ and stays on this device (never in the code).
             Without a key, the prototype keeps using transport.opendata.ch.
  - US-20: remove one stop from "Your stops", or all of them, with undo.
  Sprint 6: journeys and departure alarms
  - US-14/15: plan a journey between stops, my position or points picked on the map (nearest stops are tried,
              walks at the rider's speed); US-07/08/09: fastest or least walking, remembered.
  - US-16/17: "Get ready" and "Leave" alarms from the first vehicle's departure (live when available).
  - US-18/19: preparation time, walking speed and margin; the walking speed is learned from measured walks.
  - TECH-04: web simulation — alarms ring while the page is open, test buttons, simulated walk.
  Sprint 5: find your platform
  - US-13: tapping a platform letter / track number opens a map of the stop with every platform, the target
           highlighted, the rider's position and distance, and a "Walk there" button (phone's maps app).
           Platform positions: official ATLAS traffic points, rebuilt weekly into assets/quays.js.
  Sprint 4: visual identity and languages
  - US-10: English UI by default, French when the phone's language is French (EN/FR switch in the header).
  - US-11: official Swiss public transport pictograms (modes) and SBB timetable icons (train products),
           used unmodified from SBB's design-system repositories — see assets/sbb/NOTICE.md.
  - US-12: each line in its operator's colour (TPG, Léman Express, Mouettes) — see assets/line-colors.js.
  Everything from Sprints 1-3 is kept: stop search in the Unireso area, real-time departures, line and
  direction filters, frequent stops, and the usage-based preselection of usual lines (US-06).
  Data: https://opentransportdata.swiss (OJP 2.0, personal key) or https://transport.opendata.ch (no key).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>Unireso departures — Sprint 9 prototype</title>
<script src="../../assets/line-colors.js"></script>
<script src="../../assets/line-colors-ch.js"></script>
<script src="../../assets/ojp.js"></script>
<script src="i18n.js"></script>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --text: #111827; --muted: #6b7280; --line: #e5e7eb;
    --accent: #c8102e; --late: #d9480f; --ok: #2b8a3e; --badge-ring: transparent;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1220; --card: #141c2e; --text: #e8ecf3; --muted: #94a0b4; --line: #26314a;
            --late: #ff922b; --ok: #69db7c; --badge-ring: rgba(255,255,255,.28); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 12px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 2px 12px; }
  header h1 { font-size: 1.15rem; margin: 0; letter-spacing: -.01em; }
  header h1 span { color: var(--accent); }
  header .right { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: .75rem; }
  .lang { border: 1px solid var(--line); border-radius: 8px; padding: 3px 4px; font-size: .75rem; font-weight: 700; color: var(--muted); background: none; font-family: inherit; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; }
  .search-row { display: flex; gap: 8px; }
  input[type=search] { flex: 1; min-width: 0; font-size: 1rem; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--bg); color: var(--text);
    border-radius: 10px; padding: 10px 12px; }
  button:active { transform: scale(.98); }
  .ghost { border: none; background: none; color: var(--muted); padding: 6px 8px; font-size: .85rem; }
  .opts { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; color: var(--muted); font-size: .8rem; }
  .opts label { display: flex; gap: 6px; align-items: center; }
  ul { list-style: none; margin: 0; padding: 0; }
  .results li button { width: 100%; text-align: left; display: flex; gap: 10px; align-items: center;
    border: none; border-bottom: 1px solid var(--line); border-radius: 0; background: none; padding: 11px 4px; }
  .results li:last-child button { border-bottom: none; }
  .results .dist { margin-left: auto; color: var(--muted); font-size: .8rem; }
  .section-title { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  /* "Your stops" chip: open the stop, or ✕ to remove it from the list */
  .stop-chip { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); overflow: hidden; }
  .stop-chip button { border: none; background: none; border-radius: 0; font-size: .9rem; }
  .stop-chip .stop-open { padding: 7px 4px 7px 12px; }
  .stop-chip .stop-del { padding: 0 11px 0 7px; color: var(--muted); font-size: .8rem; }
  .stop-chip .stop-del:hover { color: var(--accent); }
  .stop-chip .n { color: var(--muted); font-size: .75rem; margin-left: 4px; }
  .toast { position: fixed; left: 12px; right: 12px; bottom: 16px; z-index: 1500; max-width: 616px; margin: 0 auto;
    display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 10px 10px 14px;
    background: var(--text); color: var(--card); border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.3); font-size: .9rem; }
  .toast button { border: none; background: none; color: inherit; font-weight: 800; padding: 6px 8px; text-transform: uppercase; font-size: .8rem; }
  .board-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .board-head h2 { margin: 0; font-size: 1.2rem; }
  .status { color: var(--muted); font-size: .78rem; margin-top: 2px; }

  /* Mode pictograms (SBB pictogram library, unmodified) */
  .picto { width: 22px; height: 22px; flex: none; display: block; }
  .picto.sm { width: 18px; height: 18px; }
  .picto-none { width: 22px; height: 22px; flex: none; border-radius: 4px; border: 1.5px dashed var(--line); }

  /* Line badges: operator colours, SBB timetable icons, or a neutral fallback */
  .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 38px; height: 24px; padding: 0 8px;
    font-weight: 800; font-size: .9rem; line-height: 1; white-space: nowrap; box-shadow: 0 0 0 1px var(--badge-ring); }
  .badge.pill { border-radius: 999px; }
  .badge.hexagon { border-radius: 0; box-shadow: none; padding: 0 12px;
    clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 8px 100%, 0 50%); }
  .badge.neutral { border-radius: 4px; background: var(--card); color: var(--text); border: 1.5px solid currentColor; box-shadow: none; }
  .tt { display: inline-flex; height: 24px; }
  .tt img { height: 24px; width: auto; display: block; }
  .line-id { display: inline-flex; align-items: center; gap: 6px; }

  .line-chip { padding: 5px 8px; border-radius: 10px; display: inline-flex; gap: 6px; align-items: center; background: var(--bg);
    border: 1px solid var(--line); color: var(--text); }
  .line-chip[aria-pressed="false"] { opacity: .45; filter: grayscale(1); }
  .line-chip[aria-pressed="false"] .badge, .line-chip[aria-pressed="false"] .tt { text-decoration: line-through; }
  .line-chip[aria-pressed="mixed"] { border-style: dashed; }
  .line-chip .cnt { font-size: .68rem; font-weight: 700; color: var(--muted); }
  .line-chip .fav { font-size: .75rem; color: var(--accent); }

  .dir-toggle { padding-left: 0; margin-top: 6px; }
  .auto-info { font-size: .8rem; color: var(--muted); background: var(--bg); border-radius: 10px; padding: 6px 4px 6px 10px;
    margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .auto-info button { padding: 4px 8px; font-size: .8rem; color: var(--accent); font-weight: 600; }
  #dirs { border-top: 1px solid var(--line); margin-top: 4px; }
  .dir-group { display: grid; grid-template-columns: 84px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .dir { width: 100%; display: flex; gap: 10px; align-items: center; text-align: left; border: none; background: none; padding: 6px 2px; border-radius: 8px; }
  .dir .box { width: 22px; height: 22px; flex: none; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; font-size: .8rem; color: #fff; }
  .dir[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
  .dir[aria-pressed="true"] .box::after { content: "✓"; }
  .dir[aria-pressed="false"] .lbl b { color: var(--muted); text-decoration: line-through; font-weight: 500; }
  .dir .lbl { min-width: 0; }
  .dir .lbl b { display: block; font-weight: 600; }
  .dir .lbl small { color: var(--muted); font-size: .75rem; }
  .filter-actions { display: flex; gap: 4px; }

  .dep { display: grid; grid-template-columns: 108px 1fr auto; gap: 10px; align-items: center; padding: 10px 2px;
    border-bottom: 1px solid var(--line); cursor: pointer; }
  .dep:last-child { border-bottom: none; }
  .dep .to { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dep .meta { color: var(--muted); font-size: .78rem; }
  .dep .meta .late { color: var(--late); font-weight: 600; }
  .dep .when { text-align: right; font-variant-numeric: tabular-nums; }
  .dep .when b { font-size: 1.25rem; display: block; line-height: 1.1; }
  .dep .when .now { color: var(--ok); }
  .dep .when small { color: var(--muted); font-size: .75rem; }
  .dep .stops { grid-column: 1 / -1; margin: 2px 0 0 118px; padding: 0; font-size: .8rem; color: var(--muted); }
  .dep .stops li { display: flex; justify-content: space-between; padding: 2px 0 2px 10px; border-left: 2px solid var(--line); }
  .dep .stops li span:last-child { font-variant-numeric: tabular-nums; }

  .empty, .error { color: var(--muted); text-align: center; padding: 18px 8px; font-size: .9rem; }
  .error { color: var(--late); }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer { color: var(--muted); font-size: .72rem; text-align: center; margin-top: 16px; }
  footer a { color: inherit; }
  /* Platform links and map sheet (US-13) */
  /* Platform chip: looks like the platform sign on site; tapping it opens the map */
  .plat { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 3px 0 5px; margin-right: 2px;
    border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--muted);
    font: 600 .72rem/1 system-ui, sans-serif; vertical-align: middle; }
  .plat svg { width: 11px; height: 11px; flex: none; fill: currentColor; }
  .plat-v { display: inline-grid; place-items: center; min-width: 16px; height: 16px; padding: 0 3px; border-radius: 4px;
    background: var(--text); color: var(--card); font-weight: 800; font-size: .75rem; }
  .plat:active { transform: scale(.96); }
  .plat.stop .plat-k { font-weight: 600; }
  .qm.stop-pin svg, .wm[data-stop] svg { width: 18px; height: 18px; fill: #fff; }
  .plat.changed { border-color: var(--late, #c62828); color: var(--late, #c62828); }
  .plat.changed .plat-v { background: var(--late, #c62828); color: #fff; }
  .head-actions { display: flex; gap: 6px; }
  .sheet { position: fixed; inset: 0; z-index: 1000; background: var(--card); display: flex; flex-direction: column; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 12px;
    border-bottom: 1px solid var(--line); }
  .sheet-head h3 { margin: 0; font-size: 1.1rem; }
  #map { flex: 1; min-height: 200px; background: var(--bg); }
  .sheet-foot { padding: 10px 12px 14px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
  .sheet-foot .source { color: var(--muted); font-size: .7rem; }
  .btn-primary { display: block; text-align: center; background: var(--accent); color: #fff; font-weight: 700;
    border-radius: 12px; padding: 12px; text-decoration: none; }
  .qm { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #fff; color: #111;
    border: 2px solid #4b5563; font: 800 12px/1 system-ui, sans-serif; box-shadow: 0 1px 3px rgba(0,0,0,.35); }
  .qm.target { width: 38px; height: 38px; font-size: 16px; background: var(--accent); color: #fff; border: 3px solid #fff;
    box-shadow: 0 0 0 3px var(--accent), 0 2px 6px rgba(0,0,0,.4); }
  /* Tabs, journey planner, alarms, settings (Sprint 6) */
  .tabs { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 12px; }
  .tabs button { flex: 1; border: none; background: none; border-radius: 9px; padding: 8px; font-weight: 600; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--accent); color: #fff; }
  .place-label { display: block; font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 4px; }
  .swap-row { display: flex; justify-content: flex-end; margin: -2px 0 -6px; }
  .swap-row button { font-size: 1.1rem; }
  .when-row { display: flex; gap: 8px; margin: 12px 0 10px; }
  .when-row select, .when-row input { font: inherit; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .when-row input { flex: 1; min-width: 0; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
  .seg button { flex: 1; border: none; border-radius: 0; background: var(--bg); color: var(--muted); font-weight: 600; padding: 9px; }
  .seg button[aria-pressed="true"] { background: var(--text); color: var(--card); }
  button.btn-primary { width: 100%; border: none; }
  .jr { width: 100%; text-align: left; border: none; border-bottom: 1px solid var(--line); border-radius: 0; background: none; padding: 12px 2px; display: grid; gap: 6px; }
  #journeyList li:last-child .jr { border-bottom: none; }
  .jr-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 1.05rem; }
  .jr-dur { color: var(--muted); font-size: .9rem; }
  .jr-segs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .jw { font-size: .8rem; color: var(--muted); }
  .jsep { color: var(--muted); font-size: .8rem; }
  .jr-meta { color: var(--muted); font-size: .8rem; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .jr-meta .tag, .tag { background: var(--text); color: var(--card); border-radius: 999px; padding: 1px 8px; font-size: .7rem; font-weight: 700; }
  .tag.walk { background: var(--ok); color: #fff; }
  .ok { color: var(--ok); font-weight: 600; }
  .late { color: var(--late); font-weight: 600; }
  .legs { margin: 10px 0 12px; }
  .leg { padding: 8px 0 8px 12px; border-left: 4px solid var(--line); margin-left: 6px; display: grid; gap: 4px; }
  .leg.ride { border-left-color: var(--lc, var(--text)); }
  .leg.walk { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .85rem; border-left: 3px dotted var(--muted); margin-left: 6.5px; }
  .leg.walk > div { flex: 1; }
  .walk-map { flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: .78rem; padding: 4px 9px; }
  .walk-map svg { width: 14px; height: 14px; fill: currentColor; }
  .ride-meta { color: var(--muted); font-size: .82rem; }
  .foot-alt { list-style: none; margin: 2px 0 6px 6px; }
  .foot-toggle { width: 100%; text-align: left; border: 1px dashed var(--line); background: var(--bg); color: var(--text); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: .86rem; cursor: pointer; display: grid; gap: 2px; }
  .foot-toggle small { color: var(--muted); font-size: .76rem; }
  .foot-toggle.better { border: 1px solid #1a7f37; background: rgba(26,127,55,.08); }
  .foot-toggle .d.better { color: #1a7f37; font-weight: 600; }
  @media (prefers-color-scheme: dark) { .foot-toggle.better { border-color: #6fdc8c; background: rgba(111,220,140,.08); } .foot-toggle .d.better { color: #6fdc8c; } }
  .tag.foot { background: rgba(26,127,55,.12); color: inherit; }
  .via-toggle { border: none; background: none; padding: 2px 0; color: var(--muted); font: inherit; font-size: .82rem; cursor: pointer; justify-self: start; }
  .via-toggle::after { content: ' ▾'; } .via-toggle[aria-expanded="true"]::after { content: ' ▴'; }
  .via { margin: 0 0 2px; padding: 0; list-style: none; display: grid; gap: 3px; font-size: .84rem; }
  .via li { display: flex; gap: 8px; align-items: baseline; position: relative; }
  .via li::before { content: ''; position: absolute; left: -18.5px; top: .45em; width: 9px; height: 9px; border-radius: 50%; background: var(--card); border: 2px solid var(--lc, var(--text)); box-sizing: border-box; }
  .via time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 3.1em; }
  .via .next-off { font-weight: 600; }
  .via .next-off small { color: var(--muted); font-weight: 400; }
  .jr-item { border-bottom: 1px solid var(--line); }
  #journeyList li.jr-item:last-child { border-bottom: none; }
  .jr-item .jr { border-bottom: none; }
  .jr[aria-expanded="true"] .jr-top b::after { content: ' ▴'; color: var(--muted); font-weight: 400; }
  .jr-detail { padding: 0 2px 12px; }
  .jr-detail .legs { margin-top: 2px; }
  .jr-detail .btn-primary { margin-top: 4px; }
  .wm { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; color: #fff; font-weight: 700; font-size: .8rem; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .wm.a { background: #1a7f37; } .wm.b { background: #c62828; }
  /* Stopover and round trip (US-45, US-46) */
  .trip-opts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 6px 0 10px; font-size: .9rem; }
  .trip-opts .rt { display: inline-flex; align-items: center; gap: 6px; }
  .stay-row { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: .9rem; color: var(--muted); }
  .stay-row input { width: 4.5em; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  .place.via { border-left: 3px solid var(--accent); padding-left: 8px; }
  .jw.stay { font-weight: 700; }
  .wait-total.changed { color: #b26a00; font-weight: 600; }
  .leg .wait { font-size: .8rem; color: var(--muted); margin: 2px 0; }
  .leg .wait.changed { color: #b26a00; font-weight: 600; }
  .leg.stay, .tl.stay { list-style: none; margin: 6px 0; padding: 8px 10px; border-radius: 10px; background: var(--bg); border: 1px dashed var(--line); }
  .leg.stay b, .tl.stay b { display: block; }
  .stay-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .early { margin: 6px 0; padding: 8px 10px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); font-size: .9rem; }
  .leg.change, .tl.change { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .85rem; }
  .wm { min-width: 30px; width: auto; height: 30px; padding: 0 4px; box-sizing: border-box; font-size: .9rem; }
  .qm.other { width: 24px; height: 24px; font-size: 11px; opacity: .75; }
  .leg-line { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .leg-stop { font-size: .88rem; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .leg-stop.muted { color: var(--muted); }
  .alarm { padding: 4px 0 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  .alarm:last-child { border-bottom: none; }
  .al-times { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
  .al-times > div { background: var(--bg); border-radius: 10px; padding: 6px 4px; }
  .al-times small { display: block; color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; }
  .al-times b { font-size: 1.2rem; font-variant-numeric: tabular-nums; }
  .al-times .done { opacity: .5; }
  .al-line { display: flex; align-items: center; gap: 8px; font-size: .88rem; }
  .al-actions { display: flex; flex-wrap: wrap; gap: 2px; }
  .trip { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; display: grid; gap: 6px; }
  .trip-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: .9rem; }
  .trip-head b { font-size: 1.05rem; font-variant-numeric: tabular-nums; }
  .trip-now { font-size: .82rem; color: var(--muted); }
  .trip-legs { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .tl { padding: 6px 0 6px 12px; margin-left: 6px; border-left: 4px solid var(--lc, var(--text)); display: grid; gap: 2px; font-size: .86rem; }
  .tl.walk { border-left: 3px dotted var(--muted); margin-left: 6.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .tl.walk > span { flex: 1; }
  .tl.done { opacity: .45; }
  .tl.now { background: color-mix(in srgb, var(--accent) 7%, transparent); border-radius: 0 8px 8px 0; }
  .tl .tl-line { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .tl .chip { margin-left: auto; font-size: .7rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
  .tl.now .chip { border-color: var(--accent); color: var(--accent); }
  .tl time { font-variant-numeric: tabular-nums; font-weight: 600; }
  .tl .was { text-decoration: line-through; color: var(--muted); font-weight: 400; margin-right: 3px; }
  .tl .changed { color: #c62828; font-weight: 600; }
  .trip-warn { border: 1px solid #c62828; background: rgba(198,40,40,.07); border-radius: 10px; padding: 8px 10px; display: grid; gap: 6px; font-size: .86rem; }
  .trip-warn.tight { border-color: #b26a00; background: rgba(178,106,0,.08); }
  .trip-alt { text-align: left; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; padding: 7px 10px; font: inherit; font-size: .85rem; cursor: pointer; display: grid; gap: 1px; }
  .trip-alt small { color: var(--muted); }
  .trip-alt.best { border-color: #1a7f37; }
  .tl .wait { font-size: .8rem; color: var(--muted); }
  .tl .via { margin: 2px 0; }
  .tl .via li::before { left: -20.5px; }
  .tl .via li.passed { opacity: .5; }
  .tl .via li.here span { font-weight: 600; }
  .tl.done .via-toggle, .tl.done .ride-meta { opacity: .9; }
  .tl .wait.changed { color: #b26a00; font-weight: 600; }
  @media (prefers-color-scheme: dark) { .tl .changed { color: #ff8a80; } .trip-warn { border-color: #ff8a80; } .trip-alt.best { border-color: #6fdc8c; } }
  .note { color: var(--muted); font-size: .72rem; margin: 6px 0 0; }
  .walk-status { background: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: .82rem; margin-top: 6px; }
  .settings-body { padding: 12px; overflow: auto; display: grid; gap: 12px; align-content: start; }
  .settings-body h4 { margin: 10px 0 0; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .set-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .set-row input { width: 76px; font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); text-align: right; }
  .set-info { display: flex; justify-content: space-between; align-items: center; margin-top: -6px; }
  .alarm-banner { position: fixed; left: 12px; right: 12px; top: 12px; z-index: 2000; background: var(--card); color: var(--text);
    border: 2px solid var(--accent); border-radius: 16px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.35); display: grid; gap: 8px; max-width: 616px; margin: 0 auto; }
  .alarm-banner b { font-size: 1.2rem; }
  .ab-actions { display: flex; gap: 8px; }
  .ab-actions button { flex: 1; }
  .pick-pin { display: block; width: 22px; height: 22px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    background: var(--accent); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .api-status { background: #fff4e5; color: #8a4b00; border: 1px solid #f5c27a; border-radius: 12px; padding: 10px 12px;
    font-size: .85rem; margin-bottom: 12px; }
  @media (prefers-color-scheme: dark) { .api-status { background: #3a2a10; color: #ffd8a8; border-color: #8a5a1a; } }
  .key-row { display: grid; gap: 6px; }
  .key-row input { font: inherit; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); width: 100%; box-sizing: border-box; }
  .key-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .src-badge { font-size: .78rem; padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
  .src-badge.official { border-color: var(--accent); }
  .key-status.ok { color: #1a7f37; } .key-status.bad { color: #c62828; }
  @media (prefers-color-scheme: dark) { .key-status.ok { color: #6fdc8c; } .key-status.bad { color: #ff8a80; } }
  .myplaces { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .mp-actions { display: inline-flex; gap: 4px; }
  .place-chip .place-open { padding: 7px 4px 7px 11px; }
  .place-chip .place-edit { padding: 0 4px; color: var(--muted); font-size: .85rem; }
  .place-save { color: var(--muted); }
  .results .kind { margin-left: auto; color: var(--muted); font-size: .72rem; }
  .results .ico { width: 22px; text-align: center; flex: none; }
  .place-chosen { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: .9rem; }
  #placeKind { margin-bottom: 0; }
  #mapSheet { z-index: 1100; }
  [hidden] { display: none !important; }
</style>

<body>
<main>
  <header>
    <h1><span data-i18n="title"></span> <span>Unireso</span></h1>
    <div class="right">
      <span data-i18n="prototype"></span>
      <select id="lang" class="lang" aria-label="Language / Langue / Sprache / Lingua">
        <option value="en">English</option><option value="fr">Français</option><option value="de">Deutsch</option>
        <option value="it">Italiano</option><option value="rm">Rumantsch</option>
      </select>
      <button id="settingsBtn" class="lang" type="button" data-i18n-title="settingsTitle" data-i18n-aria="settingsTitle">⚙</button>
    </div>
  </header>

  <div id="apiStatus" class="api-status" role="status" hidden></div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="departures" data-i18n="tabDepartures"></button>
    <button role="tab" data-tab="journey" data-i18n="tabJourney"></button>
  </nav>

  <!-- Departure alarms (US-16) — visible on both tabs -->
  <section id="alarmCard" class="card" hidden>
    <p class="section-title"><span data-i18n="followTitle"></span></p>
    <ul id="alarmList"></ul>
    <div id="walkStatus" class="walk-status" hidden><span id="walkStatusText"></span> <button id="walkStop" class="ghost" data-i18n="stopMeasuring"></button></div>
    <p class="note" data-i18n="webNote"></p>
  </section>

  <div id="tab-departures">

  <!-- Stop search -->
  <section class="card" data-i18n-aria="searchSection">
    <div class="search-row">
      <input id="q" type="search" data-i18n-placeholder="searchPlaceholder" autocomplete="off" enterkeyhint="search">
      <button id="near" data-i18n-title="nearMe" data-i18n-aria="nearMe">📍</button>
    </div>
    <div class="opts">
      <span id="searchStatus"></span>
    </div>
    <ul id="results" class="results" hidden></ul>
  </section>

  <!-- Most visited stops -->
  <section id="recentCard" class="card" hidden>
    <p class="section-title"><span data-i18n="yourStops"></span> <button id="clearRecent" class="ghost" data-i18n="clearAll"></button></p>
    <div id="recent" class="chips"></div>
  </section>

  <!-- Departure board -->
  <section id="board" class="card" hidden>
    <div class="board-head">
      <div>
        <h2 id="stationName"></h2>
        <div id="boardStatus" class="status"></div>
      </div>
      <div class="head-actions">
        <button id="mapBtn" data-i18n-title="stopMap" data-i18n-aria="stopMap">🗺</button>
        <button id="refresh" data-i18n-title="refresh" data-i18n-aria="refresh">↻</button>

    </div>

    <div style="margin:14px 0 6px">

          <button id="noLines" class="ghost" data-i18n="none"></button>
        </span>
      </p>
      <div id="autoInfo" class="auto-info" hidden></div>
      <div id="lines" class="chips"></div>
      <button id="dirToggle" class="ghost dir-toggle" aria-expanded="false"></button>
      <div id="dirs" hidden></div>
    </div>

    <ul id="departures"></ul>
  </section>
  </div>

  <!-- Journey planner (US-14, US-15, US-07, US-08, US-09) -->
  <div id="tab-journey" hidden>
    <section class="card">
      <!-- My places (US-21, US-22) -->
      <div id="myPlaces" class="myplaces">
        <p class="section-title"><span data-i18n="myPlaces"></span>
          <span class="mp-actions"><button id="addPlace" class="ghost" data-i18n="addPlace"></button><button id="clearPlaces" class="ghost" data-i18n="clearAll"></button></span></p>
        <div id="placeChips" class="chips"></div>
        <p id="placesHint" class="note" data-i18n="placesHint"></p>
      </div>
      <div class="place">
        <label class="place-label" for="fromQ" data-i18n="from"></label>
        <div class="search-row">
          <input id="fromQ" type="search" autocomplete="off" data-i18n-placeholder="stopOrPlace">
          <button class="place-save" data-which="from" data-i18n-title="savePlace" data-i18n-aria="savePlace" hidden>☆</button>
          <button class="place-me" data-which="from" data-i18n-title="myPosition" data-i18n-aria="myPosition">◎</button>
          <button class="place-map" data-which="from" data-i18n-title="pickOnMap" data-i18n-aria="pickOnMap">🗺</button>
        </div>
        <ul id="fromResults" class="results" hidden></ul>
      </div>
      <div class="swap-row"><button id="swap" class="ghost" data-i18n-title="swap" data-i18n-aria="swap">⇅</button></div>
      <!-- US-45: a stopover on the way, for as long as the rider chooses -->
      <div id="viaBox" class="place via" hidden>
        <label class="place-label" for="viaQ" data-i18n="stopover"></label>
        <div class="search-row">
          <input id="viaQ" type="search" autocomplete="off" data-i18n-placeholder="stopOrPlace">
          <button class="place-map" data-which="via" data-i18n-title="pickOnMap" data-i18n-aria="pickOnMap">🗺</button>
          <button id="viaRemove" class="ghost" data-i18n-title="removeStopover" data-i18n-aria="removeStopover">✕</button>
        </div>
        <ul id="viaResults" class="results" hidden></ul>
        <label class="stay-row"><span data-i18n="stayFor"></span>
          <input id="viaStay" type="number" min="1" max="720" step="5" inputmode="numeric"> <span data-i18n="minutesShort"></span></label>
      </div>
      <div class="place">
        <label class="place-label" for="toQ" data-i18n="to"></label>
        <div class="search-row">
          <input id="toQ" type="search" autocomplete="off" data-i18n-placeholder="stopOrPlace">
          <button class="place-save" data-which="to" data-i18n-title="savePlace" data-i18n-aria="savePlace" hidden>☆</button>
          <button class="place-map" data-which="to" data-i18n-title="pickOnMap" data-i18n-aria="pickOnMap">🗺</button>
        </div>
        <ul id="toResults" class="results" hidden></ul>
      </div>
      <!-- US-45 / US-46: stopover, round trip with a chosen time there -->
      <div class="trip-opts">
        <button id="addVia" class="ghost" data-i18n="addStopover"></button>
        <label class="rt"><input id="roundTrip" type="checkbox"> <span data-i18n="roundTrip"></span></label>
        <label id="returnStayBox" class="stay-row" hidden><span data-i18n="stayThere"></span>
          <input id="returnStay" type="number" min="1" max="720" step="5" inputmode="numeric"> <span data-i18n="minutesShort"></span></label>
      </div>
      <div class="when-row">
        <select id="whenMode">
          <option value="now" data-i18n="leaveNow"></option>
          <option value="depart" data-i18n="departAt"></option>
          <option value="arrive" data-i18n="arriveBy"></option>
        </select>
        <input id="whenAt" type="datetime-local" hidden>
      </div>
      <div id="prio" class="seg" role="group">
        <button data-prio="fast" data-i18n="fastest"></button>
        <button data-prio="walk" data-i18n="leastWalking"></button>
      </div>
      <button id="searchJourney" class="btn-primary" data-i18n="searchJourney"></button>
      <div id="journeyStatus" class="status" style="margin-top:8px"></div>
    </section>

    <section id="journeyResults" class="card" hidden>
      <ul id="journeyList"></ul>
    </section>

  </div>

  <div id="toast" class="toast" role="status" hidden><span id="toastText"></span><button id="toastUndo" data-i18n="undo"></button></div>

  <footer>
    <span data-i18n="dataSource"></span>
    <a id="srcLink" href="https://transport.opendata.ch" target="_blank" rel="noopener">transport.opendata.ch</a>
    · <span data-i18n="credits"></span>
  </footer>
</main>

<!-- Platform map (US-13) -->
<!-- Save or edit a place (US-21) -->
<div id="placeSheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="placeTitle">
  <div class="sheet-head">
    <h3 id="placeTitle"></h3>
    <button id="placeClose" data-i18n-aria="close" data-i18n-title="close">✕</button>
  </div>
  <div class="settings-body">
    <div id="placeKind" class="seg" role="group">
      <button data-kind="home" data-i18n="kindHome"></button>
      <button data-kind="work" data-i18n="kindWork"></button>
      <button data-kind="other" data-i18n="kindOther"></button>
    </div>
    <label class="key-row"><span data-i18n="placeName"></span><input id="placeName" type="text" maxlength="40" autocomplete="off"></label>
    <div class="key-row"><span data-i18n="placeWhere"></span>
      <div class="search-row">
        <input id="placeQ" type="search" autocomplete="off" data-i18n-placeholder="addressOrStop">
        <button id="placeMe" data-i18n-title="myPosition" data-i18n-aria="myPosition">◎</button>
        <button id="placeMap" data-i18n-title="pickOnMap" data-i18n-aria="pickOnMap">🗺</button>

<div id="mapSheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="mapTitle">

    <div><h3 id="mapTitle"></h3><div id="mapSub" class="status"></div></div>

  <div class="sheet-foot">

    <a id="walkThere" class="btn-primary" target="_blank" rel="noopener" data-i18n="walkThere"></a>

    <div class="source" data-i18n="mapSource"></div>
  </div>
</div>

<!-- Alarm settings (US-18, US-19, TECH-04) -->
<div id="settingsSheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="sheet-head">
    <h3 id="settingsTitle" data-i18n="settingsTitle"></h3>
    <button id="settingsClose" data-i18n-aria="close" data-i18n-title="close">✕</button>
  </div>
  <div class="settings-body">
    <!-- Data source (TECH-05, TECH-06) -->
    <h4 data-i18n="dataTitle"></h4>

  <div id="abBody"></div>
  <div class="ab-actions">
    <button id="abTrack" hidden data-i18n="measureWalk"></button>
    <button id="abOk" class="btn-primary" data-i18n="ok"></button>
  </div>
</div>

<script>
(() => {

      locating: 'locating…', noNearby: 'No stop nearby.', nearbyFailed: 'Could not load nearby stops.',
      geoDenied: 'Location denied or unavailable.', nextStop: 'next stop: {name}',
      manual: 'Manual selection', backToHabits: 'Back to my habits', allLinesShown: 'All lines', myLines: '★ My lines',
      usualLines: '★ Your usual lines at this stop', seeAll: 'See all',
      noLinesInBoard: 'No lines in the upcoming departures.', noDepartures: 'No departures coming up.',
      noUsualDepartures: 'No upcoming departures on your usual lines.', noSelectedDepartures: 'No selected line in the upcoming departures.',
      platform: 'Platform {p}', track: 'Track {p}', nextStopsUnavailable: 'Next stops not available',
      justNow: 'just now', updatedAgo: 'updated {n} ago', loading: 'loading…',
