  function gpsStatusText(a) {
    if (gps.denied) return (a.alights || []).some((x, n) => !a.fired['alight' + n]) ? t('gpsDenied') : '';
    if (!pendingAlights().some(q => q.a.id === a.id)) return '';
    if (gpsFresh(Date.now())) return t('gpsOn');
    return gps.watch ? t('gpsWaiting') : '';
  }

  function createAlarm(j) {
    const f = j.rides[0];
    const alarm = {
      id: String(Date.now()), created: Date.now(), fired: {},
      from: placeLabel(places.from), to: placeLabel(j.segments > 1 ? tripPoints().pts.slice(-1)[0] : places.to), origin: places.from && places.from.coord,
      accessMeters: j.accessMeters, apiWalkBefore: Math.max(0, j.apiWalkBefore || 0),
      first: { stopId: f.from.id, stopName: f.from.name, stopCoord: f.from.coord, category: f.category, number: f.number,
               mode: f.mode, label: f.label, style: f.style, to: f.to, toStopId: f.toStop.id, sched: f.dep.getTime(), platform: f.platform },
      live: f.real ? { dep: f.real.getTime(), at: Date.now() } : null,
      created0: (f.real || f.dep).getTime(),   // first departure when the alarm was set, to shift the get-off times with live data
      alights: alightPlan(j),
      // US-38: the whole journey, followed live
      plan: planOf(j), dest: j.segments > 1 ? tripPoints().pts.slice(-1)[0] : places.to, rev: 0
    };
    // US-33: set after the first vehicle left → already on board: no departure alarms, only get-off reminders.
    // Set after the leave time → only "Leave" rings (at once). Set after the get-ready time → "Get ready" rings at once.
    const tm0 = alarmTimes(alarm), now0 = Date.now();
    if (now0 >= tm0.dep) { alarm.onBoard = true; alarm.fired.ready = alarm.fired.leave = now0; }
    else if (now0 >= tm0.leave) alarm.fired.ready = now0;
    saveAlarms([alarm, ...getAlarms()].slice(0, 5));
    unlockAudio(); askNotificationPermission();
    if (getSettings().alightReminder !== false && navigator.geolocation && alarm.alights.length)
      navigator.geolocation.getCurrentPosition(() => { gps.denied = false; updateGpsWatch(); }, err => { if (err.code === 1) gps.denied = true; }, { maximumAge: 60000, timeout: 15000 });
    renderAlarms(); tickAlarms();
    $('alarmCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function renderAlarms() {
    const list = getAlarms(), s = getSettings();
    $('alarmCard').hidden = list.length === 0;
    $('alarmList').innerHTML = list.slice().sort((x, y) => alarmTimes(x, s).dep - alarmTimes(y, s).dep).map(a => {
      const tm = alarmTimes(a, s), f = a.first;
      const src = tm.delay == null ? t('timetable') : tm.delay > 0 ? t('liveDelay', { d: '+' + tm.delay + ' min' }) : t('liveOnTime');
      const plat = f.platform ? ` · ${t(f.mode === 'train' ? 'track' : 'platform', { p: f.platform })}` : '';
      const tight = tm.leave < Date.now() && !a.fired.leave ? `<div class="late">${esc(t('mayMiss'))}</div>` : '';
      return `<li class="alarm" data-id="${esc(a.id)}">
        <div class="al-times">
          <div class="${a.fired.ready ? 'done' : ''}"><small>${esc(t('getReady'))}</small><b data-k="ready">${hhmm(new Date(tm.ready))}</b></div>
          <div class="${a.fired.leave ? 'done' : ''}"><small>${esc(t('leaveHome'))}</small><b data-k="leave">${hhmm(new Date(tm.leave))}</b></div>
          <div><small>${esc(t('departs'))}</small><b data-k="dep">${hhmm(new Date(tm.dep))}</b></div>
        </div>
        <div class="al-line">${lineIdHtml(f.mode, f.style, f.label, true)} <span>→ ${esc(f.to)} · ${esc(f.stopName)}${esc(plat)}</span></div>
        <div class="status" data-k="src">${esc(src)} · ${esc(t('walkInfo', { min: fmtMin(tm.walk), speed: s.speedKmh.toFixed(1), margin: s.marginMin, prep: s.prepMin }))}</div>
        ${a.onBoard ? `<div class="status" data-k="onboard">${esc(t('onBoard'))}</div>` : tight}
        ${alightLine(a, s)}
        ${tripHtml(a)}
        <div class="al-actions">
          <button class="ghost" data-act="test-ready">${esc(t('testReady'))}</button>
          <button class="ghost" data-act="test-leave">${esc(t('testLeave'))}</button>
          ${(a.alights || []).length ? `<button class="ghost" data-act="test-alight">${esc(t('testAlight'))}</button>` : ''}
          <button class="ghost" data-act="cancel">${esc(t('cancel'))}</button>
        </div></li>`;
    }).join('');
  }

  function tickAlarms() {
    const now = Date.now(), s = getSettings();
    let list = getAlarms(), changed = false;
    for (const a of list) {
      const tm = alarmTimes(a, s);
      // past the leave time: only "Leave" rings (no "Get ready" first)
      if (!a.fired.leave && now >= tm.leave) { a.fired.leave = now; a.fired.ready = a.fired.ready || now; changed = true; fireAlarm(a, 'leave'); }
      else if (!a.fired.ready && now >= tm.ready) { a.fired.ready = now; changed = true; fireAlarm(a, 'ready'); }
      // US-45: end of a stay: time to leave for the next part (not when the rider already left)
      (a.plan || []).forEach((l, k) => {
        if (l.type !== 'stay' || a.fired['stay' + k] || now < l.until || now - l.until > 10 * 60000) return;
        a.fired['stay' + k] = now; changed = true;
        if (a.stayGps && a.stayGps[k] === 'short') return;
        const r = a.plan.slice(k + 1).find(x => x.type === 'ride');
        if (r) fireTrip(t('stayEndNotify'), t('stayEndBody', { line: `${modeName(r.mode)} ${r.label}`, dep: hhmm(new Date(depOf(r))), stop: r.from.name }));
      });

      // switched off, due reminders are marked as passed so they don't ring when switched back on
      const due = (a.alights || []).map((x, n) => ({ x, n }))
        .filter(({ x, n }) => !a.fired['alight' + n] && now >= alightAt(a, x) && !(s.alightReminder !== false && gpsHolds(a, x, n, now)));
      if (due.length) {
        due.forEach(({ n }) => { a.fired['alight' + n] = now; });
        changed = true;
        const last = due[due.length - 1];
        if (s.alightReminder !== false && now - alightAt(a, last.x) < GPS_WAIT_MAX_MS + 60000) fireAlight(a, last.n);
      }
    }
    // forget alarms 10 min after the departure, or after the last get-off reminder
    const kept = list.filter(a => now <= Math.max(alarmTimes(a, s).dep, lastAlightAt(a), (a.plan && tripArrival(a.plan)) || 0) + 10 * 60000);
    if (changed || kept.length !== list.length) { saveAlarms(kept); renderAlarms(); }
  }

  // BUG-07: the run we follow, on a live departure board. The same line also leaves from the same stop in the other
  // direction (tram 14 at Les Esserts: Meyrin from platform A, Bernex from B, often in the same minute), so the
  // direction must match too: the get-off stop among its next stops, else its terminus. The closest time wins.
  const nameWords = s => new Set(String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean));
  function sameTerminus(x, y) {
    const a = nameWords(x), b = nameWords(y);
    if (!a.size || !b.size) return null;   // unknown
    const [small, big] = a.size <= b.size ? [a, b] : [b, a];
    return [...small].every(w => big.has(w));   // "Meyrin, Gravière" = "Meyrin-Gravière", "Carouge GE, Rondeau" = "Carouge-Rondeau"
  }
  function findRun(list, want, sched, schedOf, tol = 90000) {
    const near = (list || []).filter(j => String(j.category) === String(want.category) && String(j.number) === String(want.number)
      && Math.abs(schedOf(j) - sched) < tol);
    const direction = j => {
      const ids = (j.passList || []).slice(1).map(p => p.station && p.station.id).filter(Boolean);
      if (want.toStopId && ids.length) return ids.includes(want.toStopId);
      const same = sameTerminus(want.to, j.to);
      return same == null ? true : same;
    };
    const run = near.filter(direction).sort((x, y) => Math.abs(schedOf(x) - sched) - Math.abs(schedOf(y) - sched))[0] || null;
    return { run, lineThere: near.length > 0 };   // lineThere: the line runs then, maybe in the other direction only
  }
  // A platform change is what the board announces: its live platform differs from its own planned one.
  // (A planned platform that merely reads differently from the journey's is not a change.)
  function announcedPlatform(planned, live, ours) {
    const up = v => String(v || '').trim().toUpperCase();
    if (!up(live)) return null;
    if (up(planned) ? up(live) === up(planned) : up(live) === up(ours)) return null;
    return up(live) === up(ours) ? null : String(live).trim();
  }

  // US-17: follow the first vehicle on live data while the alarm is pending
  async function refreshAlarmsLive() {
    const list = getAlarms();
    let changed = false;
    const boards = new Map();   // one departure board per stop and refresh
    const boardOf = (id, from) => { if (!boards.has(id)) boards.set(id, data.board(id, from).catch(() => null)); return boards.get(id); };
    const schedOf = j => { const st = j.stop || {}; const d = st.departureTimestamp ? new Date(st.departureTimestamp * 1000) : parseTime(st.departure); return d ? d.getTime() : 0; };
    const now = Date.now();
    for (const a of list) {
      // US-35: each ride followed live at the stop before its get-off stop, during the hour before
      for (const [n, x] of (a.alights || []).entries()) {
        if (a.fired['alight' + n] || !x.prevId || x.at - now > 3600000 || now - alightAt(a, x) > 15 * 60000) continue;
        const r = await boardOf(x.prevId, new Date(Math.min(x.at, now) - LOOKBACK_MIN * 60000));
        const m = r && findRun(r.stationboard, { category: x.category, number: x.number, toStopId: x.stopId, to: x.to }, x.at, schedOf).run;
        if (!m) continue;
        const nm = normalize(m), liveAt = nm.real ? nm.real.getTime() : x.at;
        if (x.liveAt !== liveAt) { x.liveAt = liveAt; changed = true; }
      }
      if (a.fired.leave) continue;
      try {
        const r = await data.board(a.first.stopId, new Date(a.first.sched - LOOKBACK_MIN * 60000));
        const m = findRun(r.stationboard, a.first, a.first.sched, schedOf, 60000).run;
        if (!m) continue;
        const n = normalize(m);
        if (n.real) { a.live = { dep: n.real.getTime(), at: Date.now() }; changed = true; }
      } catch { /* keep the last known time */ }
    }
    // US-38: every ride of the followed journeys, at its boarding stop
    for (const a of list) {
      if (!a.plan) continue;
      if (await refreshTrip(a, boardOf, schedOf)) changed = true;
    }
    if (changed) { saveAlarmsMerged(list); renderAlarms(); tickAlarms(); }
  }
  // Save the live updates without undoing a change the rider made meanwhile (an alternative chosen: rev changed)
  function saveAlarmsMerged(updated) {
    const current = getAlarms();
    saveAlarms(current.map(c => { const u = updated.find(x => x.id === c.id); return u && (u.rev || 0) === (c.rev || 0) ? u : c; }));
  }

  // ---------- Followed journey (US-38) ----------
  // The plan of the journey is kept with its alarms (times in ms). Each ride is followed at its boarding stop:
  // live departure, platform, live arrival at the get-off stop. Connections are checked; when one is missed,
  // alternatives are looked for: the next run of the same line, another route from the change stop, or walking.
  const ms = d => d ? new Date(d).getTime() : null;
  function planOf(j) {
    return j.legs.map(l => l.type === 'ride'
      ? { type: 'ride', mode: l.mode, label: l.label, style: l.style, color: l.color, category: l.category, number: l.number, to: l.to,
          from: l.from, toStop: l.toStop, dep: ms(l.dep), real: ms(l.real), arr: ms(l.arr), arrReal: ms(l.arrReal),
          platform: l.platform || '', arrPlatform: l.arrPlatform || '', stops: l.stops,
          via: (l.via || []).map(v => ({ name: v.name, id: v.id, coord: v.coord, time: ms(v.time), depAt: ms(v.depAt), live: !!v.live })) }
      : l.type === 'stay' ? { type: 'stay', min: l.min, from: ms(l.from), until: ms(l.until), back: !!l.back, place: l.place }
      : { type: 'walk', min: l.min, meters: l.meters || null, start: l.start || null, end: l.end || null, edge: l.edge, to: l.to || '',
          samePlatform: !!l.samePlatform, apiMin: l.apiMin || null });
  }
  // Back to a journey with Date objects, for the helpers shared with the planner (get-off reminders)
  function hydrate(plan) {
    const D = v => v != null ? new Date(v) : null;
    const legs = plan.map(l => l.type !== 'ride' ? Object.assign({}, l) : Object.assign({}, l, {
      dep: D(l.dep), real: D(l.real), arr: D(l.arr), arrReal: D(l.arrReal),
      via: l.via.map(v => Object.assign({}, v, { time: D(v.time), depAt: D(v.depAt) })) }));
    return { legs, rides: legs.filter(l => l.type === 'ride') };
  }
  const depOf = r => r.real || r.dep, arrOf = r => r.arrReal || r.arr;
  const walkBetween = (plan, i, k) => plan.slice(i + 1, k).filter(l => l.type === 'walk').reduce((x, l) => x + l.min, 0);
  // Arrival at the destination: last ride + the walks after it (or a walk-only end)
  function tripArrival(plan) {
    let last = -1; plan.forEach((l, k) => { if (l.type === 'ride') last = k; });
    if (last < 0) return null;
    return arrOf(plan[last]) + walkBetween(plan, last, plan.length) * 60000;
  }
  // Changes: from ride at index i to the next ride at index k
  function tripConnections(plan) {
    const idx = plan.map((l, k) => l.type === 'ride' ? k : -1).filter(k => k >= 0);
    return idx.slice(0, -1).map((i, n) => [i, idx[n + 1]]).filter(([i, k]) => !plan.slice(i + 1, k).some(l => l.type === 'stay')).map(([i, k]) => {
      const cur = plan[i], next = plan[k];
      const ready = arrOf(cur) + walkBetween(plan, i, k) * 60000;
      const slack = Math.floor((depOf(next) - ready) / 60000);
      const walk = walkBetween(plan, i, k), gap = Math.floor(depOf(next) / 60000) - Math.floor(arrOf(cur) / 60000);
      return { i, k, cur, next, ready, slack, walk, gap, state: slack < 0 ? 'missed' : slack < 2 ? 'tight' : 'ok' };
    });
  }

  const COMFORT_MIN = 3;   // a change with at least 3 min to spare is comfortable
  // US-45 / US-46: a trip in parts. A part ends at a stay (or at the end); alternatives stay within their part.
  const segmentEnd = (plan, from) => { const k = plan.findIndex((l, n) => n >= from && l.type === 'stay'); return k < 0 ? plan.length : k; };
  const destAfter = (a, idx) => { const k = segmentEnd(a.plan, idx); return k < a.plan.length ? a.plan[k].place : a.dest; };
  const spliceSegment = (plan, from, legs) => [...plan.slice(0, from), ...legs, ...plan.slice(segmentEnd(plan, from))];
  // When the rider is at the end of a part: its last ride's arrival and the walks after it
  function arrivalBefore(plan, k) {
    let last = -1; plan.slice(0, k).forEach((l, n) => { if (l.type === 'ride') last = n; });
    if (last < 0) return null;
    return arrOf(plan[last]) + plan.slice(last + 1, k).filter(l => l.type === 'walk').reduce((x, l) => x + l.min, 0) * 60000;
  }
  // Next parts from a stay place, leaving from `at` (the rider leaves earlier or later than planned)
  async function findStayOptions(a, k, at) {
    const st = a.plan[k], dest = destAfter(a, k + 1);
    if (!st || !st.place || !dest) return [];
    const list = rankJourneys(await journeysBetween(st.place, dest, { mode: 'depart', at: new Date(at) }, null), 'fast', 'depart');
    return list.slice(0, 3).map(jj => ({ kind: 'stay', k, dep: (jj.rides[0].real || jj.rides[0].dep).getTime(), leave: jj.leaveAt.getTime(),
      arrive: jj.arriveAt.getTime(), lines: jj.rides.map(r => `${modeName(r.mode)} ${r.label}`).join(' › '), plan: planOf(jj) }));
  }
  // The rider leaves a stay earlier or later (button or position): options for the next part, shown at once.
  // The revision goes up so that a live refresh already under way does not overwrite them.
  async function requestStayOptions(id, k, at, reason) {
    const put = alts => { const list = getAlarms(), a = list.find(x => x.id === id); if (!a) return null; a.alts = alts; a.rev = (a.rev || 0) + 1; saveAlarms(list); renderAlarms(); return a; };
    const a = put({ for: 'stay' + k, reason, at: Date.now(), list: null });
    if (!a) return;
    let options = [];
    try { options = await findStayOptions(a, k, at); } catch { /* no route */ }
    put({ for: 'stay' + k, reason, at: Date.now(), list: options });
  }
  // US-44: left early / at the first stop early → earlier ways to the end of the first part
  const EARLY_MIN = 3;          // at least 3 min to wait at the stop: worth looking for earlier options
  async function findEarlier(a, idx) {
    const r = a.plan[idx], dest = destAfter(a, idx);
    if (!r.from.id || !dest) return [];
    const endAt = arrivalBefore(a.plan, segmentEnd(a.plan, idx));
    const from = { kind: 'stop', id: r.from.id, name: r.from.name, coord: r.from.coord };
    const list = await journeysBetween(from, dest, { mode: 'depart', at: new Date(a.early.eta + 60000) }, null);
    return list.filter(jj => (jj.rides[0].real || jj.rides[0].dep).getTime() >= a.early.eta + 60000 && jj.arriveAt.getTime() <= endAt - 60000)
      .sort((x, y) => x.arriveAt - y.arriveAt).slice(0, 2)
      .map(jj => ({ kind: 'early', fromIdx: idx, dep: (jj.rides[0].real || jj.rides[0].dep).getTime(), arrive: jj.arriveAt.getTime(),
        sooner: Math.floor(endAt / 60000) - Math.floor(jj.arriveAt.getTime() / 60000),
        lines: jj.rides.map(x => `${modeName(x.mode)} ${x.label}`).join(' › '), plan: planOf(jj) }));
  }
  async function refreshTrip(a, boardOf, schedOf) {
    const now = Date.now();
    let changed = false;
    // BUG-07: live data taken before runs were matched by direction may come from the other direction: start afresh once
    if (!a.runCheck) {
      for (const r of a.plan) if (r.type === 'ride') Object.assign(r, { real: null, arrReal: null, platformLive: null, arrPlatformLive: null, missing: false });
      a.runCheck = 1; changed = true;
    }
    for (const r of a.plan) {
      if (r.type !== 'ride' || arrOf(r) < now - 120000 || r.dep - now > 90 * 60000 || !r.from.id) continue;
      const board = await boardOf(r.from.id, new Date(Math.min(r.dep, now) - LOOKBACK_MIN * 60000));
      if (!board) continue;
      const list = board.stationboard || [];
      const found = findRun(list, { category: r.category, number: r.number, toStopId: r.toStop.id, to: r.to }, r.dep, schedOf);
      const m = found.run;
      const before = JSON.stringify([r.real, r.arrReal, r.platformLive, r.arrPlatformLive, r.missing]);
      if (!m) {
        // the board covers that time but the line is not there at all: probably cancelled

        const at = id => (m.passList || []).find(x => x.station && x.station.id === id);

        const live = p && (parseTime(p.prognosis && p.prognosis.arrival) || null);
        r.arrPlatformLive = p ? announcedPlatform(p.platform, p.prognosis && p.prognosis.platform, r.arrPlatform) : null;
        r.arrReal = live ? live.getTime() : (shift ? r.arr + shift : null);
        for (const v of r.via) {
          const q = at(v.id), lv = q && parseTime(q.prognosis && (q.prognosis.departure || q.prognosis.arrival));
          if (lv) { v.time = lv.getTime(); v.live = true; } else if (shift) { v.time = v.time + shift - (v.shift || 0); v.shift = shift; v.live = true; }
        }

          a.fired['plat' + r.dep] = r.platformLive;
          fireTrip(t('platformNotify'), t('platformBody', { line: `${modeName(r.mode)} ${r.label}`, p: t(r.mode === 'train' ? 'track' : 'platform', { p: r.platformLive }), stop: r.from.name }));
        }
      }
      if (JSON.stringify([r.real, r.arrReal, r.platformLive, r.arrPlatformLive, r.missing]) !== before) changed = true;
    }
    // get-off reminders follow the new live times of the rides
    const h = hydrate(a.plan);
    a.alights.forEach((x, n) => {
      const r = h.rides[n]; if (!r || a.fired['alight' + n]) return;
      const prev = r.via.length ? r.via[r.via.length - 1] : null;
      const liveAt = prev ? (prev.live ? prev.time : null) : r.real;
      if (liveAt && x.liveAt !== liveAt.getTime()) { x.liveAt = liveAt.getTime(); changed = true; }

    for (const c of tripConnections(a.plan)) {

      const key = 'miss' + c.next.dep;
      if (!a.fired[key]) {

        fireTrip(t('missedNotify'), t('missedNotifyBody', { stop: c.cur.toStop.name, line: `${modeName(c.next.mode)} ${c.next.label}`,
          dep: hhmm(new Date(depOf(c.next))), arr: hhmm(new Date(c.ready)) }));
      }
      if (!a.alts || a.alts.for !== c.next.dep || now - a.alts.at > 2 * 60000) {

        a.alts.list = await findAlternatives(a, c, boardOf, schedOf);
        changed = true;
      }
      break;   // the first broken change decides what comes next
    }
    // US-44: left early or at the first stop early: earlier ways, refreshed every 3 min
    const firstIdx = a.plan.findIndex(l => l.type === 'ride');
    if (a.early && firstIdx >= 0 && depOf(a.plan[firstIdx]) > now) {
      const wait = Math.floor((depOf(a.plan[firstIdx]) - a.early.eta) / 60000);
      if (wait >= EARLY_MIN && (!a.alts || a.alts.for !== 'early' || now - a.alts.at > 3 * 60000)) {

    // US-45: a delay makes a stay at least 2 min shorter than chosen: the next part a little later, keeping the time chosen
    for (const [k, l] of a.plan.entries()) {
      if (l.type !== 'stay' || l.until < now) continue;
      const arrive = arrivalBefore(a.plan, k);
      if (arrive == null) continue;
      const left = Math.floor((l.until - arrive) / 60000);
      if (left <= l.min - 2 && a.fired['late' + k] !== l.until) {
        a.fired['late' + k] = l.until; changed = true;
        a.alts = { for: 'stay' + k, reason: 'late', at: now, list: null, n: Math.max(0, left), m: l.min };
        try { a.alts.list = await findStayOptions(a, k, arrive + l.min * 60000); } catch { a.alts.list = []; }
      }
    }
    // US-39: a tight change (no missed one): look for options with a comfortable margin
    const missedOne = tripConnections(a.plan).some(c => (c.state === 'missed' || c.next.missing) && depOf(c.next) > now - 10 * 60000);
    const busy = a.alts && /^(stay|early)/.test(String(a.alts.for)) && now - a.alts.at < 5 * 60000;   // the rider's own options first
    const tight = !missedOne && !busy && tripConnections(a.plan).find(c => c.state === 'tight' && depOf(c.cur) > now - 60000);
    if (tight && (!a.alts || a.alts.for !== 'tight' + tight.next.dep || now - a.alts.at > 2 * 60000)) {
      a.alts = { for: 'tight' + tight.next.dep, at: now, list: null };
      a.alts.list = await findComfortable(a, tight, boardOf, schedOf);
      changed = true;
    }
    return changed;
  }

  // Options for a tight change, each with at least COMFORT_MIN to spare: an earlier first ride (before leaving),
  // a later run of the next line, another route from where the tight ride starts.
  async function findComfortable(a, c, boardOf, schedOf) {
    const out = [], now = Date.now(), plan = a.plan;
    const rides = plan.filter(l => l.type === 'ride');
    const isFirst = rides[0] === c.cur;
    const leadMin = isFirst ? (alarmTimes(a).walk + getSettings().marginMin) : 0;   // time to reach the first stop
    const same = (j, r) => String(j.category) === String(r.category) && String(j.number) === String(r.number);
    const arrivalAt = (j, id) => { const p = (j.passList || []).find(x => x.station && x.station.id === id); return p && (parseTime(p.prognosis && p.prognosis.arrival) || parseTime(p.arrival)); };
    // 1. an earlier run of the tight ride (only for the first ride, before boarding)
    if (isFirst && depOf(c.cur) > now) {
      try {
        const board = await boardOf(c.cur.from.id, new Date(now - LOOKBACK_MIN * 60000));
        const runs = ((board && board.stationboard) || []).filter(j => same(j, c.cur) && (j.passList || []).some(p => p.station && p.station.id === c.cur.toStop.id))
          .map(j => ({ j, n: normalize(j) })).filter(({ n }) => n.sched && n.sched.getTime() < c.cur.dep - 30000 && (n.real || n.sched).getTime() >= now + leadMin * 60000)
          .sort((x, y) => (y.n.real || y.n.sched) - (x.n.real || x.n.sched));
        for (const { j, n } of runs) {
          const dep = (n.real || n.sched).getTime(), arr = arrivalAt(j, c.cur.toStop.id);
          const arrMs = arr ? arr.getTime() : dep + (arrOf(c.cur) - depOf(c.cur));
          const margin = Math.floor((depOf(c.next) - arrMs) / 60000) - c.walk;
          if (margin < COMFORT_MIN) continue;
          out.push({ kind: 'earlier', dep, sched: n.sched.getTime(), real: n.real ? n.real.getTime() : null, arrCur: arrMs, margin,
                     leave: dep - leadMin * 60000, arrive: tripArrival(plan), line: `${modeName(c.cur.mode)} ${c.cur.label}`, stop: c.cur.toStop.name });
          break;
        }
      } catch { /* no board */ }
    }
    // 2. a later run of the next line, caught with a comfortable margin
    try {
      const board = await boardOf(c.next.from.id, new Date(c.ready - 5 * 60000));
      const runs = ((board && board.stationboard) || []).filter(j => same(j, c.next) && (j.passList || []).some(p => p.station && p.station.id === c.next.toStop.id))
        .map(j => ({ j, n: normalize(j) })).filter(({ n }) => n.sched && n.sched.getTime() > c.next.dep + 30000 && (n.real || n.sched).getTime() >= c.ready + COMFORT_MIN * 60000)
        .sort((x, y) => (x.n.real || x.n.sched) - (y.n.real || y.n.sched));
      if (runs.length) {
        const { j, n } = runs[0], dep = (n.real || n.sched).getTime(), arr = arrivalAt(j, c.next.toStop.id);
        const arrNext = arr ? arr.getTime() : dep + (arrOf(c.next) - depOf(c.next));
        out.push({ kind: 'next', dep, sched: n.sched.getTime(), real: n.real ? n.real.getTime() : null, arrNext,
                   margin: Math.floor((dep - c.ready) / 60000), arrive: tripArrival(plan) + (arrNext - arrOf(c.next)), line: `${modeName(c.next.mode)} ${c.next.label}`, stop: c.cur.toStop.name });
      }
    } catch { /* no board */ }
    // 3. another route from where the tight ride starts, every change comfortable
    try {
      const segDest = destAfter(a, plan.indexOf(c.cur));
      if (segDest && c.cur.from.id && (!isFirst || depOf(c.cur) > now)) {
        const from = c.cur.from, ctx = { from: { kind: 'stop', id: from.id, name: from.name, coord: from.coord }, to: segDest };
        const toC = await candidates(segDest, 2);
        const start = new Date(Math.max(now + leadMin * 60000, depOf(c.cur) - 15 * 60000));
        const lists = await Promise.all(toC.filter(b => b.id !== from.id).map(b => fetchConnections({ id: from.id, name: from.name, coord: from.coord, meters: 0 }, b,
          { mode: 'depart', at: start }, null, ctx).catch(() => [])));
        const minSlack = jj => { const cs = tripConnections(planOf(jj)); return cs.length ? Math.min(...cs.map(x => x.slack)) : 99; };
        const sameRides = jj => jj.rides.map(r => r.label + '@' + r.dep.getTime()).join() === rides.slice(rides.indexOf(c.cur)).map(r => r.label + '@' + r.dep).join();
        lists.flat().filter(jj => !sameRides(jj) && minSlack(jj) >= COMFORT_MIN && (jj.rides[0].real || jj.rides[0].dep).getTime() >= now + leadMin * 60000)
          .sort((x, y) => x.arriveAt - y.arriveAt).slice(0, 2)
          .forEach(jj => out.push({ kind: 'replan', dep: (jj.rides[0].real || jj.rides[0].dep).getTime(), arrive: jj.arriveAt.getTime(), margin: Math.min(minSlack(jj), 99),
            lines: jj.rides.map(r => `${modeName(r.mode)} ${r.label}`).join(' › '), plan: planOf(jj), fromIdx: plan.indexOf(c.cur) }));
      }
    } catch { /* no route */ }
    const seen = new Set();
    return out.filter(o => { const k = o.kind + o.dep + (o.lines || ''); if (seen.has(k)) return false; seen.add(k); return true; })
      .sort((x, y) => x.arrive - y.arrive || y.margin - x.margin).slice(0, 3);
  }

  // The first ride changed (earlier bus, other route): departure alarms follow it
  function syncFirst(a) {
    const r = a.plan.find(l => l.type === 'ride'); if (!r) return;
    Object.assign(a.first, { stopId: r.from.id, stopName: r.from.name, stopCoord: r.from.coord, category: r.category, number: r.number,
      mode: r.mode, label: r.label, style: r.style, to: r.to, sched: r.dep, platform: r.platform });
    a.live = r.real ? { dep: r.real, at: Date.now() } : null;
    a.created0 = depOf(r);
    const k = a.plan.indexOf(r);
    a.apiWalkBefore = a.plan.slice(0, k).filter(l => l.type === 'walk' && l.edge !== 'access').reduce((x, l) => x + l.min, 0);
    const tm = alarmTimes(a), now = Date.now();
    if (tm.ready > now) delete a.fired.ready;
    if (tm.leave > now) delete a.fired.leave;
  }

  async function findAlternatives(a, c, boardOf, schedOf) {
    const out = [], T = c.cur.toStop, dest = destAfter(a, c.i);
    // 1. the next run of the same line, same direction, that can still be caught
    try {
      const board = await boardOf(c.next.from.id, new Date(c.ready - 5 * 60000));
      const runs = ((board && board.stationboard) || []).filter(j => String(j.category) === String(c.next.category) && String(j.number) === String(c.next.number)
        && (j.passList || []).some(p => p.station && p.station.id === c.next.toStop.id))
        .map(j => ({ j, n: normalize(j) })).filter(({ n }) => n.sched && (n.real || n.sched).getTime() >= c.ready && n.sched.getTime() > c.next.dep + 30000)
        .sort((x, y) => (x.n.real || x.n.sched) - (y.n.real || y.n.sched));
      if (runs.length) {
        const { j, n } = runs[0], dep = (n.real || n.sched).getTime();
        const p = (j.passList || []).find(x => x.station && x.station.id === c.next.toStop.id);
        const arrStop = (p && (parseTime(p.prognosis && p.prognosis.arrival) || parseTime(p.arrival))) || null;
        const arrNext = arrStop ? arrStop.getTime() : dep + (arrOf(c.next) - depOf(c.next));
        const shiftAfter = arrNext - arrOf(c.next);
        out.push({ kind: 'next', dep, sched: n.sched.getTime(), real: n.real ? n.real.getTime() : null, arrNext,
                   arrive: tripArrival(a.plan) + shiftAfter, line: `${modeName(c.next.mode)} ${c.next.label}`, mode: c.next.mode, style: c.next.style, label: c.next.label });
      }
    } catch { /* no board */ }
    // 2. another route from the change stop to the destination
    try {
      if (dest && T.id) {
        const ctx = { from: { kind: 'stop', id: T.id, name: T.name, coord: T.coord }, to: dest };
        const toC = await candidates(dest, 2);
        const lists = await Promise.all(toC.filter(b => b.id !== T.id).map(b => fetchConnections({ id: T.id, name: T.name, coord: T.coord, meters: 0 }, b,
          { mode: 'depart', at: new Date(c.ready) }, null, ctx).catch(() => [])));
        const sameAsNext = jj => jj.rides[0].label === c.next.label && Math.abs(jj.rides[0].dep - c.next.dep) < 90000;
        lists.flat().filter(jj => jj.leaveAt.getTime() >= c.ready - 60000 && !sameAsNext(jj))
          .sort((x, y) => x.arriveAt - y.arriveAt).slice(0, 2)
          .forEach(jj => out.push({ kind: 'replan', dep: (jj.rides[0].real || jj.rides[0].dep).getTime(), arrive: jj.arriveAt.getTime(),
            lines: jj.rides.map(r => `${modeName(r.mode)} ${r.label}`).join(' › '), first: jj.rides[0], plan: planOf(jj) }));
      }
    } catch { /* no route */ }
    // 3. finishing on foot from the change stop
    if (dest && dest.coord && T.coord) {
      const straight = distanceM(T.coord, dest.coord), min = walkMinutes(straight);
      if (min <= Math.max(25, getSettings().footMaxMin)) {
        const end = { name: ['saved', 'addr', 'stop'].includes(dest.kind) ? placeLabel(dest) : t('yourDestination'), coord: dest.coord };
        out.push({ kind: 'foot', min, meters: straight * DETOUR, arrive: arrOf(c.cur) + min * 60000, stop: T.name,
                   start: { name: T.name, stopId: T.id, coord: T.coord, platform: c.cur.arrPlatform, mode: c.cur.mode }, end });
      }
    }
    // the same alternative twice (same first ride): keep one
    const seen = new Set();
    return out.filter(o => { const k = o.kind + (o.dep || '') + (o.lines || ''); if (seen.has(k)) return false; seen.add(k); return true; })
      .sort((x, y) => x.arrive - y.arrive);
  }

  // The rider picks an alternative: the rest of the journey after the missed change is replaced
  function applyAlternative(id, n) {
    const list = getAlarms(), a = list.find(x => x.id === id);
    if (!a || !a.alts || !a.alts.list || !a.alts.list[n]) return;
    const o = a.alts.list[n];
    let what, firstChanged = false, keepFrom = null;
    if (o.kind === 'stay' || o.kind === 'early') {
      const from = o.kind === 'stay' ? o.k + 1 : o.fromIdx;
      if (o.kind === 'stay') { const st = a.plan[o.k]; st.until = o.leave; st.changed = true; if (a.stayGps) delete a.stayGps[o.k]; delete a.fired['stay' + o.k]; }
      a.plan = spliceSegment(a.plan, from, o.plan);
      what = `${o.lines} ${hhmm(new Date(o.dep))}`; keepFrom = from;
      if (o.kind === 'early') { const keep = { ready: a.fired.ready, leave: a.fired.leave }; syncFirst(a); Object.assign(a.fired, keep); }
    }
    const forDep = String(a.alts.for).replace(/^tight/, '');
    const c = keepFrom != null ? null : tripConnections(a.plan).find(x => String(x.next.dep) === forDep);
    if (keepFrom == null && !c) return;
    if (keepFrom != null) { /* applied above */ }
    else if (o.kind === 'earlier') {
      const r = a.plan[c.i], shift = o.sched - r.dep;
      Object.assign(r, { dep: o.sched, real: o.real, arr: r.arr + shift, arrReal: o.arrCur, platformLive: null, arrPlatformLive: null, missing: false });
      r.via.forEach(v => { v.time += shift; v.depAt = v.depAt ? v.depAt + shift : null; v.shift = 0; });
      what = `${o.line} ${hhmm(new Date(o.dep))}`; firstChanged = true;
    } else if (o.kind === 'replan' && o.fromIdx != null) {
      a.plan = spliceSegment(a.plan, o.fromIdx, o.plan);
      what = o.lines; firstChanged = o.fromIdx <= a.plan.findIndex(l => l.type === 'ride');
    } else if (o.kind === 'next') {
      const r = a.plan[c.k], shift = o.sched - r.dep;
      Object.assign(r, { dep: o.sched, real: o.real, arr: r.arr + shift, arrReal: o.arrNext, platformLive: null, arrPlatformLive: null, missing: false });
      r.via.forEach(v => { v.time += shift; v.depAt = v.depAt ? v.depAt + shift : null; v.shift = 0; });
      // later rides are followed live again as they are
      what = `${o.line} ${hhmm(new Date(o.dep))}`;
    } else if (o.kind === 'replan') {
      a.plan = spliceSegment(a.plan, c.i + 1, o.plan);
      what = o.lines;
    } else {
      a.plan = spliceSegment(a.plan, c.i + 1, [{ type: 'walk', min: o.min, meters: o.meters, start: o.start, end: o.end, edge: 'egress', to: '' }]);
      what = t('altFoot', { stop: o.stop }).replace(/^🚶\s*/, '');
    }
    if (firstChanged) syncFirst(a);
    // get-off reminders: rides already done keep theirs, the new ones are planned afresh
    const keepUpTo = keepFrom != null ? keepFrom : o.kind === 'earlier' ? c.i : o.kind === 'replan' && o.fromIdx != null ? o.fromIdx : c.i + 1;
    const nDone = a.plan.slice(0, keepUpTo).filter(l => l.type === 'ride').length;
    const fresh = alightPlan(hydrate(a.plan)).map((x, k) => k < nDone ? Object.assign(a.alights[k] || x, {}) : Object.assign(x, { noShift: true }));
    Object.keys(a.fired).filter(k => /^alight\d+$/.test(k) && +k.slice(6) >= nDone).forEach(k => delete a.fired[k]);
    if (a.gpsSeen) Object.keys(a.gpsSeen).filter(k => +k >= nDone).forEach(k => delete a.gpsSeen[k]);
    a.alights = fresh;
    a.alts = null; a.rev = (a.rev || 0) + 1;
    saveAlarms(list); renderAlarms(); tickAlarms();
    showToast(t('altApplied', { what }), null);
  }

  function fireTrip(title, body) {
    $('abTitle').textContent = '🔔 ' + title;
    $('abBody').textContent = body;
    $('abTrack').hidden = true;
    $('alarmBanner').dataset.kind = 'trip';
    $('alarmBanner').hidden = false;
    beep();
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch { /* no vibration */ }
    notify(title, body);
  }

  // US-45: a stay in the followed trip: when, and what to do if it ends earlier or later than planned
  function altButtons(list, title, detail) {
    return list.map((o, n) => `<button class="trip-alt${n === 0 ? ' best' : ''}" data-act="alt" data-n="${n}"><span>${esc(title(o))}</span><small>${esc(detail(o))}</small></button>`).join('');
  }
  function stayRowHtml(a, l, k, now) {
    const arrive = arrivalBefore(a.plan, k) || l.from;
    const head = t(l.back ? 'stayReturn' : 'stayTitle', { place: l.place.name, min: fmtMin(l.min) });
    const when = t('stayUntil', { from: hhmm(new Date(arrive)), until: hhmm(new Date(l.until)) });
    const active = l.until > now - 15 * 60000 && arrive - now < 3 * 3600000;
    const actions = active ? `<div class="stay-actions"><button class="ghost" data-act="stay-now" data-k="${k}">${esc(t('stayNow'))}</button>` +
      `<button class="ghost" data-act="stay-more" data-k="${k}">${esc(t('stayMore'))}</button></div>` : '';
    let opts = '';
    if (a.alts && a.alts.for === 'stay' + k) {
      const al = a.alts, place = l.place.name;
      const intro = al.reason === 'short' ? t('stayShort', { place }) : al.reason === 'long' ? t('stayLong', { place })
        : al.reason === 'late' ? t('stayLate', { n: al.n, m: al.m }) : t('stayOptions', { place });
      opts = al.list == null ? `<small>${esc(t('altLoading'))}</small>` : !al.list.length ? `<small>${esc(t('stayOptionsNone', { place }))}</small>` :
        `<small>${esc(intro)}</small>` + altButtons(al.list, o => t('altStay', { lines: o.lines, dep: hhmm(new Date(o.dep)) }),
          o => t('altStayDetail', { t: hhmm(new Date(o.arrive)), leave: hhmm(new Date(o.leave)) }));
    }
    return `<li class="tl stay"><b>${l.back ? '⇄' : '⏸'} ${esc(head)}</b><small>${esc(when)}</small>${actions}${opts}</li>`;
  }
  // US-44: left early / at the stop early
  function earlyHtml(a, now) {
    const e = a.early, r = a.plan && a.plan.find(l => l.type === 'ride');
    if (!e || !r || depOf(r) <= now) return '';
    const n = Math.max(0, Math.floor((depOf(r) - e.eta) / 60000)), line = `${modeName(r.mode)} ${r.label}`;
    const where = e.atStop ? t('earlyAtStop', { stop: r.from.name, n, line }) : t('earlyOnWay', { stop: r.from.name, t: hhmm(new Date(e.eta)), n, line });
    const list = a.alts && a.alts.for === 'early' && a.alts.list ? a.alts.list : [];
    const opts = list.length ? `<small>${esc(t('earlyOptions'))}</small>` + altButtons(list, o => t('altEarly', { lines: o.lines, dep: hhmm(new Date(o.dep)) }),
      o => t('altEarlyDetail', { t: hhmm(new Date(o.arrive)), n: o.sooner })) : '';
    return `<div class="early">${e.silenced ? `<div>${esc(t('earlyLeft'))}</div>` : ''}<div>${esc(where)}</div>${opts}</div>`;
  }

  const tripViaOpen = new Set();   // unfolded stop lists of followed rides
  function tripHtml(a) {
    if (!a.plan) return '';
    const now = Date.now(), plan = a.plan;
    const arrive = tripArrival(plan);
    const live = plan.some(l => l.type === 'ride' && (l.real || l.arrReal));
    const rides = plan.filter(l => l.type === 'ride');
    // where am I: on board, waiting for the next ride, walking, or done
    let state;
    const onBoard = rides.find(r => depOf(r) <= now && arrOf(r) > now);
    const nextRide = rides.find(r => depOf(r) > now);
    if (arrive && now > arrive) state = t('tripDone');
    else if (onBoard) state = t('tripNowRide', { line: `${modeName(onBoard.mode)} ${onBoard.label}`, stop: onBoard.toStop.name, t: hhmm(new Date(arrOf(onBoard))) });
    else if (nextRide) {
      const p = nextRide.platformLive || nextRide.platform;
      state = t('tripNowWait', { line: `${modeName(nextRide.mode)} ${nextRide.label}`, t: hhmm(new Date(depOf(nextRide))), stop: nextRide.from.name,
        plat: p ? ` (${t(nextRide.mode === 'train' ? 'track' : 'platform', { p })})` : '' });
    } else state = t('tripNowWalk', { to: placeLabel(a.dest) || t('yourDestination') });
    const stayNow = plan.find(l => l.type === 'stay' && arrivalBefore(plan, plan.indexOf(l)) <= now && l.until > now);
    if (stayNow && !onBoard) state = t(stayNow.back ? 'stayReturn' : 'stayTitle', { place: stayNow.place.name, min: fmtMin(stayNow.min) }) + ' · ' +
      t('stayUntil', { from: hhmm(new Date(arrivalBefore(plan, plan.indexOf(stayNow)))), until: hhmm(new Date(stayNow.until)) });
    const tm = v => hhmm(new Date(v));
    const timeHtml = (planned, real) => real && Math.floor(real / 60000) !== Math.floor(planned / 60000)
      ? `<span class="was">${tm(planned)}</span><time class="late">${tm(real)}</time>` : `<time>${tm(planned)}</time>`;
    const curIdx = plan.findIndex(l => l.type === 'ride' ? arrOf(l) > now : false);
    // live waiting time at each change, shown on the ride taken after it
    const changes = new Map(tripConnections(plan).map(c => [c.k, c]));
    const waitHtml = k => {
      const c = changes.get(k); if (!c || arrOf(c.cur) < now - 60000 && depOf(c.next) < now) return '';
      return changeWaitHtml(plan, c);
    };
    const rows = plan.map((l, k) => {
      if (l.type === 'stay') return stayRowHtml(a, l, k, now);
      if (l.type === 'walk') {
        const ends = walkEnds(plan, k), end = ends.end;
        if (l.samePlatform && samePlace(ends.start, end)) return samePlatformRow(plan, k, 'tl change');
        const map = l.start && l.end && (l.start.coord || l.start.stopId) && (l.end.coord || l.end.stopId)
          ? `<button class="ghost walk-map" data-act="walk-map" data-leg="${k}">${MAP_ICON}${esc(t('walkOnMap'))}</button>` : '';
        if (l.samePlatform) {   // the next ride moved to another platform: a walk again
          const name = end.name + (end.platform ? ` (${t(end.mode === 'train' ? 'track' : 'platform', { p: end.platform })})` : '');
          return `<li class="tl walk changed"><span>🚶 ${esc(t('platformMoved', { name }))}</span>${map}</li>`;
        }
        const toName = end && end.name ? end.name + (end.platform ? ` (${t(end.mode === 'train' ? 'track' : 'platform', { p: end.platform })})` : '') : l.to || '';
        const to = l.edge === 'egress' ? t('walkToDest') : t('walkTo', { name: toName });
        return `<li class="tl walk"><span>🚶 ${esc(t('walkMin', { min: fmtMin(l.min) }))} — ${esc(to)}</span>${map}</li>`;
      }
      const done = arrOf(l) < now - 30000, boarded = depOf(l) <= now && !done, isNext = k === curIdx && !boarded;
      const cls = done ? ' done' : boarded ? ' now' : isNext ? ' now' : '';
      const chip = done ? t('chipDone') : boarded ? t('chipOnBoard') : isNext ? t('chipNext') : '';
      // the platform is a button: tap it to see it on the map (the live one when it changed)
      const plat = l.platformLive
        ? ` ${platformChip(l.platformLive, l.mode, l.from).replace('class="plat"', 'class="plat changed"')} <small>(${esc(t('wasPlat', { p: l.platform }))})</small>`
        : ` ${placeChip(l.platform, l.mode, l.from)}`;
      const arrP = l.arrPlatformLive || l.arrPlatform;
      const arrPlat = ` ${placeChip(arrP, l.mode, l.toStop)}`;
      const colour = l.color ? ` style="--lc:${esc(l.color)}"` : '';
      // number of stops and time on board, intermediate stops with their live times (as when planning)
      const rideMin = Math.max(0, Math.round((arrOf(l) - depOf(l)) / 60000));
      const nStops = l.stops != null ? l.stops : l.via.length + 1;
      const count = (nStops === 1 ? t('stops1') : t('stopsCount', { n: nStops })) + ' · ' + fmtDuration(rideMin);
      const vkey = `${a.id}#${l.dep}#${k}`, unfolded = tripViaOpen.has(vkey);
      const nextVia = boarded ? l.via.findIndex(v => v.time > now) : -1;
      const via = l.via.length
        ? `<button class="via-toggle" data-act="via" data-key="${esc(vkey)}" aria-expanded="${unfolded}">${esc(count)}</button>` +
          `<ul class="via"${unfolded ? '' : ' hidden'}>${l.via.map((v, n) => {
            const last = n === l.via.length - 1, passed = boarded && v.time < now;
            const cls = [last ? 'next-off' : '', passed ? 'passed' : '', n === nextVia ? 'here' : ''].filter(Boolean).join(' ');
            const note = last ? ` <small>· ${esc(t('nextOff'))}</small>` : n === nextVia ? ` <small>· ${esc(t('nextStopShort'))}</small>` : '';
            return `<li${cls ? ` class="${cls}"` : ''}><time${v.live ? ' class="live"' : ''}>${v.time ? tm(v.time) : ''}</time><span>${esc(v.name)}${note}</span></li>`;
          }).join('')}</ul>`
        : `<div class="ride-meta">${esc(count)}</div>`;
      return `<li class="tl ride${cls}"${colour}><div class="tl-line">${lineIdHtml(l.mode, l.style, l.label, true)}<span>→ ${esc(l.to)}</span>` +
        `${chip ? `<span class="chip">${esc(chip)}</span>` : ''}</div>` + waitHtml(k) +
        `<div>${timeHtml(l.dep, l.real)} ${esc(l.from.name)}${plat}</div>` +
        (l.missing ? `<div class="changed">${esc(t('notLive'))}</div>` : '') + via +
        `<div>${timeHtml(l.arr, l.arrReal)} ${esc(l.toStop.name)}${arrPlat}</div></li>`;
    }).join('');
    // a broken or tight connection, with what can be done
    let warn = '';
    const broken = tripConnections(plan).find(c => (c.state !== 'ok' || c.next.missing) && depOf(c.next) > now - 10 * 60000);
    if (broken) {
      const missed = broken.state === 'missed' || broken.next.missing;
      const vars = { stop: broken.cur.toStop.name, line: `${modeName(broken.next.mode)} ${broken.next.label}`, arr: tm(broken.ready), dep: tm(depOf(broken.next)), n: broken.slack,
                     walk: broken.walk, gap: broken.gap, arrRide: tm(arrOf(broken.cur)),
                     spare: broken.slack <= 0 ? t('spareNone') : t('spareN', { n: broken.slack }) };
      let alts = '';
      if (!missed) {
        const list = a.alts && a.alts.for === 'tight' + broken.next.dep ? a.alts.list : null;
        alts = list == null ? `<small>${esc(t('altLoading'))}</small>` : !list.length ? '' :
          `<small>${esc(t('comfortTitle'))}</small>` + list.map((o, n) => {
            const title = o.kind === 'earlier' ? t('altEarlier', { line: o.line, dep: tm(o.dep) })
              : o.kind === 'next' ? t('altNext', { line: o.line, dep: tm(o.dep) })
              : t('altReplan', { lines: o.lines, dep: tm(o.dep) });
            const detail = o.kind === 'earlier' ? t('altEarlierDetail', { m: o.margin, leave: tm(o.leave) })
              : t('altMarginDetail', { m: Math.min(o.margin, 60), t: tm(o.arrive) });
            return `<button class="trip-alt" data-act="alt" data-n="${n}"><span>${esc(title)}</span><small>${esc(detail)}</small></button>`;
          }).join('');
      }
      if (missed) {
        const list = a.alts && a.alts.for === broken.next.dep ? a.alts.list : null;
        alts = list == null ? `<small>${esc(t('altLoading'))}</small>` : !list.length ? `<small>${esc(t('altNone'))}</small>` :
          list.map((o, n) => {
            const title = o.kind === 'next' ? t('altNext', { line: o.line, dep: tm(o.dep) })
              : o.kind === 'replan' ? t('altReplan', { lines: o.lines, dep: tm(o.dep) })
              : t('altFoot', { stop: o.stop }) + ` · ${fmtMin(o.min)} min`;
            return `<button class="trip-alt${n === 0 ? ' best' : ''}" data-act="alt" data-n="${n}"><span>${esc(title)}</span>` +
              `<small>${esc(t('altArrive', { t: tm(o.arrive) }))}${n === 0 && list.length > 1 ? esc(t('altBest')) : ''}</small></button>`;
          }).join('');
      }
      warn = `<div class="trip-warn${missed ? '' : ' tight'}"><b>${esc(t(missed ? 'missedTitle' : 'tightTitle', vars))}</b>` +
        `<span>${esc(missed ? t('missedBody', vars) : t(broken.walk ? 'tightBodyWalk' : 'tightBodyNoWalk', vars))}</span>${alts}</div>`;
    }
    // with a missed connection, the planned arrival no longer holds
    const lost = broken && (broken.state === 'missed' || broken.next.missing);
    const head = lost ? `${esc(t('arriveAt', { t: '' }))}<span class="was">${arrive ? tm(arrive) : ''}</span> <span class="changed">${esc(t('arrivalLost'))}</span>`
      : `${esc(t('arriveAt', { t: arrive ? tm(arrive) : '—' }))} · <small>${esc(t(live ? 'tripLive' : 'tripPlanned'))}</small>`;
    return `<div class="trip"><div class="trip-head"><span>${head}</span></div>` +
      `<div class="trip-now">${esc(state)}</div>${earlyHtml(a, now)}${warn}<ol class="trip-legs">${rows}</ol></div>`;
  }

  // ---------- Ringing: banner, sound, vibration, notification ----------
  let audioCtx = null;
  function unlockAudio() {
    try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch { audioCtx = null; }
  }
  function beep() {
    if (!audioCtx) return;
    try {
      [0, 0.35, 0.7].forEach(dt => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = 880; g.gain.value = 0.15;
        o.connect(g); g.connect(audioCtx.destination);
        o.start(audioCtx.currentTime + dt); o.stop(audioCtx.currentTime + dt + 0.2);
      });
    } catch { /* no sound */ }
  }

  // ---------- Learning the walking speed (US-19) ----------
  const LEARN_ALPHA = 0.3;    // weight of a new walk in the moving average
  const MIN_WALK_M = 150, MIN_WALK_S = 90, MIN_KMH = 2.5, MAX_KMH = 7.5, MAX_ACCURACY_M = 35;
  let walkWatch = null, walkTrack = [], walkTimer = null;

  // Path length of a GPS track, ignoring jitter below 5 m and imprecise fixes
  function measureWalk(track) {
    const pts = track.filter(p => (p.acc == null || p.acc <= MAX_ACCURACY_M));
    if (pts.length < 3) return { ok: false, why: 'few' };
    let meters = 0, anchor = pts[0];
    for (const p of pts.slice(1)) {
      const d = distanceM([anchor.lat, anchor.lon], [p.lat, p.lon]);
      if (d >= 5) { meters += d; anchor = p; }
    }
    const sec = (pts[pts.length - 1].t - pts[0].t) / 1000;
    if (meters < MIN_WALK_M || sec < MIN_WALK_S) return { ok: false, why: 'short', meters, sec };
    const kmh = meters / sec * 3.6;
    if (kmh < MIN_KMH || kmh > MAX_KMH) return { ok: false, why: 'speed', meters, sec, kmh };
    return { ok: true, meters, sec, kmh };
  }
  function learnSpeed(kmh) {
    const s = getSettings();
    s.speedKmh = Math.round((LEARN_ALPHA * kmh + (1 - LEARN_ALPHA) * s.speedKmh) * 10) / 10;
    s.learned = (s.learned || 0) + 1;
    s.samples = [...(s.samples || []), { kmh: Math.round(kmh * 10) / 10, at: Date.now() }].slice(-20);
    saveSettings(s);
    return s;
  }
  function learnFromTrack(track) {
    const r = measureWalk(track);
    if (!r.ok) return t('walkNotUsed', { why: t('why_' + r.why) });
    const s = learnSpeed(r.kmh);
    renderSettings(); renderAlarms();
    const mm = Math.floor(r.sec / 60), ss = String(Math.round(r.sec % 60)).padStart(2, '0');
    return t('learnedSpeed', { d: fmtDistance(r.meters), time: `${mm}:${ss}`, kmh: r.kmh.toFixed(1), speed: s.speedKmh.toFixed(1), n: s.learned });
  }

  function startWalkTracking(a) {
    if (!navigator.geolocation || !a.first.stopCoord) return;
    stopWalkTracking();
    walkTrack = [];
    const dest = a.first.stopCoord;
    $('walkStatus').hidden = false;
    $('walkStatusText').textContent = t('measuring', { stop: a.first.stopName, d: '0 m' });
    walkWatch = navigator.geolocation.watchPosition(pos => {
      walkTrack.push({ lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy, t: pos.timestamp || Date.now() });
      const done = measureWalk(walkTrack);
      $('walkStatusText').textContent = t('measuring', { stop: a.first.stopName, d: fmtDistance(done.meters || 0) });
      if (distanceM([pos.coords.latitude, pos.coords.longitude], dest) <= 35) finishWalkTracking();   // arrived at the stop
    }, () => { $('walkStatusText').textContent = t('noLocation'); }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
    walkTimer = setTimeout(finishWalkTracking, 40 * 60000);
  }
  function stopWalkTracking() {
    if (walkWatch != null) { navigator.geolocation.clearWatch(walkWatch); walkWatch = null; }
    clearTimeout(walkTimer);
  }
  function finishWalkTracking() {
    if (walkWatch == null) return;
    stopWalkTracking();
    $('walkStatusText').textContent = learnFromTrack(walkTrack);
  }

  // TECH-04: a synthetic GPS track (fix every 5 s, a few metres of jitter) fed into the same learning
  function simulatedTrack(kmh, start, meters = 600) {
    const pts = [], stepS = 5, total = meters / (kmh / 3.6);
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647 - 0.5;   // deterministic jitter
    const mPerDegLat = 111320, mPerDegLon = 111320 * Math.cos(start[0] * Math.PI / 180);
    for (let s = 0; s <= total; s += stepS) {
      const along = meters * s / total;
      pts.push({ lat: start[0] + (rnd() * 4) / mPerDegLat, lon: start[1] + (along + rnd() * 4) / mPerDegLon, acc: 8, t: s * 1000 });
    }
    return pts;
  }

    Object.assign(placeDraft, { coord: p.coord, where: name, confirmReplace: false });
    // "Lancy, Avenue des Communes-Réunies 60" → suggested name "Avenue des Communes-Réunies 60"
    placeDraft.autoName = name.replace(/^[^,]+,\s*/, '');
    if (placeDraft.kind === 'other' && !placeDraft.touched) placeDraft.name = placeDraft.autoName;
    else placeDraft.name = $('placeName').value;
    $('placeResults').hidden = true; $('placeQ').value = '';
    renderPlaceSheet();
  });

  $('lines').addEventListener('click', e => {
    const b = e.target.closest('.line-chip');
    if (!b) return;
    toggleLine(b.dataset.key);
    renderLines(); renderDepartures();
  });
  $('dirs').addEventListener('click', e => {
    const b = e.target.closest('.dir');
    if (!b) return;
    toggleDir(b.dataset.line, b.dataset.dir);
    renderLines(); renderDepartures();
  });
  function setDirPanel(open) {
    $('dirs').hidden = !open;
    $('dirToggle').setAttribute('aria-expanded', String(open));
    $('dirToggle').textContent = open ? t('hideDirections') : t('chooseDirections');
    store.set('dirOpen', open);
  }
  $('dirToggle').addEventListener('click', () => setDirPanel($('dirs').hidden));
  setDirPanel(store.get('dirOpen', false));
  $('allLines').addEventListener('click', () => { peekAll = false; saveHidden(new Set()); renderLines(); renderDepartures(); });
  $('noLines').addEventListener('click', () => {
    peekAll = false; saveHidden(new Set(lineModel.map(l => l.key))); renderLines(); renderDepartures();
  });
  $('autoInfo').addEventListener('click', e => {
    if (e.target.id === 'peek') peekAll = !peekAll;
    else if (e.target.id === 'backAuto') { store.set('hidden:' + current.id, []); store.set('mode:' + current.id, 'auto'); peekAll = false; }
    else return;
    renderLines(); renderDepartures();
  });
  $('departures').addEventListener('click', e => {
    if (e.target.id === 'peekEmpty') { peekAll = true; renderLines(); renderDepartures(); return; }
    const q = e.target.closest('.plat');
    if (q) { openMap(q.dataset.quay, q.dataset.mode, current, { stopOnly: !!q.dataset.stopOnly }); return; }   // the platform link does not expand the row
    const li = e.target.closest('.dep'); if (!li) return;
    const opening = expanded !== li.dataset.dep;
    expanded = opening ? li.dataset.dep : null;
    if (opening && recordUse(li.dataset.dir)) renderLines();   // a use may move the line up
    renderDepartures();
  });
  $('refresh').addEventListener('click', loadBoard);
  $('mapBtn').addEventListener('click', () => openMap(null));
  $('mapClose').addEventListener('click', closeMap);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('mapSheet').hidden) closeMap(); });

  // Sprint 6: tabs, journey planner, alarms, settings
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
  for (const w of ['from', 'to', 'via']) {
    let deb;
    $(w + 'Q').addEventListener('input', e => {
      places[w] = null; clearTimeout(deb);
      const q = e.target.value.trim();
      if (q.length < 2) { $(w + 'Results').hidden = true; return; }
      deb = setTimeout(() => searchPlace(w, q), 300);
    });
    $(w + 'Results').addEventListener('click', e => {
      const b = e.target.closest('button[data-id], button[data-pid], button[data-addr]'); if (!b) return;
      const p = placeFromRow(b); if (p) setPlace(w, p);
    });
  }
  document.querySelectorAll('.place-me').forEach(b => b.addEventListener('click', () => useMyPosition(b.dataset.which)));
  document.querySelectorAll('.place-map').forEach(b => b.addEventListener('click', () => openPicker(b.dataset.which)));
  $('pickConfirm').addEventListener('click', () => {
    if (!pickState || !pickState.pos) return;
    if (pickState.which === 'save') {
      const near = pickState.near;
      Object.assign(placeDraft, { coord: pickState.pos, where: placeLabel({ kind: 'point', coord: pickState.pos, near }) });
      placeDraft.confirmReplace = false;
      closeMap(); renderPlaceSheet(); return;
    }
    setPlace(pickState.which, { kind: 'point', coord: pickState.pos, near: pickState.near });
    closeMap();
  });
  $('swap').addEventListener('click', () => { const f = places.from, to = places.to; setPlace('from', to); setPlace('to', f); });
  $('whenMode').addEventListener('change', () => {
    const now = $('whenMode').value === 'now';
    $('whenAt').hidden = now;
    if (!now && !$('whenAt').value) {   // default: next multiple of 5 minutes, local time
      const d = new Date(Math.ceil(Date.now() / 300000) * 300000);
      $('whenAt').value = apiDateTime(d).replace(' ', 'T');
    }
  });
  document.querySelectorAll('#prio button').forEach(b => b.addEventListener('click', () => { store.set('prio', b.dataset.prio); renderPrio(); renderJourneys(); }));
  $('searchJourney').addEventListener('click', searchJourneys);
  $('journeyList').addEventListener('click', e => {
    const q = e.target.closest('.plat');
    if (q) { openMap(q.dataset.quay, q.dataset.mode, { id: q.dataset.stopId, name: q.dataset.stopName, coord: q.dataset.lat ? [+q.dataset.lat, +q.dataset.lon] : null }, { stopOnly: !!q.dataset.stopOnly }); return; }
    const w = e.target.closest('.walk-map');
    if (w) { const j = journeys[+w.dataset.i]; if (j && j.legs[+w.dataset.leg]) openWalkMap(j.legs, +w.dataset.leg); return; }
    const v = e.target.closest('.via-toggle');
    if (v) { const open = v.getAttribute('aria-expanded') !== 'true'; v.setAttribute('aria-expanded', String(open)); v.nextElementSibling.hidden = !open; return; }
    const ft = e.target.closest('.foot-toggle');
    if (ft) {
      const j = journeys[+ft.dataset.i]; if (!j) return;
      const base = j.base || j, foot = ft.dataset.foot === '1', side = ft.dataset.side;
      const alt = j.onFoot === side || (j.onFoot === true && side === 'end') ? j.alt : side === 'start' ? j.startOffer : j.footOffer;
      if (!alt) return;
      footChoice.set(base.key + '|' + side, foot); recordFoot(alt.key, foot ? 'foot' : 'bus');
      if (foot) footChoice.set(base.key + '|' + (side === 'start' ? 'end' : 'start'), false);   // one end on foot at a time
      renderJourneys(); return;
    }
    const al = e.target.closest('.set-alarms');
    if (al) { const j = journeys[+al.dataset.i]; if (j) createAlarm(j); return; }
    const b = e.target.closest('.jr');
    if (!b) return;
    const j = journeys[+b.dataset.i], k = (j.base || j).key;
    openJourney = openJourney === k ? null : k;
    renderJourneys();
    const opened = document.querySelector('#journeyList .jr[aria-expanded="true"]');
    if (opened && opened.scrollIntoView) opened.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
  $('alarmList').addEventListener('click', e => {
    const q = e.target.closest('.plat');   // a platform of a followed ride: on the map
    if (q) { openMap(q.dataset.quay, q.dataset.mode, { id: q.dataset.stopId, name: q.dataset.stopName, coord: q.dataset.lat ? [+q.dataset.lat, +q.dataset.lon] : null }, { stopOnly: !!q.dataset.stopOnly }); return; }
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const id = b.closest('.alarm').dataset.id, a = getAlarms().find(x => x.id === id); if (!a) return;
    unlockAudio();
    if (b.dataset.act === 'cancel') { saveAlarms(getAlarms().filter(x => x.id !== id)); renderAlarms(); }
    else if (b.dataset.act === 'alt') applyAlternative(a.id, +b.dataset.n);
    else if (b.dataset.act === 'stay-now') requestStayOptions(a.id, +b.dataset.k, Date.now(), 'now');
    else if (b.dataset.act === 'stay-more') { const st = a.plan[+b.dataset.k]; requestStayOptions(a.id, +b.dataset.k, Math.max(st.until, Date.now()) + 15 * 60000, 'more'); }
    else if (b.dataset.act === 'via') {   // unfold / fold the stops of a ride (kept open across live refreshes)
      const key = b.dataset.key, open = !tripViaOpen.has(key);
      open ? tripViaOpen.add(key) : tripViaOpen.delete(key);
      b.setAttribute('aria-expanded', String(open)); b.nextElementSibling.hidden = !open;
    }
    else if (b.dataset.act === 'walk-map') { if (a.plan && a.plan[+b.dataset.leg]) openWalkMap(a.plan, +b.dataset.leg, { follow: true }); }
    else if (b.dataset.act === 'test-alight') fireAlight(a, 0);
    else fireAlarm(a, b.dataset.act === 'test-ready' ? 'ready' : 'leave');   // test: rings without marking the alarm as done
  });
  $('abOk').addEventListener('click', () => { $('alarmBanner').hidden = true; });
  $('abTrack').addEventListener('click', () => {
    const a = getAlarms().find(x => x.id === $('abTrack').dataset.id);
    $('alarmBanner').hidden = true;
    if (a) startWalkTracking(a);
  });
  $('walkStop').addEventListener('click', () => { finishWalkTracking(); $('walkStatus').hidden = true; });
  $('settingsBtn').addEventListener('click', () => { unlockAudio(); renderSettings(); $('settingsSheet').hidden = false; });
  $('settingsClose').addEventListener('click', () => { $('settingsSheet').hidden = true; });
  ['setPrep', 'setSpeed', 'setMargin', 'setAlight', 'setFootMax'].forEach(id => $(id).addEventListener('change', readSettingsForm));
  $('resetLearning').addEventListener('click', () => {
    const s = getSettings(); s.speedKmh = DEFAULT_SETTINGS.speedKmh; s.learned = 0; s.samples = [];
    saveSettings(s); renderSettings(); renderAlarms();
  });
  $('enableNotif').addEventListener('click', askNotificationPermission);
  $('ojpKeySave').addEventListener('click', saveOjpKey);
  $('setOjpKey').addEventListener('keydown', e => { if (e.key === 'Enter') saveOjpKey(); });
  $('ojpKeyRemove').addEventListener('click', removeOjpKey);
  $('ojpKeyShow').addEventListener('click', () => {
    const i = $('setOjpKey'), show = i.type === 'password';
    i.type = show ? 'text' : 'password'; $('ojpKeyShow').textContent = t(show ? 'keyHide' : 'keyShow');
  });
  $('simWalk').addEventListener('click', () => {
    const a = getAlarms()[0];
    const start = (a && a.origin) || (places.from && places.from.coord) || DEFAULT_CENTER;
    $('simResult').textContent = learnFromTrack(simulatedTrack(parseFloat($('simSpeed').value) || 5, start));
  });
  setInterval(tickAlarms, 5000);
  setInterval(updateGpsWatch, 5000);
  setInterval(() => { if (getAlarms().some(a => a.plan)) renderAlarms(); }, 20000);   // progress of followed journeys
  setInterval(refreshAlarmsLive, LIVE_REFRESH_MS);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') tickAlarms(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && current && lastLoad && Date.now() - lastLoad > REFRESH_MS) loadBoard();
  });

  // ---------- Start-up: straight to the last stop viewed ----------
  for (const w of ['from', 'to', 'via']) places[w] = store.get('journey:' + w, null);
  renderTripOpts();
  $('addVia').addEventListener('click', () => { store.set('journey:viaOn', true); renderTripOpts(); $('viaQ').focus(); });
  $('viaRemove').addEventListener('click', () => { store.set('journey:viaOn', false); places.via = null; store.set('journey:via', null); $('viaQ').value = ''; renderTripOpts(); });
  $('roundTrip').addEventListener('change', () => { store.set('journey:roundTrip', $('roundTrip').checked); renderTripOpts(); });
  $('viaStay').addEventListener('change', () => store.set('journey:viaStay', minutesOf('viaStay', 30)));
  $('returnStay').addEventListener('change', () => store.set('journey:returnStay', minutesOf('returnStay', 60)));
  renderPrio();
  showTab(store.get('tab', 'departures'));
  try { if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js'); } catch { /* notifications fall back */ }
  applyLanguage();
  renderSaveButtons();
  tickAlarms();
  refreshAlarmsLive();
  // follow the position only if it was already allowed (no prompt at start-up)
  try { navigator.permissions && navigator.permissions.query({ name: 'geolocation' }).then(r => { if (r.state === 'granted') updateGpsWatch(); }).catch(() => {}); } catch { /* no Permissions API */ }
  renderRecent();
  const lastId = store.get('lastStop', null);
  const last = lastId && getStops()[lastId];
  if (last) {
    // reopen without incrementing the visit count
    current = { id: last.id, name: last.name };
    $('board').hidden = false;
    $('stationName').textContent = last.name;
    loadBoard();
    startTimers();
  }
})();
</script>
</body>
</html>
