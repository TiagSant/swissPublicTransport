    }
  };
  const LOCALE = { en: 'en-GB', fr: 'fr-CH' };   // en-GB keeps the 24-hour clock

  // ---------- Local storage (user preferences, on this device) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('tpp:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('tpp:' + k, JSON.stringify(v)); } catch { /* storage unavailable */ } }
  };

  function detectLang() {
    const saved = store.get('lang', null);
    if (saved && STRINGS[saved]) return saved;
    const prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
    return prefs.some(l => /^fr\b/i.test(l)) ? 'fr' : 'en';
  }
  let lang = detectLang();
  function t(key, vars) {
    let s = STRINGS[lang][key] ?? STRINGS.en[key] ?? key;
    if (vars) for (const [k, v] of Object.entries(vars)) s = s.replace('{' + k + '}', v);
    return s;
  }
  const modeName = m => STRINGS[lang].mode[m] || STRINGS[lang].mode.other;

  // ---------- Helpers ----------
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const enc = encodeURIComponent;

  // ---------- API calls: timeout, error kinds, service status ----------
  // transport.opendata.ch is a free community service: it can be down, slow or rate-limited.
  // Every call times out, says why it failed, and a banner tells the rider until a call succeeds again.
  const API_TIMEOUT_MS = 10000;
  class ApiError extends Error {
    constructor(kind, status, message) { super(message || kind); this.name = 'ApiError'; this.kind = kind; this.status = status; }
  }
  // Data source: official OJP 2.0 when the rider has saved a key (TECH-06), otherwise transport.opendata.ch
  const OJP = window.OJP_ADAPTER;
  const getOjpKey = () => store.get('ojpKey', '') || '';
  const useOjp = () => !!(OJP && getOjpKey());
  const SRC_NAME = { ojp: 'opentransportdata.swiss', community: 'transport.opendata.ch' };

  async function getJSON(url, signal) { return apiFetch('community', url, {}, signal, r => r.json()); }
  // OJP answers are XML; `key` lets Settings check a key before saving it
  async function ojpPost(xml, signal, key) {
    return apiFetch('ojp', OJP.ENDPOINT, { method: 'POST', body: xml,
      headers: { 'Content-Type': 'application/xml', Authorization: 'Bearer ' + (key || getOjpKey()) } }, signal, r => r.text());
  }

  async function apiFetch(src, url, init, signal, read) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), API_TIMEOUT_MS);
    const forward = () => ctrl.abort();
    if (signal) { if (signal.aborted) ctrl.abort(); else signal.addEventListener('abort', forward, { once: true }); }
    try {
      let r;
      try { r = await fetch(url, Object.assign({}, init, { signal: ctrl.signal })); }
      catch (e) {
        if (signal && signal.aborted) throw e;                       // cancelled by the app (newer search): not an outage
        throw new ApiError(ctrl.signal.aborted ? 'timeout' : 'network');
      }
      if (!r.ok) {
        let message = '';
        try { const text = await r.text(); try { const body = JSON.parse(text); message = (body.errors && body.errors[0] && body.errors[0].message) || ''; } catch { message = text.slice(0, 200); } } catch { /* no body */ }
        const kind = r.status === 429 ? 'rate' : r.status >= 500 ? 'server' : (src === 'ojp' && (r.status === 401 || r.status === 403)) ? 'auth' : 'client';
        throw new ApiError(kind, r.status, message);
      }
      const data = await read(r);
      setApiStatus(null);
      return data;
    } catch (e) {
      if (e.name === 'ApiError' && e.kind !== 'client') setApiStatus(e.kind, src);
      throw e;
    } finally {
      clearTimeout(timer);
      if (signal) signal.removeEventListener('abort', forward);
    }
  }
  let apiProblem = null, apiProblemSrc = 'community';
  function setApiStatus(kind, src) {
    if (apiProblem !== kind || (kind && apiProblemSrc !== src)) { apiProblem = kind; apiProblemSrc = src || apiProblemSrc; renderApiStatus(); }
  }
  function renderApiStatus() {
    const el = $('apiStatus');
    el.hidden = !apiProblem;
    if (apiProblem) el.textContent = '⚠ ' + t('api_' + apiProblem, { src: SRC_NAME[apiProblemSrc] });
  }

  // ---------- Data layer: one interface, two sources (TECH-05) ----------
  // Every function returns the transport.opendata.ch v1 shape (assets/ojp.js converts the OJP answers).
  const data = {
    // Stop search by name. OJP ignores the name when an area is given, so the search is Switzerland-wide and
    // the app keeps only the stops of the Unireso area (as with transport.opendata.ch).
    async locations(q, signal) {
      if (!useOjp()) return (await getJSON(`${API}/locations?type=station&query=${enc(q)}`, signal)).stations || [];
      return OJP.toLocations(await ojpPost(OJP.locationsByName(q, { lang, limit: 40 }), signal)).stations;
    },
    // Stops, addresses and places of interest by name: [{ type: 'stop'|'address'|'poi', id, name, coordinate, icon }]
    async places(q, signal) {
      if (useOjp()) return OJP.toPlaces(await ojpPost(OJP.locationsByName(q, { lang, limit: 30, types: ['stop', 'address', 'poi'] }), signal)).places;
      const r = await getJSON(`${API}/locations?query=${enc(q)}&type=all`, signal);
      return [...(r.stations || []), ...(r.addresses || []), ...(r.poi || [])].filter(x => x.coordinate && x.coordinate.x != null).map(x => ({
        type: x.id && /^\d{7}$/.test(String(x.id)) ? 'stop' : (x.type === 'poi' || x.icon === 'poi' ? 'poi' : 'address'),
        id: x.id && /^\d{7}$/.test(String(x.id)) ? String(x.id) : null, name: x.name, coordinate: x.coordinate, icon: x.icon || null }));
    },
    // Stops around a point, with their distance in metres
    async around(pos, signal) {
      if (!useOjp()) return ((await getJSON(`${API}/locations?x=${pos[0]}&y=${pos[1]}`, signal)).stations || []).filter(s => s.id);
      const dLat = MAX_ACCESS_M / 111320, dLon = MAX_ACCESS_M / (111320 * Math.cos(pos[0] * Math.PI / 180));
      const zone = { latMin: pos[0] - dLat, latMax: pos[0] + dLat, lonMin: pos[1] - dLon, lonMax: pos[1] + dLon };
      return OJP.toLocations(await ojpPost(OJP.locationsInZone(zone, { lang, limit: 40 }), signal)).stations
        .map(s => Object.assign(s, { distance: s.coordinate ? Math.round(distanceM(pos, [s.coordinate.x, s.coordinate.y])) : null }));
    },
    // Departures from `from` on. With OJP, the next stops of each run (needed for directions) are heavy:
    // they are fetched once per stop and remembered by run pattern; refreshes ask without them (≈ 5× lighter).
    async board(stopId, from, signal) {
      if (!useOjp()) return getJSON(`${API}/stationboard?id=${enc(stopId)}&limit=${BOARD_LIMIT}&datetime=${enc(apiDateTime(from))}`, signal);
      const pat = loadPatterns(stopId);
      const needFull = pat.fullAt == null || Date.now() - pat.fullAt > PATTERNS_MAX_AGE
        || (pat.unknown > 0 && Date.now() - pat.fullAt > PATTERNS_RETRY_MS);
      const light = ojpPost(OJP.stopEvents(stopId, { lang, from, limit: BOARD_LIMIT, onward: false }), signal);
      light.catch(() => {});   // awaited below; avoids an unhandled rejection if the full request fails first
      if (needFull) {
        const full = await ojpPost(OJP.stopEvents(stopId, { lang, from: new Date(Date.now() - 2 * 60000), limit: PATTERNS_RESULTS }), signal);
        OJP.toStationboard(full, stopId, pat.map);
        pat.fullAt = Date.now();
      }
      const r = OJP.toStationboard(await light, stopId, pat.map);
      pat.unknown = r.unknownPatterns;
      savePatterns(stopId, pat);
      return r;
    },
    // Journeys between two stops, leaving at / arriving by `ref`
    async connections(a, b, ref, arrive, signal) {
      if (!useOjp()) {
        const [date, time] = apiDateTime(ref).split(' ');
        const qs = new URLSearchParams({ from: a, to: b, date, time, limit: '4' });
        if (arrive) qs.set('isArrivalTime', '1');
        return getJSON(`${API}/connections?${qs}`, signal);
      }
      return OJP.toConnections(await ojpPost(OJP.trip(a, b, { lang, at: ref, arrive, limit: 4 }), signal));
    }
  };

  // Run patterns per stop (next stops and minutes after this stop), kept on the device for a day
  const PATTERNS_RESULTS = 40;              // departures asked with their next stops
  const PATTERNS_MAX_AGE = 24 * 3600000;    // timetable changes, diversions: relearn once a day
  const PATTERNS_RETRY_MS = 5 * 60000;      // a run with unknown next stops: ask again at most every 5 min
  const patternCache = new Map();
  function loadPatterns(stopId) {
    if (!patternCache.has(stopId)) {
      const saved = store.get('patterns:' + stopId, null);
      patternCache.set(stopId, saved ? { fullAt: saved.fullAt, unknown: 0, map: new Map(saved.map) } : { fullAt: null, unknown: 0, map: new Map() });
    }
    return patternCache.get(stopId);
  }
  function savePatterns(stopId, pat) { store.set('patterns:' + stopId, { fullAt: pat.fullAt, map: [...pat.map] }); }

  // "2026-11-09T23:41:00+0100" → Date (the +0100 offset without a colon is not parsed everywhere, e.g. Safari)
  function parseTime(s) {
    if (!s) return null;
    const d = new Date(String(s).replace(/([+-]\d{2})(\d{2})$/, '$1:$2'));
    return isNaN(d) ? null : d;
  }
  const hhmm = (d) => d.toLocaleTimeString(LOCALE[lang], { hour: '2-digit', minute: '2-digit', hour12: false });
  // API `datetime` parameter: Swiss local time "YYYY-MM-DD HH:mm" (the sv-SE locale formats exactly like that)
  const apiDateTime = (d) => new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Zurich', year: 'numeric', month: '2-digit',
    day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).format(d);

  function inZone(loc) {
    const c = loc.coordinate;
    if (!c || c.x == null || c.y == null) return false;
    return c.x >= ZONE.latMin && c.x <= ZONE.latMax && c.y >= ZONE.lonMin && c.y <= ZONE.lonMax;
  }

  // ---------- Modes and pictograms (US-11) ----------
  // API category codes → transport mode (validated against real data, see docs/real-data-validation.md)
  const CATS = {
    tram:      ['T', 'TRAM', 'NFT', 'STR'],
    bus:       ['B', 'BUS', 'NFB', 'BN', 'EV', 'KB', 'EXB', 'BP', 'TX', 'NB', 'RUB', 'CAR'],
    ship:      ['BAT', 'BAV', 'FAE', 'SCH', 'SHIP'],
    funicular: ['FUN'],
    cableway:  ['PB', 'GB'],
    train:     ['S', 'SN', 'SL', 'L', 'R', 'RE', 'IR', 'IRE', 'IC', 'ICE', 'ICN', 'EC', 'EN', 'NJ', 'TGV',
                'TER', 'RJ', 'RJX', 'PE', 'EXT', 'RB', 'IN', 'TRN']
  };
  const MODE_ORDER = { train: 0, tram: 1, bus: 2, ship: 3, funicular: 4, cableway: 5, other: 6 };
  // Swiss public transport pictograms (SBB pictogram library, pictos/svg-digital), used unmodified
  const PICTOGRAMS = { tram: 'Tram_r', bus: 'Bus_r', train: 'Zug_r', ship: 'Schiff_r',
                       funicular: 'Standseilbahn_r', cableway: 'Luftseilbahn_r' };
  // SBB timetable icons available in assets/sbb/timetable (each with a -negative variant for dark mode)
  const SBB_TIMETABLE_ICONS = new Set(['ic-1', 'ic-5', 'ir-15', 'ir-57', 'ir-90', 'ir-95', 're-33', 'r-55', 'ter', 'tgv']);

  function pictoHtml(mode, small) {
    const p = PICTOGRAMS[mode];
    return p ? `<img class="picto${small ? ' sm' : ''}" src="${ASSETS}/sbb/pictograms/${p}.svg" alt="${esc(modeName(mode))}">`
             : `<span class="picto-none" aria-hidden="true"></span>`;
  }

  function modeOfCategory(cat) {
    const c = String(cat || '').toUpperCase().trim();
    for (const m of ['tram', 'bus', 'ship', 'funicular', 'cableway', 'train']) if (CATS[m].includes(c)) return m;
    return 'other';
  }
  function modeOfIcon(icon, name) {
    const m = ({ tram: 'tram', bus: 'bus', train: 'train', ship: 'ship', boat: 'ship', funicular: 'funicular', cableway: 'cableway' })[icon];
    if (m) return m;
    // Real data: some piers come without an icon (e.g. "Genève-Jardin-Anglais (lac)")
    return /\(lac\)/i.test(name || '') ? 'ship' : 'other';
  }

  // Readable line label: "12" for a tram, "L2" for the Léman Express, "IR 90" for a train
  function lineLabel(j, mode) {
    const n = String(j.number || '').trim();
    const c = String(j.category || '').trim();
    if (mode !== 'train') return n || c || '?';
    if (/^[A-Za-z]/.test(n)) return n;                     // e.g. L1…L6, S1
    if (n && n.length <= 3) return (c + ' ' + n).trim();   // e.g. IR 90, RE 33
    return c || n || '?';                                  // a long number is a run number: keep the category
  }

  // ---------- Line colours (US-12) ----------
  // Priority: Léman Express colour (whatever the operator: SBB "R L2" and SNCF "TER L2" are the same line)
  // → SBB timetable icon (other trains) → operator colour (TPG, Mouettes) → neutral badge
  function lineStyle(j, mode, label) {
    const nets = (window.LINE_COLORS && window.LINE_COLORS.networks) || {};
    const isLex = mode === 'train' && /^L\d+$/.test(label);
    if (isLex) {
      const c = nets.LEX && nets.LEX[label];
      return c ? { bg: c[0], fg: c[1], shape: c[2] } : { neutral: true };
    }
    const cat = String(j.category || '').toLowerCase().trim();
    const num = String(j.number || '').trim();
    if (mode === 'train') {
      const icon = /^\d{1,3}$/.test(num) ? `${cat}-${num}` : cat;
      if (SBB_TIMETABLE_ICONS.has(icon)) return { icon };
    }
    const op = String(j.operator || '');
    let c = null;
    if (/^tpg$/i.test(op)) c = nets.TPG && nets.TPG[label];
    else if (mode === 'ship' && (/^mgsa$|mouettes/i.test(op) || /^M\d$/.test(label))) c = nets.MGN && nets.MGN[label];
    return c ? { bg: c[0], fg: c[1], shape: c[2] } : { neutral: true };
  }

  function badgeHtml(style, label) {
    if (style.icon) {
      const base = `${ASSETS}/sbb/timetable/${style.icon}`;
      return `<picture class="tt"><source srcset="${base}-negative.svg" media="(prefers-color-scheme: dark)">` +
             `<img src="${base}.svg" alt="${esc(label)}"></picture>`;
    }
    if (style.neutral) return `<span class="badge neutral">${esc(label)}</span>`;
    return `<span class="badge ${style.shape}" style="background:${style.bg};color:${style.fg}">${esc(label)}</span>`;
  }
  const lineIdHtml = (mode, style, label, small) => `<span class="line-id">${pictoHtml(mode, small)}${badgeHtml(style, label)}</span>`;

  // ---------- State ----------
  let current = null;        // { id, name }
  let departures = [];       // normalised departures from the last load
  let lastLoad = null;
  let refreshTimer = null, tickTimer = null;
  let searchCtrl = null, boardCtrl = null;
  let lastResults = null;    // { stations, noteKey } so a language switch can re-render them

  // ---------- Frequent stops (adapting to the user) ----------
  function getStops() { return store.get('stops', {}); }
  function recordVisit(st) {
    const stops = getStops();
    const s = stops[st.id] || { id: st.id, name: st.name, mode: st.mode || 'other', count: 0 };
    s.name = st.name; if (st.mode && st.mode !== 'other') s.mode = st.mode;
    s.count += 1; s.last = Date.now();
    stops[st.id] = s;
    store.set('stops', stops);
    store.set('lastStop', st.id);
  }
  function renderRecent() {
    const list = Object.values(getStops())
      .sort((a, b) => b.count - a.count || b.last - a.last)
      .slice(0, 8);
    $('recentCard').hidden = list.length === 0;
    $('recent').innerHTML = list.map(s =>
      `<span class="stop-chip"><button class="stop-open" data-id="${esc(s.id)}" data-name="${esc(s.name)}" data-mode="${esc(s.mode)}">` +
      `${esc(s.name)}<span class="n">${s.count}×</span></button>` +
      `<button class="stop-del" data-del="${esc(s.id)}" aria-label="${esc(t('removeStop', { name: s.name }))}" title="${esc(t('removeStop', { name: s.name }))}">✕</button></span>`).join('');
  }

  // Remove one stop, or all of them, with a few seconds to undo. Line and direction settings of a stop are kept,
  // so they come back if the stop is visited again.
  let undoStops = null;
  // US-27: removing the stop on screen shows the most-used remaining stop (or nothing when none is left)
  const topStop = stops => Object.values(stops).sort((a, b) => b.count - a.count || b.last - a.last)[0] || null;
  function changeStops(next, message) {
    undoStops = { stops: getStops(), lastStop: store.get('lastStop', null), shown: current ? { id: current.id, name: current.name } : null };
    store.set('stops', next);
    if (!next[store.get('lastStop', null)]) store.set('lastStop', null);   // don't reopen a removed stop at start-up
    if (current && !next[current.id]) {
      const top = topStop(next);
      if (top) { openStop(top, { record: false }); store.set('lastStop', top.id); }
      else closeBoard();
    }
    renderRecent();
    showToast(message, undoStopChange);
  }
  function closeBoard() {
    current = null;
    clearInterval(refreshTimer); clearInterval(tickTimer);
    if (boardCtrl) boardCtrl.abort();
    $('board').hidden = true;
  }
  function removeStop(id) {
    const stops = getStops(), s = stops[id];
    if (!s) return;
    delete stops[id];
    changeStops(stops, t('stopRemoved', { name: s.name }));
  }
  function undoStopChange() {
    if (!undoStops) return;
    const u = undoStops; undoStops = null;
    store.set('stops', u.stops); store.set('lastStop', u.lastStop);
    if (u.shown && (!current || current.id !== u.shown.id)) openStop(u.stops[u.shown.id] || u.shown, { record: false });
    renderRecent();
  }

  // ---------- My places (US-21, US-22) ----------
  const PLACE_ICON = { home: '🏠', work: '💼', other: '📍' };
  const DEFAULT_NAMES = { home: ['Home', 'Domicile'], work: ['Work', 'Travail'] };
  function getPlaces() { return store.get('places', {}); }
  // Home and Work keep their name in the current language unless the rider renamed them
  const placeName = p => p.kind !== 'other' && (!p.name || DEFAULT_NAMES[p.kind].includes(p.name)) ? t('kind' + cap(p.kind)) : p.name;
  const savedRef = p => ({ kind: 'saved', placeId: p.id, name: placeName(p), icon: PLACE_ICON[p.kind], coord: p.coord });
  // Ordered by use with the habit model of stops; Home and Work first once used
  function sortedPlaces() {
    const now = Date.now(), order = { home: 0, work: 1, other: 2 };
    const sc = p => decayed(p.usage, now);
    return Object.values(getPlaces()).sort((a, b) =>
      ((b.kind !== 'other' && sc(b) > 0) - (a.kind !== 'other' && sc(a) > 0)) || sc(b) - sc(a) || order[a.kind] - order[b.kind] || a.created - b.created);
  }
  function recordPlaceUse(id) {
    const all = getPlaces(), p = all[id], now = Date.now();
    if (!p || (p.usage && now - p.usage.t < DEBOUNCE_MS)) return;
    p.usage = { s: decayed(p.usage, now) + 1, t: now };
    store.set('places', all); renderPlaceChips();
  }
  function renderPlaceChips() {
    const list = sortedPlaces();
    $('placesHint').hidden = list.length > 0;
    $('clearPlaces').hidden = list.length === 0;
    $('placeChips').innerHTML = list.map(p => {
      const name = placeName(p);
      return `<span class="stop-chip place-chip"><button class="place-open" data-pid="${esc(p.id)}">${PLACE_ICON[p.kind]} ${esc(name)}</button>` +
        `<button class="place-edit" data-pedit="${esc(p.id)}" aria-label="${esc(t('editPlaceOf', { name }))}" title="${esc(t('editPlaceOf', { name }))}">✎</button>` +
        `<button class="stop-del" data-pdel="${esc(p.id)}" aria-label="${esc(t('removeStop', { name }))}" title="${esc(t('removeStop', { name }))}">✕</button></span>`;
    }).join('');
  }
  // One tap: fills To, or From when To is already set and From is empty; searches when both are set
  function usePlace(id) {
    const p = getPlaces()[id]; if (!p) return;
    const target = !places.to ? 'to' : !places.from ? 'from' : 'to';
    setPlace(target, savedRef(p));
    if (places.from && places.to) searchJourneys();
  }
  function changePlaces(next, message) {
    const before = getPlaces();
    store.set('places', next); renderPlaceChips();
    showToast(message, () => { store.set('places', before); renderPlaceChips(); });
  }

  // Save / edit sheet
  let placeDraft = null;   // { id?, kind, name, coord, where, confirmReplace }
  function openPlaceSheet(draft) {
    placeDraft = Object.assign({ kind: 'other', name: '', coord: null, where: '' }, draft);
    placeDraft.autoName = placeDraft.id ? null : placeDraft.name;   // a suggested name, replaced when the kind changes
    placeDraft.touched = !!placeDraft.id;
    $('placeQ').value = ''; $('placeResults').hidden = true; $('placeMsg').textContent = '';
    $('placeSheet').hidden = false;
    renderPlaceSheet();
    if (!placeDraft.coord) $('placeQ').focus();
  }
  function renderPlaceSheet() {
    if (!placeDraft) return;
    $('placeTitle').textContent = t(placeDraft.id ? 'editPlace' : 'newPlace');
    document.querySelectorAll('#placeKind button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.kind === placeDraft.kind)));
    $('placeName').value = placeDraft.kind !== 'other' && (!placeDraft.name || DEFAULT_NAMES[placeDraft.kind].includes(placeDraft.name))
      ? t('kind' + cap(placeDraft.kind)) : placeDraft.name;
    $('placeChosen').hidden = !placeDraft.coord;
    $('placeChosenText').textContent = placeDraft.coord ? '📍 ' + (placeDraft.where || t('pointOnMap')) : '';
  }
  function setPlaceKind(kind) {
    const typed = $('placeName').value.trim();
    const keep = placeDraft.touched && typed && !Object.values(DEFAULT_NAMES).flat().includes(typed);
    placeDraft.kind = kind; placeDraft.confirmReplace = false;
    placeDraft.name = keep ? typed : (kind === 'other' ? (placeDraft.autoName || '') : t('kind' + cap(kind)));
    renderPlaceSheet();
    if (kind === 'other' && !placeDraft.name) $('placeName').focus();
  }
  function savePlaceDraft() {
    const d = placeDraft, all = getPlaces();
    d.name = $('placeName').value.trim() || (d.kind !== 'other' ? t('kind' + cap(d.kind)) : '');
    if (!d.name) { $('placeMsg').textContent = t('needName'); return; }
    if (!d.coord) { $('placeMsg').textContent = t('needWhere'); return; }
    const clash = d.kind !== 'other' && Object.values(all).find(p => p.kind === d.kind && p.id !== d.id);
    if (clash && !d.confirmReplace) {
      d.confirmReplace = true;
      $('placeMsg').textContent = t('replaceKind', { kind: t('kind' + cap(d.kind)), name: clash.where || placeName(clash) });
      return;
    }
    const id = d.id || 'p' + Date.now().toString(36);
    const old = all[id] || (clash || null);
    if (clash) delete all[clash.id];
    all[id] = { id, kind: d.kind, name: d.name, coord: d.coord, where: d.where || '', created: (all[id] && all[id].created) || Date.now(),
                usage: old ? old.usage : undefined };
    store.set('places', all);
    // a journey field showing this place follows its new name
    ['from', 'to'].forEach(w => { if (places[w] && places[w].kind === 'saved' && places[w].placeId === id) setPlace(w, savedRef(all[id])); });
    closePlaceSheet(); renderPlaceChips(); renderSaveButtons();
  }
  function closePlaceSheet() { $('placeSheet').hidden = true; placeDraft = null; }
  let placeSearchCtrl = null;
  async function searchPlaceSheet(q) {
    if (placeSearchCtrl) placeSearchCtrl.abort();
    const ctrl = placeSearchCtrl = new AbortController();
    try {
      const found = await findPlaces(q, ctrl.signal);
      $('placeResults').hidden = false;
      $('placeResults').innerHTML = found.length ? placeRowsHtml('\u0000', found) : `<li class="empty">${esc(t('noPlaceFound'))}</li>`;
    } catch (e) { if (e.name !== 'AbortError') { $('placeResults').hidden = false; $('placeResults').innerHTML = `<li class="empty">${esc(t('searchFailed'))}</li>`; } }
  }
  // A journey field → a draft for the sheet (☆ next to the field)
  function draftFrom(p) {
    const named = p.kind === 'stop' || p.kind === 'addr';
    return { kind: 'other', name: named ? p.name : '', coord: p.coord, where: placeLabel(p) };
  }

  // Toast with undo, shared by stops and places
  let toastTimer = null, undoAction = null;
  function showToast(message, undo) {
    undoAction = undo;
    $('toastText').textContent = message;
    $('toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 6000);
  }
  function hideToast() { $('toast').hidden = true; undoAction = null; clearTimeout(toastTimer); }

  // ---------- Search ----------
  function renderResults(stations, noteKey) {
    lastResults = { stations, noteKey };
    const ul = $('results');
    ul.hidden = false;
    if (!stations.length) { ul.innerHTML = `<li class="empty">${esc(t(noteKey || 'noStopInZone'))}</li>`; return; }
    ul.innerHTML = stations.slice(0, 10).map(s => {
      const m = modeOfIcon(s.icon, s.name);
      const dist = s.distance != null ? `<span class="dist">${Math.round(s.distance)} m</span>` : '';
      return `<li><button data-id="${esc(s.id)}" data-name="${esc(s.name)}" data-mode="${m}">` +
             `${pictoHtml(m)}<span>${esc(s.name)}</span>${dist}</button></li>`;
    }).join('');
  }

  function uniqueById(arr) {
    const seen = new Set();
    return arr.filter(s => s.id && !seen.has(s.id) && seen.add(s.id));
  }

  async function search(q) {
    if (searchCtrl) searchCtrl.abort();
    searchCtrl = new AbortController();
    const signal = searchCtrl.signal;
    const allCH = $('allCH').checked;
    $('searchStatus').innerHTML = '<span class="spinner"></span>';
    try {
      const { stations, inside } = await findStops(q, signal);
      renderResults(allCH ? stations : inside, allCH ? 'noStop' : 'noStopInZone');
      $('searchStatus').textContent = '';
    } catch (e) {
      if (e.name === 'AbortError') return;
      $('searchStatus').textContent = '';
      renderResults([], 'searchFailed');
    }
  }

  function nearMe() {
    if (!navigator.geolocation) { renderResults([], 'geoUnavailable'); return; }
    $('searchStatus').innerHTML = `<span class="spinner"></span> ${esc(t('locating'))}`;
    navigator.geolocation.getCurrentPosition(async pos => {
      try {
        const { latitude: x, longitude: y } = pos.coords;
        const st = uniqueById(await data.around([x, y])).sort((a, b) => (a.distance ?? 1e9) - (b.distance ?? 1e9));
        $('searchStatus').textContent = '';
        renderResults(st, 'noNearby');
      } catch {
        $('searchStatus').textContent = '';
        renderResults([], 'nearbyFailed');
      }
    }, () => {
      $('searchStatus').textContent = '';
      renderResults([], 'geoDenied');
    }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  }

  // ---------- Departure board ----------
  function normalize(j) {
    const stop = j.stop || {};
    const sched = stop.departureTimestamp ? new Date(stop.departureTimestamp * 1000) : parseTime(stop.departure);
    // Live data: the real-time estimate, or the scheduled time + delay when only the delay is known.
    // Without live data, `real` stays null and the departure follows its scheduled time.
    const prognosis = parseTime(stop.prognosis && stop.prognosis.departure);
    let delay = stop.delay != null && stop.delay !== '' && !isNaN(Number(stop.delay)) ? Number(stop.delay) : null;
    const real = prognosis || (sched && delay != null ? new Date(sched.getTime() + delay * 60000) : null);
    if (prognosis && sched) delay = Math.round((prognosis - sched) / 60000);
    const mode = modeOfCategory(j.category);
    const label = lineLabel(j, mode);
    const lineKey = mode + '|' + label;
    // Direction = next stop after the current station (groups short runs in the same direction).
    // Without a passList, fall back to the terminus.
    const hereId = stop.station && stop.station.id;
    const pl = Array.isArray(j.passList) ? j.passList : [];
    const nxt = pl.find((p, i) => i > 0 && p && p.station && p.station.name && p.station.id !== hereId);
    const nextStop = nxt ? nxt.station.name : '';
    const dirKey = lineKey + '>' + (nxt ? (nxt.station.id || nextStop) : 'to:' + (j.to || ''));
    return {
      lineKey, dirKey, nextStop, label, mode, style: lineStyle(j, mode, label),
      to: j.to || '', sched, real, live: !!real, time: real || sched, delay: delay || 0,
      platform: (stop.prognosis && stop.prognosis.platform) || stop.platform || '',
      operator: j.operator || '',
      // next stops (shown when the departure is tapped)
      stops: pl.slice(1).filter(p => p && p.station && p.station.name && p.station.id !== hereId).slice(0, 8)
        .map(p => ({ name: p.station.name,
                     time: p.arrivalTimestamp ? new Date(p.arrivalTimestamp * 1000) : parseTime(p.arrival || p.departure) }))
    };
  }

  // ---------- Manual filter (Sprints 1-2) ----------
  function hiddenSet() { return new Set(store.get('hidden:' + current.id, [])); }
  function saveHidden(set) { store.set('hidden:' + current.id, [...set]); store.set('mode:' + current.id, 'manual'); }
  // Manual mode if the user has already set their lines (including a filter inherited from Sprints 1-2)
  function isManual() {
    const m = store.get('mode:' + current.id, null);
    if (m) return m === 'manual';
    return store.get('hidden:' + current.id, []).length > 0;
  }

  // ---------- Habits (US-06) ----------
  const HALF_LIFE_DAYS = 30;   // a 30-day-old use weighs half as much
  // "Usual" threshold: 2 uses less than 30 days apart (1 + 0.5^(Δ/30 d) ≥ 1.5).
  // Not 2: with decay, two uses always score slightly less than 2.
  const FAV_MIN = 1.5;
  const DEBOUNCE_MS = 10 * 60 * 1000; // several taps within 10 min = one use
  let peekAll = false;         // temporary "See all", forgotten when changing stop

  const decayed = (u, now) => u ? u.s * Math.pow(0.5, (now - u.t) / (HALF_LIFE_DAYS * 864e5)) : 0;
  function getUsage() { return store.get('usage:' + current.id, {}); }
  function recordUse(dirKey) {
    const usage = getUsage(), now = Date.now(), u = usage[dirKey];
    if (u && now - u.t < DEBOUNCE_MS) return false;
    usage[dirKey] = { s: decayed(u, now) + 1, t: now };
    store.set('usage:' + current.id, usage);
    return true;
  }
  function dirScore(dirKey, usage = getUsage(), now = Date.now()) { return decayed(usage[dirKey], now); }
  function favoriteDirs() {
    const usage = getUsage(), now = Date.now(), fav = new Set();
    lineModel.forEach(l => l.dirs.forEach(d => { if (dirScore(d.key, usage, now) >= FAV_MIN) fav.add(d.key); }));
    return fav;
  }

  // Set actually applied: manual > "See all" > auto (usual directions only) > everything
  function effectiveHidden() {
    if (isManual()) return hiddenSet();
    const fav = favoriteDirs();
    if (peekAll || fav.size === 0) return new Set();
    const set = new Set();
    lineModel.forEach(l => l.dirs.forEach(d => { if (!fav.has(d.key)) set.add(d.key); }));
    return set;
  }
  // First manual change: start from what the user currently sees
  function materialize() {
    if (!isManual()) saveHidden(effectiveHidden());
    peekAll = false;
  }

  function renderAutoInfo() {
    const fav = favoriteDirs(), box = $('autoInfo');
    let html = '';
    if (isManual()) {
      if (fav.size) html = `<span>${esc(t('manual'))}</span><button id="backAuto" class="ghost">${esc(t('backToHabits'))}</button>`;
    } else if (fav.size) {
      html = peekAll
        ? `<span>${esc(t('allLinesShown'))}</span><button id="peek" class="ghost">${esc(t('myLines'))}</button>`
        : `<span>${esc(t('usualLines'))}</span><button id="peek" class="ghost">${esc(t('seeAll'))}</button>`;
    }
    box.hidden = !html; box.innerHTML = html;
  }

  function compareLines(a, b) {
    return (MODE_ORDER[a.mode] - MODE_ORDER[b.mode]) ||
      a.label.localeCompare(b.label, 'en', { numeric: true, sensitivity: 'base' });
  }

  // Hidden if the whole line is (line key, Sprint 1 compatible) or if this direction is
  const isHidden = (d, set) => set.has(d.lineKey) || set.has(d.dirKey);
  // Still to come? Real time when live data exists, otherwise the scheduled time (#19)
  const upcoming = (d, now) => !!d.time && d.time - now > -GONE_MS;

  let lineModel = [];
  function buildLines() {
    const lines = new Map();
    for (const d of departures) {
      let l = lines.get(d.lineKey);
      if (!l) lines.set(d.lineKey, l = { key: d.lineKey, label: d.label, mode: d.mode, style: d.style, dirs: new Map() });
      let dir = l.dirs.get(d.dirKey);
      if (!dir) l.dirs.set(d.dirKey, dir = { key: d.dirKey, next: d.nextStop, termini: new Map() });
      dir.termini.set(d.to, (dir.termini.get(d.to) || 0) + 1);
    }
    const usage = getUsage(), now = Date.now();
    const lineScore = l => [...l.dirs.keys()].reduce((acc, k) => acc + dirScore(k, usage, now), 0);
    return [...lines.values()].sort((a, b) => (lineScore(b) - lineScore(a)) || compareLines(a, b)).map(l => ({
      key: l.key, label: l.label, mode: l.mode, style: l.style,
      dirs: [...l.dirs.values()].map(x => ({
        key: x.key, next: x.next,
        // termini in the same direction, most frequent first: "Moillesulaz / Genève, Rive"
        label: [...x.termini.entries()].sort((a, b) => b[1] - a[1]).map(e => e[0]).join(' / ')
      })).sort((a, b) => a.label.localeCompare(b.label, 'fr'))
    }));
  }
  const visibleDirs = (l, set) => set.has(l.key) ? 0 : l.dirs.filter(d => !set.has(d.key)).length;

  function renderLines() {
    lineModel = buildLines();
    const hidden = effectiveHidden();
    const fav = favoriteDirs();
    renderAutoInfo();
    $('lines').innerHTML = lineModel.length ? lineModel.map(l => {
      const n = visibleDirs(l, hidden), total = l.dirs.length;
      const state = n === 0 ? 'false' : n === total ? 'true' : 'mixed';
      const cnt = state === 'mixed' ? `<span class="cnt">${n}/${total}</span>` : '';
      const star = l.dirs.some(d => fav.has(d.key)) ? '<span class="fav">★</span>' : '';
      return `<button class="line-chip" data-key="${esc(l.key)}" aria-pressed="${state}" title="${esc(modeName(l.mode) + ' ' + l.label)}">` +
        `${lineIdHtml(l.mode, l.style, l.label, true)}${star}${cnt}</button>`;
    }).join('') : `<span class="status">${esc(t('noLinesInBoard'))}</span>`;
    $('dirToggle').hidden = lineModel.length === 0;
    renderDirs(hidden);
  }

  function renderDirs(hidden) {
    $('dirs').innerHTML = lineModel.map(l => {
      const rows = l.dirs.map(d => {
        const on = !hidden.has(l.key) && !hidden.has(d.key);
        const next = d.next ? `<small>${esc(t('nextStop', { name: d.next }))}</small>` : '';
        return `<button class="dir" data-line="${esc(l.key)}" data-dir="${esc(d.key)}" aria-pressed="${on}">` +
          `<span class="box"></span><span class="lbl"><b>${esc(d.label || '—')}</b>${next}</span></button>`;
      }).join('');
      return `<div class="dir-group">${lineIdHtml(l.mode, l.style, l.label, true)}<div>${rows}</div></div>`;
    }).join('');
  }

  function toggleLine(lineKey) {
    const l = lineModel.find(x => x.key === lineKey); if (!l) return;
    materialize();
    const set = hiddenSet();
    const anyVisible = visibleDirs(l, set) > 0;
    l.dirs.forEach(d => set.delete(d.key));
    anyVisible ? set.add(l.key) : set.delete(l.key);
    saveHidden(set);
  }

  function toggleDir(lineKey, dirKey) {
    const l = lineModel.find(x => x.key === lineKey); if (!l) return;
    materialize();
    const set = hiddenSet();
    if (set.has(l.key)) {
      // whole line hidden: enable this direction only
      set.delete(l.key);
      l.dirs.forEach(d => { if (d.key !== dirKey) set.add(d.key); });
      set.delete(dirKey);
    } else {
      set.has(dirKey) ? set.delete(dirKey) : set.add(dirKey);
      // every direction hidden → hide the line (including its future directions)
      if (l.dirs.every(d => set.has(d.key))) { l.dirs.forEach(d => set.delete(d.key)); set.add(l.key); }
    }
    saveHidden(set);
  }

  function whenHtml(d, now) {
    const time = d.time;
    if (!time) return '<b>–</b>';
    const min = Math.floor((time - now) / 60000);
    if (min <= 0) return `<b class="now">0′</b><small>${hhmm(time)}</small>`;
    if (min < 60) return `<b>${min}′</b><small>${hhmm(time)}</small>`;
    return `<b>${hhmm(time)}</b><small>&nbsp;</small>`;
  }

  let expanded = null;  // expanded departure (unique key)
  const depId = d => d.dirKey + '@' + (d.sched ? d.sched.getTime() : '');

  function renderDepartures() {
    const now = Date.now();
    const hidden = effectiveHidden();
    const list = departures
      .filter(d => !isHidden(d, hidden))
      .filter(d => upcoming(d, now))   // drop vehicles that have already left
      .slice(0, SHOW_MAX);
    const ul = $('departures');
    if (!departures.length) { ul.innerHTML = `<li class="empty">${esc(t('noDepartures'))}</li>`; return; }
    if (!list.length) {
      ul.innerHTML = !isManual() && !peekAll && favoriteDirs().size
        ? `<li class="empty">${esc(t('noUsualDepartures'))} <button id="peekEmpty">${esc(t('seeAll'))}</button></li>`
        : `<li class="empty">${esc(t('noSelectedDepartures'))}</li>`;
      return;
    }
    ul.innerHTML = list.map(d => {
      const plat = d.platform ? platformChip(d.platform, d.mode) : '';
      const late = d.delay > 0 ? `<span class="late">+${d.delay} min</span>` : '';
      const meta = [plat, late].filter(Boolean).join(' · ');
      const id = depId(d), open = id === expanded;
      const stops = open ? `<ul class="stops">${d.stops.length ? d.stops.map(st =>
          `<li><span>${esc(st.name)}</span><span>${st.time ? hhmm(st.time) : ''}</span></li>`).join('')
          : `<li><span>${esc(t('nextStopsUnavailable'))}</span><span></span></li>`}</ul>` : '';
      return `<li class="dep" data-dep="${esc(id)}" data-dir="${esc(d.dirKey)}" aria-expanded="${open}">${lineIdHtml(d.mode, d.style, d.label)}` +
        `<div style="min-width:0"><div class="to">${esc(d.to)}</div><div class="meta">${meta || esc(modeName(d.mode))}</div></div>` +
        `<div class="when">${whenHtml(d, now)}</div>${stops}</li>`;
    }).join('');
  }

  function renderStatus(html) {
    if (html !== undefined) { $('boardStatus').innerHTML = html; return; }
    if (!lastLoad) return;
    const s = Math.round((Date.now() - lastLoad) / 1000);
    $('boardStatus').textContent = s < 10 ? t('justNow') : t('updatedAgo', { n: s < 60 ? s + ' s' : Math.round(s / 60) + ' min' });
  }

  async function loadBoard() {
    if (!current) return;
    if (boardCtrl) boardCtrl.abort();
    boardCtrl = new AbortController();
    renderStatus(`<span class="spinner"></span> ${esc(t('loading'))}`);
    try {
      const r = await data.board(current.id, new Date(Date.now() - LOOKBACK_MIN * 60000), boardCtrl.signal);
      const now = Date.now();
      departures = (r.stationboard || []).map(normalize)
        .filter(d => upcoming(d, now))   // the look-back window also returns departures that have already left
        .sort((a, b) => a.time - b.time);
      if (r.station && r.station.name) $('stationName').textContent = r.station.name;
      const c = r.station && r.station.coordinate;
      if (c && c.x != null && c.y != null) current.coord = [c.x, c.y];   // API: x = latitude, y = longitude
      lastLoad = Date.now();
      renderLines(); renderDepartures(); renderStatus();
    } catch (e) {
      if (e.name === 'AbortError') return;
      renderStatus('');
      $('departures').innerHTML = `<li class="error">${esc(t('loadFailed'))} <button id="retry">${esc(t('retry'))}</button></li>`;
      $('retry').onclick = loadBoard;
    }
  }

  function startTimers() {
    clearInterval(refreshTimer); clearInterval(tickTimer);
    refreshTimer = setInterval(() => { if (document.visibilityState === 'visible') loadBoard(); }, REFRESH_MS);
    tickTimer = setInterval(() => { renderDepartures(); renderStatus(); }, TICK_MS);
  }

  function openStop(st, opts = {}) {
    current = { id: st.id, name: st.name };
    if (opts.record !== false) recordVisit(st);
    renderRecent();
    $('results').hidden = true; lastResults = null;
    $('q').value = '';
    $('q').blur();
    $('board').hidden = false;
    $('stationName').textContent = st.name;
    $('lines').innerHTML = '';
    $('departures').innerHTML = '';
    departures = []; lastLoad = null; peekAll = false; expanded = null;
    loadBoard();
    startTimers();
    $('board').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ---------- Platform map (US-13) ----------
  // Leaflet and the platform positions are only loaded when a map is first opened.
  const LEAFLET = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/';
  const TILES = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
  let quaysPromise = null, leafletPromise = null, map = null, mapLayer = null, userLayer = null, watchId = null;

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const el = document.createElement('script');
      el.src = src; el.onload = resolve; el.onerror = () => reject(new Error('Failed to load ' + src));
      document.head.appendChild(el);
    });
  }
  function loadLeaflet() {
    if (window.L) return Promise.resolve();
    if (!leafletPromise) {
      const css = document.createElement('link');
      css.rel = 'stylesheet'; css.href = LEAFLET + 'leaflet.css';
      document.head.appendChild(css);
      leafletPromise = loadScript(LEAFLET + 'leaflet.js').catch(e => { leafletPromise = null; throw e; });
    }
    return leafletPromise;
  }
  // assets/quays.js is a script (not JSON) so it also works when the page is opened as a local file
  function loadQuays() {
    if (!quaysPromise) quaysPromise = (window.QUAYS ? Promise.resolve() : loadScript(`${ASSETS}/quays.js`)).catch(() => {});
    return quaysPromise.then(() => (window.QUAYS && window.QUAYS.stops) || {});
  }

  // ATLAS gives each platform an official designation and an internal one (e.g. "F" and "05"):
  // group them by position and show the one riders see on departure boards.
  function platformPoints(quays) {
    const byPos = new Map();
    for (const [name, pos] of Object.entries(quays)) {
      const k = pos.join(',');
      if (!byPos.has(k)) byPos.set(k, { pos, names: [] });
      byPos.get(k).names.push(name);
    }
    const score = n => /^[A-Z]{1,2}$/.test(n) ? 0 : /^[1-9]\d?[A-Z]{0,2}$/.test(n) ? 1 : 2;
    return [...byPos.values()].map(p => ({ pos: p.pos, names: p.names,
      label: p.names.slice().sort((a, b) => score(a) - score(b) || a.length - b.length)[0] }));
  }

  function distanceM(a, b) {   // haversine, metres
    const R = 6371000, rad = Math.PI / 180;
    const dLat = (b[0] - a[0]) * rad, dLon = (b[1] - a[1]) * rad;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  const fmtDistance = m => m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1)} km`;
  // "Platform F" chip in a departure row: pin, kind (platform / track) and the official designation
  const PIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>';
  function platformChip(p, mode, stop) {
    const kind = mode === 'train' ? 'track' : 'platform';
    const word = t(kind, { p: '' }).trim();
    const at = stop ? ` data-stop-id="${esc(stop.id)}" data-stop-name="${esc(stop.name)}"` +
      (stop.coord ? ` data-lat="${stop.coord[0]}" data-lon="${stop.coord[1]}"` : '') : '';
    return `<button class="plat" data-quay="${esc(p)}" data-mode="${mode}"${at} aria-label="${esc(t('showOnMap', { p: t(kind, { p }) }))}">` +
      `${PIN}<span class="plat-k">${esc(word)}</span><span class="plat-v">${esc(p)}</span></button>`;
  }
  const walkUrl = pos => `https://www.google.com/maps/dir/?api=1&destination=${pos[0]},${pos[1]}&travelmode=walking`;

  async function openMap(platform, mode, stop = current) {
    pickState = null;
    const label = platform ? t(mode === 'train' ? 'track' : 'platform', { p: platform }) : t('allPlatforms');
    $('mapTitle').textContent = label;
    $('mapSub').textContent = stop.name;
    $('mapInfo').textContent = '';
    $('walkThere').hidden = true; $('pickConfirm').hidden = true;
    $('mapSheet').hidden = false;
    let quays;
    try {
      [quays] = await Promise.all([loadQuays(), loadLeaflet()]);
    } catch {
      $('mapInfo').textContent = t('mapFailed');
      return;
    }
    if ($('mapSheet').hidden) return;   // closed while loading
    const points = platformPoints(quays[stop.id] || {});
    const target = platform ? points.find(p => p.names.includes(platform) || p.names.includes(platform.toUpperCase())) : null;
    const dest = target ? target.pos : (stop.coord || (points[0] && points[0].pos));

    ensureMap();
    map.invalidateSize();
    mapLayer.clearLayers(); userLayer.clearLayers();
    for (const p of points) {
      const isTarget = p === target;
      const size = isTarget ? 38 : 28;
      L.marker(p.pos, {
        icon: L.divIcon({ className: '', html: `<span class="qm${isTarget ? ' target' : ''}" data-quay="${esc(p.label)}">${esc(p.label)}</span>`,
                          iconSize: [size, size], iconAnchor: [size / 2, size / 2] }),
        zIndexOffset: isTarget ? 1000 : 0, title: p.label, keyboard: false
      }).addTo(mapLayer);
    }
    if (target) map.setView(target.pos, 19);
    else if (points.length) map.fitBounds(points.map(p => p.pos), { padding: [40, 40], maxZoom: 19 });
    else if (dest) map.setView(dest, 17);

    const notes = [];
    if (platform && !target) notes.push(t('platformUnknown', { p: label }));
    else if (!points.length) notes.push(t('noPlatforms'));
    $('mapInfo').textContent = notes.join(' ');
    if (dest) { $('walkThere').href = walkUrl(dest); $('walkThere').textContent = t('walkThere'); $('walkThere').hidden = false; trackUser(dest, notes); }
  }

  function trackUser(dest, notes) {
    if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    if (!navigator.geolocation) { $('mapInfo').textContent = [...notes, t('noLocation')].join(' '); return; }
    $('mapInfo').textContent = [...notes, t('locatingYou')].join(' ');
    let first = true;
    watchId = navigator.geolocation.watchPosition(pos => {
      const me = [pos.coords.latitude, pos.coords.longitude];
      userLayer.clearLayers();
      L.circle(me, { radius: pos.coords.accuracy || 0, weight: 1, color: '#1c7ed6', fillOpacity: .1 }).addTo(userLayer);
      L.circleMarker(me, { radius: 8, weight: 3, color: '#fff', fillColor: '#1c7ed6', fillOpacity: 1 }).addTo(userLayer);
      const d = distanceM(me, dest);
      $('mapInfo').textContent = [...notes, t('distance', { d: fmtDistance(d), min: fmtMin(walkMinutes(d)) })].join(' ');
      if (first && d < 2000) map.fitBounds([me, dest], { padding: [50, 50], maxZoom: 19 });   // show both, once
      first = false;
    }, () => { $('mapInfo').textContent = [...notes, t('noLocation')].join(' '); },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 });
  }

  function closeMap() {
    $('mapSheet').hidden = true;
    pickState = null; $('pickConfirm').hidden = true;
    if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  }

  // ---------- Settings (US-18) ----------
  // Walking time = straight-line distance × DETOUR / walking speed (streets are rarely straight).
  const DETOUR = 1.3;
  const DEFAULT_SETTINGS = { prepMin: 10, speedKmh: 4.8, marginMin: 1, learned: 0, samples: [], alightReminder: true };
  const getSettings = () => Object.assign({}, DEFAULT_SETTINGS, store.get('settings', {}));
  const saveSettings = s => store.set('settings', s);
  const speedMPerMin = () => getSettings().speedKmh * 1000 / 60;
  const walkMinutes = meters => meters * DETOUR / speedMPerMin();
  const fmtMin = m => String(Math.max(1, Math.round(m)));
  const fmtDuration = min => { const m = Math.round(min); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}`; };

  // ---------- Journeys (US-14, US-15, US-07, US-08, US-09) ----------
  const MAX_ACCESS_M = 1200;          // stops further than this from a map point are not tried
  const DEFAULT_CENTER = [46.2044, 6.1432];
  const places = { from: null, to: null };
  let journeys = [], journeyCtrl = null;
  const journeySearchCtrl = { from: null, to: null };

  // Stop search shared by the departure board and the journey planner
  async function findStops(q, signal) {
    let stations = uniqueById(await data.locations(q, signal));
    let inside = stations.filter(inZone);
    // Short names ("Bel-Air", "Gare") often return other towns first: retry targeting Geneva
    if (inside.length < 3 && !/gen[eè]v/i.test(q)) {
      stations = uniqueById([...stations, ...(await data.locations('Genève ' + q, signal))]);
      inside = stations.filter(inZone);
    }
    return { stations, inside };
  }
  const coordOf = s => s && s.coordinate && s.coordinate.x != null ? [s.coordinate.x, s.coordinate.y] : null;

  // Stops, addresses and places of interest; those in the area first (US-23)
  async function findPlaces(q, signal) {
    const key = x => x.id || `${x.name}|${x.coordinate.x.toFixed(5)}`;
    const dedupe = list => [...new Map(list.map(x => [key(x), x])).values()];
    let found = dedupe(await data.places(q, signal));
    if (found.filter(inZone).length < 3 && !/gen[eè]v/i.test(q)) found = dedupe([...found, ...(await data.places('Genève ' + q, signal))]);
    const inside = found.filter(inZone);
    return [...inside, ...found.filter(x => !inZone(x))].slice(0, 10);
  }

  // Stops around a point, nearest first, with their straight-line distance
  async function stopsNear(pos, n, signal) {
    return uniqueById(await data.around(pos, signal)).map(s => {
      const c = coordOf(s);
      return { id: s.id, name: s.name, coord: c, meters: c ? distanceM(pos, c) : (s.distance ?? 1e9) };
    }).filter(s => s.meters <= MAX_ACCESS_M).sort((a, b) => a.meters - b.meters).slice(0, n);
  }

  function placeLabel(p) {
    if (!p) return '';
    if (p.kind === 'stop' || p.kind === 'addr') return p.name;
    if (p.kind === 'saved') return `${p.icon || ''} ${p.name}`.trim();
    const base = t(p.kind === 'me' ? 'myPosition' : 'pointOnMap');
    return p.near ? `${base} · ${t('nearStop', { d: fmtDistance(p.near.meters), name: p.near.name })}` : base;
  }
  function setPlace(which, p) {
    places[which] = p;
    $(which + 'Q').value = placeLabel(p);
    $(which + 'Results').hidden = true;
    store.set('journey:' + which, p);
    renderSaveButtons();
  }
  // ☆ next to a field holding something that is not yet one of my places
  function renderSaveButtons() {
    document.querySelectorAll('.place-save').forEach(b => { const p = places[b.dataset.which]; b.hidden = !p || p.kind === 'saved'; });
  }

  // Result rows for a place search: my places first, then stops, addresses and places of interest
  const fold = x => String(x).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  function placeRowsHtml(q, found) {
    const mine = sortedPlaces().filter(p => fold(placeName(p)).includes(fold(q)) || fold(t('kind' + cap(p.kind))).includes(fold(q)));
    const rows = mine.map(p => `<li><button data-pid="${esc(p.id)}"><span class="ico">${PLACE_ICON[p.kind]}</span><span>${esc(placeName(p))}</span><span class="kind">${esc(t('kSaved'))}</span></button></li>`);
    for (const x of found) {
      const c = coordOf(x);
      if (x.type === 'stop') {
        const m = modeOfIcon(x.icon, x.name);
        rows.push(`<li><button data-id="${esc(x.id)}" data-name="${esc(x.name)}" data-lat="${c ? c[0] : ''}" data-lon="${c ? c[1] : ''}">${pictoHtml(m)}<span>${esc(x.name)}</span></button></li>`);
      } else rows.push(`<li><button data-addr="${esc(x.name)}" data-lat="${c[0]}" data-lon="${c[1]}"><span class="ico">${x.type === 'poi' ? '⭐' : '📍'}</span>` +
        `<span>${esc(x.name)}</span><span class="kind">${esc(t(x.type === 'poi' ? 'kPoi' : 'kAddress'))}</span></button></li>`);
    }
    return rows.length ? rows.join('') : `<li class="empty">${esc(t('noPlaceFound'))}</li>`;
  }
  const cap = w => w.charAt(0).toUpperCase() + w.slice(1);

  async function searchPlace(which, q) {
    if (journeySearchCtrl[which]) journeySearchCtrl[which].abort();
    const ctrl = journeySearchCtrl[which] = new AbortController();
    const ul = $(which + 'Results');
    try {
      const found = await findPlaces(q, ctrl.signal);
      ul.hidden = false;
      ul.innerHTML = placeRowsHtml(q, found);
    } catch (e) {
      if (e.name === 'AbortError') return;
      ul.hidden = false; ul.innerHTML = `<li class="empty">${esc(t('searchFailed'))}</li>`;
    }
  }
  // A tapped result row → a journey place
  function placeFromRow(b) {
    if (b.dataset.pid) { const p = getPlaces()[b.dataset.pid]; return p ? savedRef(p) : null; }
    const coord = b.dataset.lat ? [+b.dataset.lat, +b.dataset.lon] : null;
    if (b.dataset.id) return { kind: 'stop', id: b.dataset.id, name: b.dataset.name, coord };
    if (b.dataset.addr) return { kind: 'addr', name: b.dataset.addr, coord };
    return null;
  }

  function useMyPosition(which) {
    if (!navigator.geolocation) { $('journeyStatus').textContent = t('geoUnavailable'); return; }
    $('journeyStatus').innerHTML = `<span class="spinner"></span> ${esc(t('locating'))}`;
    navigator.geolocation.getCurrentPosition(async pos => {
      const coord = [pos.coords.latitude, pos.coords.longitude];
      let near = null;
      try { near = (await stopsNear(coord, 1))[0] || null; } catch { /* label without the nearest stop */ }
      setPlace(which, { kind: 'me', coord, near });
      $('journeyStatus').textContent = '';
    }, () => { $('journeyStatus').textContent = t('geoDenied'); }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
  }

  // Candidate stops for a place: the stop itself, or the nearest stops of a point
  async function candidates(p, n, signal) {
    if (p.kind === 'stop') return [{ id: p.id, name: p.name, coord: p.coord, meters: 0 }];
    return stopsNear(p.coord, n, signal);
  }

  function readWhen() {
    const mode = $('whenMode').value;
    const at = mode === 'now' ? new Date() : new Date($('whenAt').value);
    return { mode, at: isNaN(at) ? new Date() : at };
  }

  async function fetchConnections(a, b, when, signal) {
    const access = walkMinutes(a.meters), egress = walkMinutes(b.meters);
    // Ask from the moment the rider can actually be at the first stop (or by when they must leave the last one)
    const ref = when.mode === 'arrive' ? new Date(when.at - egress * 60000) : new Date(Math.max(when.at, Date.now()) + access * 60000);
    const r = await data.connections(a.id, b.id, ref, when.mode === 'arrive', signal);
    return (r.connections || []).map(c => buildJourney(c, a, b)).filter(Boolean);
  }

  const tsOr = (ts, s) => ts ? new Date(ts * 1000) : parseTime(s);
  const stopRef = st => st ? { id: st.id, name: st.name, coord: coordOf(st) } : { id: null, name: '', coord: null };
  function walkSectionMin(s, dep, arr) {
    if (dep && arr && arr > dep) return (arr - dep) / 60000;
    const d = s.walk && s.walk.duration;
    if (typeof d === 'number') return d > 100 ? d / 60 : d;               // seconds or minutes
    const m = String(d || '').match(/(\d+):(\d+)(?::(\d+))?$/);           // "00d00:05:00" or "00:05:00"
    return m ? (m[3] != null ? +m[1] * 60 + +m[2] + +m[3] / 60 : +m[1] * 60 + +m[2]) : 0;
  }

  // Colour of a ride's line on the journey (US-29): the line colour, or the colour of the SBB timetable icon
  function lineColor(style) {
    if (style.bg) return style.bg;
    if (style.icon) return /^(ter|r|s|sn|pe)(-|$)/.test(style.icon) ? 'var(--text)' : '#eb0000';
    return null;
  }
  // Stops between boarding and alighting, with their (live) time (US-30). Entries without a name are skipped.
  function viaStops(pass) {
    return pass.slice(1, -1).map(p => {
      const st = p.station || {};
      const planned = tsOr(p.arrivalTimestamp, p.arrival) || tsOr(p.departureTimestamp, p.departure);
      const pr = p.prognosis || {};
      const live = parseTime(pr.arrival) || parseTime(pr.departure);
      const depAt = parseTime(pr.departure) || tsOr(p.departureTimestamp, p.departure) || live || planned;
      return { name: st.name || '', id: st.id || null, coord: coordOf(st), time: live || planned, live: !!live, depAt };
    }).filter(v => v.name);
  }
  // Where each walk starts and ends (US-32): a place, or a stop and its platform
  function placeWalks(legs, a, b) {
    const named = (p, fallback) => ['saved', 'addr'].includes(p.kind) ? p.name : t(fallback);
    const startPlace = places.from && places.from.kind !== 'stop' ? { name: named(places.from, 'yourStart'), coord: places.from.coord } : null;
    const endPlace = places.to && places.to.kind !== 'stop' ? { name: named(places.to, 'yourDestination'), coord: places.to.coord } : null;
    const stopEnd = (st, platform, mode) => st && st.name ? { name: st.name, stopId: st.id, coord: st.coord, platform, mode } : null;
    legs.forEach((l, i) => {
      if (l.type !== 'walk') return;
      const prev = legs.slice(0, i).reverse().find(x => x.type === 'ride');
      const next = legs.slice(i + 1).find(x => x.type === 'ride');
      l.start = (i > 0 && legs[i - 1].type === 'ride') ? stopEnd(prev.toStop, prev.arrPlatform, prev.mode)
        : prev ? stopEnd(prev.toStop, prev.arrPlatform, prev.mode)
        : (startPlace || stopEnd({ id: a.id, name: a.name, coord: a.coord }, '', 'bus'));
      l.end = next ? stopEnd(next.from, next.platform, next.mode) : (endPlace || stopEnd({ id: b.id, name: b.name, coord: b.coord }, '', 'bus'));
      if (l.edge === 'access' && startPlace) l.start = startPlace;
      if (l.edge === 'egress' && endPlace) l.end = endPlace;
    });
  }
  // BUG-03: a walk followed by another walk is one walk, from the first start to the last end
  function mergeWalks(legs) {
    for (let i = legs.length - 1; i > 0; i--) {
      const x = legs[i - 1], y = legs[i];
      if (x.type !== 'walk' || y.type !== 'walk') continue;
      legs.splice(i - 1, 2, Object.assign({}, x, {
        min: x.min + y.min, meters: (x.meters || 0) + (y.meters || 0) || undefined, end: y.end || x.end, to: y.to,
        edge: y.edge === 'egress' ? 'egress' : x.edge === 'access' ? 'access' : y.edge
      }));
    }
  }

  function buildJourney(c, a, b) {
    const legs = [];
    if (a.meters > 30) legs.push({ type: 'walk', min: walkMinutes(a.meters), meters: a.meters, to: a.name, edge: 'access' });
    for (const s of c.sections || []) {
      const dep = s.departure || {}, arr = s.arrival || {};
      const depT = tsOr(dep.departureTimestamp, dep.departure), arrT = tsOr(arr.arrivalTimestamp, arr.arrival);
      if (s.journey) {
        const j = s.journey, mode = modeOfCategory(j.category), label = lineLabel(j, mode);
        const depReal = parseTime(dep.prognosis && dep.prognosis.departure);
        let delay = dep.delay != null && !isNaN(Number(dep.delay)) ? Number(dep.delay) : null;
        if (depReal && depT) delay = Math.round((depReal - depT) / 60000);
        const real = depReal || (depT && delay != null ? new Date(depT.getTime() + delay * 60000) : null);
        const arrReal = parseTime(arr.prognosis && arr.prognosis.arrival);
        const pass = j.passList || [];
        const style = lineStyle(j, mode, label);
        legs.push({ type: 'ride', mode, label, style, color: lineColor(style), to: j.to || '', category: j.category, number: j.number,
          dep: depT, real, live: !!real, delay: delay || 0, arr: arrT, arrReal,
          from: stopRef(dep.station), toStop: stopRef(arr.station),
          platform: (dep.prognosis && dep.prognosis.platform) || dep.platform || '',
          arrPlatform: (arr.prognosis && arr.prognosis.platform) || arr.platform || '',
          stops: Math.max(0, pass.length - 1), via: viaStops(pass) });
      } else {
        legs.push({ type: 'walk', min: walkSectionMin(s, depT, arrT), to: (arr.station && arr.station.name) || '', edge: 'transfer' });
      }
    }
    if (b.meters > 30) legs.push({ type: 'walk', min: walkMinutes(b.meters), meters: b.meters, from: b.name, to: '', edge: 'egress' });
    placeWalks(legs, a, b);
    mergeWalks(legs);
    const rides = legs.filter(l => l.type === 'ride');
    if (!rides.length || !rides[0].dep) return null;
    const firstIdx = legs.indexOf(rides[0]), lastIdx = legs.lastIndexOf(rides[rides.length - 1]);
    const sumWalk = arr => arr.filter(l => l.type === 'walk').reduce((acc, l) => acc + l.min, 0);
    const walkBefore = sumWalk(legs.slice(0, firstIdx)), walkAfter = sumWalk(legs.slice(lastIdx + 1));
    const first = rides[0], last = rides[rides.length - 1];
    const leaveAt = new Date((first.real || first.dep).getTime() - walkBefore * 60000);
    const arriveAt = new Date((last.arrReal || last.arr || last.dep).getTime() + walkAfter * 60000);
    return { legs, rides, leaveAt, arriveAt, walkBefore, accessMeters: a.meters, apiWalkBefore: walkBefore - (a.meters > 30 ? walkMinutes(a.meters) : 0),
      durationMin: (arriveAt - leaveAt) / 60000, transfers: rides.length - 1, walkMin: sumWalk(legs), live: rides.some(r => r.live),
      key: rides.map(r => `${r.label}@${r.dep.getTime()}`).join('|') };
  }

  function rankJourneys(list, prio, mode) {
    const byTime = (x, y) => mode === 'arrive' ? (y.leaveAt - x.leaveAt) : (x.arriveAt - y.arriveAt);
    const byWalk = (x, y) => Math.round(x.walkMin) - Math.round(y.walkMin);
    return list.slice().sort(prio === 'walk' ? (x, y) => byWalk(x, y) || byTime(x, y) : (x, y) => byTime(x, y) || byWalk(x, y));
  }

  async function searchJourneys() {
    const { from, to } = places;
    const status = $('journeyStatus');
    if (!from || !to) { status.textContent = t('chooseBoth'); return; }
    [from, to].forEach(p => { if (p.kind === 'saved') recordPlaceUse(p.placeId); });
    if (journeyCtrl) journeyCtrl.abort();
    journeyCtrl = new AbortController();
    const signal = journeyCtrl.signal;
    status.innerHTML = `<span class="spinner"></span> ${esc(t('loading'))}`;
    openJourney = null;
    try {
      const when = readWhen();
      // 2 × 2 stops at most: each pair is one /connections call, and the free API allows about 1000 per day
      const [fromC, toC] = await Promise.all([candidates(from, 2, signal), candidates(to, 2, signal)]);
      if (!fromC.length || !toC.length) {
        status.textContent = t('noStopNear', { name: placeLabel(!fromC.length ? from : to) }); $('journeyResults').hidden = true; return;
      }
      const pairs = fromC.flatMap(a => toC.map(b => [a, b])).filter(([a, b]) => a.id !== b.id);
      const lists = await Promise.all(pairs.map(([a, b]) => fetchConnections(a, b, when, signal).catch(e => { if (e.name === 'AbortError') throw e; return []; })));
      const limit = when.mode === 'now' ? Date.now() - 60000 : when.at.getTime() - 60000;
      const best = new Map();
      for (const j of lists.flat()) {
        if (when.mode === 'arrive' ? j.arriveAt > when.at.getTime() + 60000 : j.leaveAt < limit) continue;  // can't make it
        const prev = best.get(j.key);
        if (!prev || j.walkMin < prev.walkMin) best.set(j.key, j);   // same vehicles from another stop: keep the shorter walk
      }
      journeys = [...best.values()];
      status.textContent = journeys.length ? '' : t('noJourney');
      renderJourneys();
    } catch (e) {
      if (e.name === 'AbortError') return;
      status.textContent = t('journeyFailed');
    }
  }

  const MAP_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5.1 9 3 3 5v16l6-2.1 6 2.1 6-2V3l-6 2.1zM14 18.6l-4-1.4V5.4l4 1.4v11.8z"/></svg>';

  // ---------- Map picker (US-15) ----------
  let pickState = null;   // { which, pos, near }

  }
  async function openPicker(which) {

    if (!pickState) return;

    const other = which === 'save' ? null : places[which === 'from' ? 'to' : 'from'];
    const existing = which === 'save' ? (placeDraft && placeDraft.coord ? { kind: 'point', coord: placeDraft.coord } : null) : places[which];
    map.setView((existing && existing.coord) || (other && other.coord) || DEFAULT_CENTER, existing ? 17 : 14);

  async function setPickPoint(pos) {

    mapLayer.clearLayers();

    $('pickConfirm').hidden = false;
    $('mapInfo').innerHTML = `<span class="spinner"></span> ${esc(t('loading'))}`;
    try {
      const near = (await stopsNear(pos, 1))[0];
      if (!pickState || pickState.pos !== pos) return;
      pickState.near = near || null;
      $('mapInfo').textContent = near ? t('nearStop', { d: fmtDistance(near.meters), name: near.name }) : t('noStopNear', { name: t('pointOnMap') });
    } catch { $('mapInfo').textContent = ''; }
  }

  // ---------- Departure alarms (US-16, US-17) ----------
  const LIVE_REFRESH_MS = 60000;
  const getAlarms = () => store.get('alarms', []);
  const saveAlarms = list => store.set('alarms', list);

  function alarmTimes(a, s = getSettings()) {
    const dep = (a.live && a.live.dep) || a.first.sched;
    const walk = (a.accessMeters > 30 ? walkMinutes(a.accessMeters) : 0) + (a.apiWalkBefore || 0);
    const leave = dep - (walk + s.marginMin) * 60000;
    return { dep, walk, leave, ready: leave - s.prepMin * 60000,
             delay: a.live ? Math.round((a.live.dep - a.first.sched) / 60000) : null };
  }

  // One reminder per ride, when the vehicle leaves the stop before the one where the rider gets off (US-31)
  function alightPlan(j) {
    return j.rides.map((r, n) => {
      const prev = r.via.length ? r.via[r.via.length - 1] : null;
      const at = prev ? (prev.depAt || prev.time) : (r.real || r.dep);
      const next = j.rides[n + 1];
      const after = j.legs.slice(j.legs.indexOf(r) + 1);
      const walkEnd = !next ? after.filter(l => l.type === 'walk').reduce((s, l) => s + l.min, 0) : 0;
      // `at`: when the vehicle leaves the stop before the get-off stop (planned when the alarm was set);
      // `prev*`: that stop, watched live (its departure board) and by position (US-35)
      const prevStop = prev || { id: r.from.id, name: r.from.name, coord: r.from.coord };
      return { at: at ? at.getTime() : null, boardAt: (r.real || r.dep).getTime(), stop: r.toStop.name, stopId: r.toStop.id, stopCoord: r.toStop.coord || null,
               prevId: prevStop.id || null, prevName: prevStop.name, prevCoord: prevStop.coord || null,
               category: r.category, number: r.number, mode: r.mode, label: r.label,
               next: next ? { mode: next.mode, label: next.label, platform: next.platform, dep: (next.real || next.dep).getTime() } : null,
               walkEnd };
    }).filter(x => x.at);
  }
  // Live delay of the first vehicle since the alarm was set: used for rides not yet followed live
  const alightShift = a => a.live && a.created0 ? a.live.dep - a.created0 : 0;
  // Reminder time: the live departure from the stop before, else the planned one shifted by the first vehicle's delay
  const alightAt = (a, x) => x.liveAt || (x.at + alightShift(a));
  const lastAlightAt = a => (a.alights || []).reduce((m, x) => Math.max(m, alightAt(a, x)), 0);

  // ---------- Get-off reminders by position (US-35) ----------
  // While a followed ride is under way and the page is open, the position decides: the reminder rings when I
  // leave the stop before my get-off stop. Without a recent, precise fix (tunnel, permission refused, phone
  // asleep) the live time above decides.
  const NEAR_M = 60;              // "at the stop before"
  const LEFT_M = 90;              // "has left it"
  const GPS_MAX_ACC = 50;         // fixes less precise than this are ignored
  const GPS_FRESH_MS = 30000;     // a fix older than this does not count
  const GPS_WAIT_MAX_MS = 5 * 60000;   // the position may hold a reminder back at most this long after its time
  const gps = { watch: null, fix: null, denied: false };
  const gpsFresh = now => gps.fix && now - gps.fix.t < GPS_FRESH_MS;

  // Followed rides whose reminder is still to come: from 5 min before the first departure
  function pendingAlights(now = Date.now()) {
    const s = getSettings();
    if (s.alightReminder === false) return [];
    const out = [];
    for (const a of getAlarms()) {
      const start = alarmTimes(a, s).dep - 5 * 60000;
      if (now < start) continue;
      const n = (a.alights || []).findIndex((x, k) => !a.fired['alight' + k]);   // the current ride only
      if (n >= 0 && now - alightAt(a, a.alights[n]) < GPS_WAIT_MAX_MS + 60000) out.push({ a, x: a.alights[n], n });
    }
    return out;
  }
  function updateGpsWatch() {
    const need = pendingAlights().some(({ x }) => x.prevCoord && x.stopCoord);
    if (need && !gps.watch && !gps.denied && navigator.geolocation) {
      gps.watch = navigator.geolocation.watchPosition(onGpsFix, err => {
        if (err && err.code === 1) { gps.denied = true; stopGpsWatch(); renderAlarms(); }
      }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
    } else if (!need && gps.watch) stopGpsWatch();
  }
  function stopGpsWatch() {
    if (gps.watch != null) { try { navigator.geolocation.clearWatch(gps.watch); } catch { /* already stopped */ } }
    gps.watch = null;
  }
  function onGpsFix(pos) {
    if (pos.coords.accuracy > GPS_MAX_ACC) return;
    const first = !gpsFresh(Date.now());
    gps.fix = { p: [pos.coords.latitude, pos.coords.longitude], t: Date.now() };
    checkGpsAlights();
    if (first) renderAlarms();
  }
  function checkGpsAlights() {
    if (!gps.fix) return;
    const now = Date.now(), p = gps.fix.p;
    const list = getAlarms();
    let changed = false;
    for (const a of list) {
      const n = (a.alights || []).findIndex((x, k) => !a.fired['alight' + k]);
      if (n < 0) continue;
      const x = a.alights[n];
      if (!x.prevCoord || !x.stopCoord || !pendingAlights(now).some(q => q.a.id === a.id)) continue;
      const dPrev = distanceM(p, x.prevCoord), dStop = distanceM(p, x.stopCoord), span = distanceM(x.prevCoord, x.stopCoord);
      a.gpsSeen = a.gpsSeen || {};
      if (dPrev <= NEAR_M && !a.gpsSeen[n]) { a.gpsSeen[n] = now; changed = true; }
      // left the stop before, heading for the get-off stop; or already more than halfway there without a fix at the stop
      // only once this ride may have started (a 1-stop ride's stop before is where I wait for it)
      const started = now >= (x.boardAt || 0) + (n === 0 ? alightShift(a) : 0) - 60000;
      const left = started && a.gpsSeen[n] && dPrev >= LEFT_M && dStop < span + 30;
      const halfway = started && !a.gpsSeen[n] && span > 150 && dStop < span * 0.5;
      if (left || halfway) {
        a.fired['alight' + n] = now;

  function gpsHolds(a, x, n, now) {
    if (!gpsFresh(now) || !x.prevCoord || now - alightAt(a, x) > GPS_WAIT_MAX_MS) return false;
    const dPrev = distanceM(gps.fix.p, x.prevCoord);
    const seen = a.gpsSeen && a.gpsSeen[n];
    return dPrev < LEFT_M || (!seen && dPrev > 150);
  }
  function gpsStatusText(a) {
    if (gps.denied) return (a.alights || []).some((x, n) => !a.fired['alight' + n]) ? t('gpsDenied') : '';
    if (!pendingAlights().some(q => q.a.id === a.id)) return '';
    if (gpsFresh(Date.now())) return t('gpsOn');
    return gps.watch ? t('gpsWaiting') : '';
  }

  function createAlarm(j) {
    const f = j.rides[0];
    const alarm = {
      id: String(Date.now()), created: Date.now(), fired: {},
      from: placeLabel(places.from), to: placeLabel(places.to), origin: places.from && places.from.coord,
      accessMeters: j.accessMeters, apiWalkBefore: Math.max(0, j.apiWalkBefore || 0),
      first: { stopId: f.from.id, stopName: f.from.name, stopCoord: f.from.coord, category: f.category, number: f.number,
               mode: f.mode, label: f.label, style: f.style, to: f.to, sched: f.dep.getTime(), platform: f.platform },
      live: f.real ? { dep: f.real.getTime(), at: Date.now() } : null,
      created0: (f.real || f.dep).getTime(),   // first departure when the alarm was set, to shift the get-off times with live data
      alights: alightPlan(j)
    };

    // Set after the leave time → only "Leave" rings (at once). Set after the get-ready time → "Get ready" rings at once.
    const tm0 = alarmTimes(alarm), now0 = Date.now();

    else if (now0 >= tm0.leave) alarm.fired.ready = now0;

    if (getSettings().alightReminder !== false && navigator.geolocation && alarm.alights.length)
      navigator.geolocation.getCurrentPosition(() => { gps.denied = false; updateGpsWatch(); }, err => { if (err.code === 1) gps.denied = true; }, { maximumAge: 60000, timeout: 15000 });
    renderAlarms(); tickAlarms();
    $('alarmCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function renderAlarms() {
    const list = getAlarms(), s = getSettings();
    $('alarmCard').hidden = list.length === 0;
    $('alarmList').innerHTML = list.map(a => {
      const tm = alarmTimes(a, s), f = a.first;
      const src = tm.delay == null ? t('timetable') : tm.delay > 0 ? t('liveDelay', { d: '+' + tm.delay + ' min' }) : t('liveOnTime');
      const plat = f.platform ? ` · ${t(f.mode === 'train' ? 'track' : 'platform', { p: f.platform })}` : '';

      return `<li class="alarm" data-id="${esc(a.id)}">
        <div class="al-times">
          <div class="${a.fired.ready ? 'done' : ''}"><small>${esc(t('getReady'))}</small><b data-k="ready">${hhmm(new Date(tm.ready))}</b></div>
          <div class="${a.fired.leave ? 'done' : ''}"><small>${esc(t('leaveHome'))}</small><b data-k="leave">${hhmm(new Date(tm.leave))}</b></div>
          <div><small>${esc(t('departs'))}</small><b data-k="dep">${hhmm(new Date(tm.dep))}</b></div>
        </div>
        <div class="al-line">${lineIdHtml(f.mode, f.style, f.label, true)} <span>→ ${esc(f.to)} · ${esc(f.stopName)}${esc(plat)}</span></div>
        <div class="status" data-k="src">${esc(src)} · ${esc(t('walkInfo', { min: fmtMin(tm.walk), speed: s.speedKmh.toFixed(1), margin: s.marginMin, prep: s.prepMin }))}</div>

          <button class="ghost" data-act="test-leave">${esc(t('testLeave'))}</button>
          ${(a.alights || []).length ? `<button class="ghost" data-act="test-alight">${esc(t('testAlight'))}</button>` : ''}
          <button class="ghost" data-act="cancel">${esc(t('cancel'))}</button>
        </div></li>`;
    }).join('');
  }

  function tickAlarms() {
    const now = Date.now(), s = getSettings();
    let list = getAlarms(), changed = false;
    for (const a of list) {
      const tm = alarmTimes(a, s);
      // past the leave time: only "Leave" rings (no "Get ready" first)
      if (!a.fired.leave && now >= tm.leave) { a.fired.leave = now; a.fired.ready = a.fired.ready || now; changed = true; fireAlarm(a, 'leave'); }
      else if (!a.fired.ready && now >= tm.ready) { a.fired.ready = now; changed = true; fireAlarm(a, 'ready'); }
      // get-off reminders: only the latest one due rings (no burst after the phone slept); while they are
      // switched off, due reminders are marked as passed so they don't ring when switched back on
      const due = (a.alights || []).map((x, n) => ({ x, n }))
        .filter(({ x, n }) => !a.fired['alight' + n] && now >= alightAt(a, x) && !(s.alightReminder !== false && gpsHolds(a, x, n, now)));
      if (due.length) {
        due.forEach(({ n }) => { a.fired['alight' + n] = now; });
        changed = true;
        const last = due[due.length - 1];
        if (s.alightReminder !== false && now - alightAt(a, last.x) < GPS_WAIT_MAX_MS + 60000) fireAlight(a, last.n);
      }
    }
    // forget alarms 10 min after the departure, or after the last get-off reminder
    const kept = list.filter(a => now <= Math.max(alarmTimes(a, s).dep, lastAlightAt(a)) + 10 * 60000);
    if (changed || kept.length !== list.length) { saveAlarms(kept); renderAlarms(); }
  }

  // US-17: follow the first vehicle on live data while the alarm is pending
  async function refreshAlarmsLive() {
    const list = getAlarms();
    let changed = false;
    const boards = new Map();   // one departure board per stop and refresh
    const boardOf = (id, from) => { if (!boards.has(id)) boards.set(id, data.board(id, from).catch(() => null)); return boards.get(id); };
    const schedOf = j => { const st = j.stop || {}; const d = st.departureTimestamp ? new Date(st.departureTimestamp * 1000) : parseTime(st.departure); return d ? d.getTime() : 0; };
    const now = Date.now();
    for (const a of list) {
      // US-35: each ride followed live at the stop before its get-off stop, during the hour before
      for (const [n, x] of (a.alights || []).entries()) {
        if (a.fired['alight' + n] || !x.prevId || x.at - now > 3600000 || now - alightAt(a, x) > 15 * 60000) continue;
        const r = await boardOf(x.prevId, new Date(Math.min(x.at, now) - LOOKBACK_MIN * 60000));
        const m = r && (r.stationboard || []).find(j => String(j.category) === String(x.category) && String(j.number) === String(x.number)
          && Math.abs(schedOf(j) - x.at) < 90000);
        if (!m) continue;
        const nm = normalize(m), liveAt = nm.real ? nm.real.getTime() : x.at;
        if (x.liveAt !== liveAt) { x.liveAt = liveAt; changed = true; }
      }
      if (a.fired.leave) continue;
      try {
        const r = await data.board(a.first.stopId, new Date(a.first.sched - LOOKBACK_MIN * 60000));
        const m = (r.stationboard || []).find(j => String(j.category) === String(a.first.category) && String(j.number) === String(a.first.number)
          && Math.abs(schedOf(j) - a.first.sched) < 60000);
        if (!m) continue;
        const n = normalize(m);
        if (n.real) { a.live = { dep: n.real.getTime(), at: Date.now() }; changed = true; }
      } catch { /* keep the last known time */ }
    }
    if (changed) { saveAlarms(list); renderAlarms(); tickAlarms(); }
  }

  // ---------- Ringing: banner, sound, vibration, notification ----------
  let audioCtx = null;
  function unlockAudio() {
    try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch { audioCtx = null; }
  }
  function beep() {
    if (!audioCtx) return;
    try {
      [0, 0.35, 0.7].forEach(dt => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = 880; g.gain.value = 0.15;
        o.connect(g); g.connect(audioCtx.destination);
        o.start(audioCtx.currentTime + dt); o.stop(audioCtx.currentTime + dt + 0.2);
      });
    } catch { /* no sound */ }
  }
  function askNotificationPermission() {
    try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().then(renderNotifState); } catch { /* unsupported */ }
  }

  function fireAlight(a, n) {

  function fireAlarm(a, kind) {
    const tm = alarmTimes(a), f = a.first;
    const line = `${modeName(f.mode)} ${f.label}`;
    const plat = f.platform ? ` (${t(f.mode === 'train' ? 'track' : 'platform', { p: f.platform })})` : '';

    $('abTitle').textContent = (kind === 'ready' ? '⏰ ' : '🚶 ') + title;
