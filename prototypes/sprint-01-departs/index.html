<!DOCTYPE html>
<!--
  App Transport Public — Prototype Sprint 1 : prochains départs
  - Recherche d'arrêt (bus, tram, train, bateau) dans la zone Unireso / Léman Express
  - Prochains départs en temps réel (prognosis) avec compte à rebours
  - Sélection / désélection des lignes, mémorisée par arrêt
  - Arrêts les plus consultés en tête, dernier arrêt rouvert au lancement
  Données : https://transport.opendata.ch (sans clé, CORS ouvert)
  Fichier autonome : ouvrir directement dans un navigateur (pas de serveur requis).
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>swissPublicTransport — Sprint 1 prototype</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --text: #111827; --muted: #6b7280; --line: #e5e7eb;
    --accent: #c8102e; --late: #d9480f; --ok: #2b8a3e;
    --tram: #e8590c; --bus: #1c7ed6; --train: #c92a2a; --ship: #0c8599; --other: #495057;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1220; --card: #141c2e; --text: #e8ecf3; --muted: #94a0b4; --line: #26314a; --late: #ff922b; --ok: #69db7c; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 12px 40px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 6px 2px 12px; }
  header h1 { font-size: 1.15rem; margin: 0; letter-spacing: -.01em; }
  header h1 span { color: var(--accent); }
  header small { color: var(--muted); font-size: .75rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; }
  .search-row { display: flex; gap: 8px; }
  input[type=search] { flex: 1; min-width: 0; font-size: 1rem; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--bg); color: var(--text);
    border-radius: 10px; padding: 10px 12px; }
  button:active { transform: scale(.98); }
  .ghost { border: none; background: none; color: var(--muted); padding: 6px 8px; font-size: .85rem; }
  .opts { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; color: var(--muted); font-size: .8rem; }
  .opts label { display: flex; gap: 6px; align-items: center; }
  ul { list-style: none; margin: 0; padding: 0; }
  .results li button { width: 100%; text-align: left; display: flex; gap: 10px; align-items: center;
    border: none; border-bottom: 1px solid var(--line); border-radius: 0; background: none; padding: 11px 4px; }
  .results li:last-child button { border-bottom: none; }
  .results .dist { margin-left: auto; color: var(--muted); font-size: .8rem; }
  .ico { width: 28px; height: 28px; flex: none; border-radius: 7px; display: grid; place-items: center; font-size: .9rem; }
  .section-title { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .stop-chip { border-radius: 999px; padding: 7px 12px; font-size: .9rem; background: var(--bg); }
  .stop-chip .n { color: var(--muted); font-size: .75rem; margin-left: 4px; }
  .board-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .board-head h2 { margin: 0; font-size: 1.2rem; }
  .status { color: var(--muted); font-size: .78rem; margin-top: 2px; }
  .line-chip { min-width: 44px; padding: 6px 10px; border-radius: 8px; font-weight: 700; font-size: .9rem;
    color: #fff; border: 2px solid transparent; display: inline-flex; gap: 5px; align-items: center; justify-content: center; }
  .line-chip[aria-pressed="false"] { background: transparent !important; color: var(--muted); border-color: var(--line); text-decoration: line-through; }
  .line-chip[aria-pressed="false"] .m { filter: grayscale(1); opacity: .5; }
  .line-chip .m { font-size: .8rem; }
  .filter-actions { display: flex; gap: 4px; }
  .dep { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); }
  .dep:last-child { border-bottom: none; }
  .dep .badge { min-width: 46px; text-align: center; padding: 5px 6px; border-radius: 8px; color: #fff; font-weight: 800; font-size: .95rem; }
  .dep .to { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dep .meta { color: var(--muted); font-size: .78rem; }
  .dep .meta .late { color: var(--late); font-weight: 600; }
  .dep .when { text-align: right; font-variant-numeric: tabular-nums; }
  .dep .when b { font-size: 1.25rem; display: block; line-height: 1.1; }
  .dep .when .now { color: var(--ok); }
  .dep .when small { color: var(--muted); font-size: .75rem; }
  .empty, .error { color: var(--muted); text-align: center; padding: 18px 8px; font-size: .9rem; }
  .error { color: var(--late); }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer { color: var(--muted); font-size: .72rem; text-align: center; margin-top: 16px; }
  footer a { color: inherit; }
  [hidden] { display: none !important; }
  .tram { background: var(--tram); } .bus { background: var(--bus); } .train { background: var(--train); }
  .ship { background: var(--ship); } .other { background: var(--other); }
</style>
</head>
<body>
<main>
  <header>
    <h1 class="brand">swiss<span>Public</span>Transport</h1>
    <small>Prototype · Sprint 1</small>
  </header>

  <!-- Recherche d'arrêt -->
  <section class="card" aria-label="Recherche d'arrêt">
    <div class="search-row">
      <input id="q" type="search" placeholder="Arrêt : Bel-Air, Cornavin, Pâquis…" autocomplete="off" enterkeyhint="search">
      <button id="near" title="Arrêts autour de moi" aria-label="Arrêts autour de moi">📍</button>
    </div>
    <div class="opts">
      <label><input id="allCH" type="checkbox"> Inclure toute la Suisse</label>
      <span id="searchStatus"></span>
    </div>
    <ul id="results" class="results" hidden></ul>
  </section>

  <!-- Arrêts les plus consultés -->
  <section id="recentCard" class="card" hidden>
    <p class="section-title">Vos arrêts <button id="clearRecent" class="ghost">Effacer</button></p>
    <div id="recent" class="chips"></div>
  </section>

  <!-- Tableau des départs -->
  <section id="board" class="card" hidden>
    <div class="board-head">
      <div>
        <h2 id="stationName"></h2>
        <div id="boardStatus" class="status"></div>
      </div>
      <button id="refresh" title="Rafraîchir" aria-label="Rafraîchir">↻</button>
    </div>

    <div style="margin:14px 0 6px">
      <p class="section-title">Lignes
        <span class="filter-actions">
          <button id="allLines" class="ghost">Toutes</button>
          <button id="noLines" class="ghost">Aucune</button>
        </span>
      </p>
      <div id="lines" class="chips"></div>
    </div>

    <ul id="departures"></ul>
  </section>

  <footer>
    Données : <a href="https://transport.opendata.ch" target="_blank" rel="noopener">transport.opendata.ch</a>
    (horaires officiels suisses, temps réel quand disponible)
  </footer>
</main>

<script>
(() => {
  'use strict';

  // ---------- Configuration ----------
  const API = 'https://transport.opendata.ch/v1';
  // Zone approximative Unireso + Léman Pass / Léman Express (GE, district de Nyon, Ain, Haute-Savoie)
  const ZONE = { latMin: 45.85, latMax: 46.50, lonMin: 5.80, lonMax: 6.65 };
  const BOARD_LIMIT = 80;       // départs demandés à l'API (assez pour découvrir les lignes d'un gros arrêt)
  const SHOW_MAX = 25;          // départs affichés après filtrage
  const REFRESH_MS = 30000;     // rafraîchissement des données
  const TICK_MS = 15000;        // recalcul des comptes à rebours

  // Codes de catégorie renvoyés par l'API → mode de transport
  const CATS = {
    tram:  ['T', 'TRAM', 'NFT', 'STR'],
    bus:   ['B', 'BUS', 'NFB', 'BN', 'EV', 'KB', 'EXB', 'BP', 'TX', 'NB', 'RUB', 'CAR'],
    ship:  ['BAT', 'BAV', 'FAE', 'SCH', 'SHIP'],
    train: ['S', 'SN', 'SL', 'L', 'R', 'RE', 'IR', 'IRE', 'IC', 'ICE', 'ICN', 'EC', 'EN', 'NJ', 'TGV',
            'TER', 'RJ', 'RJX', 'PE', 'EXT', 'RB', 'IN', 'TRN']
  };
  const MODE_LABEL = { tram: 'Tram', bus: 'Bus', ship: 'Bateau', train: 'Train', other: 'Autre' };
  const MODE_ICON = { tram: '🚋', bus: '🚌', ship: '⛴️', train: '🚆', other: '•' };
  const MODE_ORDER = { train: 0, tram: 1, bus: 2, ship: 3, other: 4 };

  // ---------- Stockage local (préférences de l'utilisateur, sur cet appareil) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('tpp:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('tpp:' + k, JSON.stringify(v)); } catch { /* stockage indisponible */ } }
  };

  // ---------- Utilitaires ----------
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const enc = encodeURIComponent;

  async function getJSON(url, signal) {
    const r = await fetch(url, { signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  // "2026-11-09T23:41:00+0100" → Date (le format +0100 sans ":" n'est pas lu partout, ex. Safari)
  function parseTime(s) {
    if (!s) return null;
    const d = new Date(String(s).replace(/([+-]\d{2})(\d{2})$/, '$1:$2'));
    return isNaN(d) ? null : d;
  }
  const hhmm = (d) => d.toLocaleTimeString('fr-CH', { hour: '2-digit', minute: '2-digit' });

  function inZone(loc) {
    const c = loc.coordinate;
    if (!c || c.x == null || c.y == null) return false;
    return c.x >= ZONE.latMin && c.x <= ZONE.latMax && c.y >= ZONE.lonMin && c.y <= ZONE.lonMax;
  }

  function modeOfCategory(cat) {
    const c = String(cat || '').toUpperCase().trim();
    for (const m of ['tram', 'bus', 'ship', 'train']) if (CATS[m].includes(c)) return m;
    return 'other';
  }
  function modeOfIcon(icon) {
    return ({ tram: 'tram', bus: 'bus', train: 'train', ship: 'ship', boat: 'ship' })[icon] || 'other';
  }

  // Libellé de ligne lisible : "12" pour un tram, "L2" pour le Léman Express, "IR 90" pour un train
  function lineLabel(j, mode) {
    const n = String(j.number || '').trim();
    const c = String(j.category || '').trim();
    if (mode === 'tram' || mode === 'bus' || mode === 'ship') return n || c || '?';
    if (/^[A-Za-z]/.test(n)) return n;            // ex. L1…L6, S1
    if (n && n.length <= 3) return (c + ' ' + n).trim();  // ex. IR 90, RE 33
    return c || n || '?';                        // n long = numéro de course : on garde la catégorie
  }

  // ---------- État ----------
  let current = null;        // { id, name }
  let departures = [];       // départs normalisés du dernier chargement
  let lastLoad = null;
  let refreshTimer = null, tickTimer = null;
  let searchCtrl = null, boardCtrl = null;

  // ---------- Arrêts fréquents (adaptation à l'utilisateur) ----------
  function getStops() { return store.get('stops', {}); }
  function recordVisit(st) {
    const stops = getStops();
    const s = stops[st.id] || { id: st.id, name: st.name, mode: st.mode || 'other', count: 0 };
    s.name = st.name; if (st.mode && st.mode !== 'other') s.mode = st.mode;
    s.count += 1; s.last = Date.now();
    stops[st.id] = s;
    store.set('stops', stops);
    store.set('lastStop', st.id);
  }
  function renderRecent() {
    const list = Object.values(getStops())
      .sort((a, b) => b.count - a.count || b.last - a.last)
      .slice(0, 8);
    $('recentCard').hidden = list.length === 0;
    $('recent').innerHTML = list.map(s =>
      `<button class="stop-chip" data-id="${esc(s.id)}" data-name="${esc(s.name)}" data-mode="${esc(s.mode)}">` +
      `${esc(s.name)}<span class="n">${s.count}×</span></button>`).join('');
  }

  // ---------- Recherche ----------
  function renderResults(stations, note) {
    const ul = $('results');
    if (!stations.length) {
      ul.hidden = false;
      ul.innerHTML = `<li class="empty">${esc(note || 'Aucun arrêt trouvé dans la zone.')}</li>`;
      return;
    }
    ul.hidden = false;
    ul.innerHTML = stations.slice(0, 10).map(s => {
      const m = modeOfIcon(s.icon);
      const dist = s.distance != null ? `<span class="dist">${Math.round(s.distance)} m</span>` : '';
      return `<li><button data-id="${esc(s.id)}" data-name="${esc(s.name)}" data-mode="${m}">` +
             `<span class="ico ${m}">${MODE_ICON[m]}</span><span>${esc(s.name)}</span>${dist}</button></li>`;
    }).join('');
  }

  function uniqueById(arr) {
    const seen = new Set();
    return arr.filter(s => s.id && !seen.has(s.id) && seen.add(s.id));
  }

  async function search(q) {
    if (searchCtrl) searchCtrl.abort();
    searchCtrl = new AbortController();
    const signal = searchCtrl.signal;
    const allCH = $('allCH').checked;
    $('searchStatus').innerHTML = '<span class="spinner"></span>';
    try {
      const r1 = await getJSON(`${API}/locations?type=station&query=${enc(q)}`, signal);
      let stations = uniqueById(r1.stations || []);
      let inside = stations.filter(inZone);
      // Les noms courts ("Bel-Air", "Gare") renvoient souvent d'abord d'autres villes : on relance en ciblant Genève
      if (!allCH && inside.length < 3 && !/gen[eè]v/i.test(q)) {
        const r2 = await getJSON(`${API}/locations?type=station&query=${enc('Genève ' + q)}`, signal);
        stations = uniqueById([...stations, ...(r2.stations || [])]);
        inside = stations.filter(inZone);
      }
      renderResults(allCH ? stations : inside,
        allCH ? 'Aucun arrêt trouvé.' : 'Aucun arrêt trouvé dans la zone Unireso. Cochez « toute la Suisse » pour élargir.');
      $('searchStatus').textContent = '';
    } catch (e) {
      if (e.name === 'AbortError') return;
      $('searchStatus').textContent = '';
      renderResults([], 'Recherche impossible (réseau ?).');
    }
  }

  function nearMe() {
    if (!navigator.geolocation) { renderResults([], 'Géolocalisation non disponible.'); return; }
    $('searchStatus').innerHTML = '<span class="spinner"></span> localisation…';
    navigator.geolocation.getCurrentPosition(async pos => {
      try {
        const { latitude: x, longitude: y } = pos.coords;
        const r = await getJSON(`${API}/locations?x=${x}&y=${y}`);
        const st = uniqueById((r.stations || []).filter(s => s.id)).sort((a, b) => (a.distance ?? 1e9) - (b.distance ?? 1e9));
        $('searchStatus').textContent = '';
        renderResults(st, 'Aucun arrêt à proximité.');
      } catch {
        $('searchStatus').textContent = '';
        renderResults([], 'Impossible de charger les arrêts proches.');
      }
    }, () => {
      $('searchStatus').textContent = '';
      renderResults([], 'Position refusée ou indisponible.');
    }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  }

  // ---------- Tableau des départs ----------
  function normalize(j) {
    const stop = j.stop || {};
    const sched = stop.departureTimestamp ? new Date(stop.departureTimestamp * 1000) : parseTime(stop.departure);
    const real = parseTime(stop.prognosis && stop.prognosis.departure) || sched;
    let delay = stop.delay != null ? Number(stop.delay) : null;
    if ((delay == null || isNaN(delay)) && sched && real) delay = Math.round((real - sched) / 60000);
    const mode = modeOfCategory(j.category);
    const label = lineLabel(j, mode);
    return {
      key: mode + '|' + label, label, mode,
      to: j.to || '', sched, real, delay: delay || 0,
      platform: (stop.prognosis && stop.prognosis.platform) || stop.platform || '',
      operator: j.operator || ''
    };
  }

  function hiddenSet() { return new Set(store.get('hidden:' + current.id, [])); }
  function saveHidden(set) { store.set('hidden:' + current.id, [...set]); }

  function compareLines(a, b) {
    return (MODE_ORDER[a.mode] - MODE_ORDER[b.mode]) ||
      a.label.localeCompare(b.label, 'fr', { numeric: true, sensitivity: 'base' });
  }

  function renderLines() {
    const byKey = new Map();
    departures.forEach(d => { if (!byKey.has(d.key)) byKey.set(d.key, d); });
    const lines = [...byKey.values()].sort(compareLines);
    const hidden = hiddenSet();
    $('lines').innerHTML = lines.length ? lines.map(l =>
      `<button class="line-chip ${l.mode}" data-key="${esc(l.key)}" aria-pressed="${!hidden.has(l.key)}" ` +
      `title="${esc(MODE_LABEL[l.mode] + ' ' + l.label)}"><span class="m">${MODE_ICON[l.mode]}</span>${esc(l.label)}</button>`
    ).join('') : '<span class="status">Aucune ligne dans les prochains départs.</span>';
  }

  function whenHtml(d, now) {
    const t = d.real || d.sched;
    if (!t) return '<b>–</b>';
    const min = Math.floor((t - now) / 60000);
    if (min <= 0) return `<b class="now">0′</b><small>${hhmm(t)}</small>`;
    if (min < 60) return `<b>${min}′</b><small>${hhmm(t)}</small>`;
    return `<b>${hhmm(t)}</b><small>&nbsp;</small>`;
  }

  function renderDepartures() {
    const now = Date.now();
    const hidden = hiddenSet();
    const list = departures
      .filter(d => !hidden.has(d.key))
      .filter(d => (d.real || d.sched) && (d.real || d.sched) - now > -60000) // on retire les bus déjà partis
      .slice(0, SHOW_MAX);
    const ul = $('departures');
    if (!departures.length) { ul.innerHTML = '<li class="empty">Aucun départ prévu prochainement.</li>'; return; }
    if (!list.length) { ul.innerHTML = '<li class="empty">Aucune ligne sélectionnée dans les prochains départs.</li>'; return; }
    ul.innerHTML = list.map(d => {
      const plat = d.platform ? `${d.mode === 'train' ? 'Voie' : 'Quai'} ${esc(d.platform)}` : '';
      const late = d.delay > 0 ? `<span class="late">+${d.delay} min</span>` : '';
      const meta = [plat, late].filter(Boolean).join(' · ');
      return `<li class="dep"><span class="badge ${d.mode}">${esc(d.label)}</span>` +
        `<div style="min-width:0"><div class="to">${esc(d.to)}</div><div class="meta">${meta || MODE_LABEL[d.mode]}</div></div>` +
        `<div class="when">${whenHtml(d, now)}</div></li>`;
    }).join('');
  }

  function renderStatus(text) {
    if (text) { $('boardStatus').innerHTML = text; return; }
    if (!lastLoad) return;
    const s = Math.round((Date.now() - lastLoad) / 1000);
    $('boardStatus').textContent = s < 10 ? 'à l\'instant' : `mis à jour il y a ${s < 60 ? s + ' s' : Math.round(s / 60) + ' min'}`;
  }

  async function loadBoard() {
    if (!current) return;
    if (boardCtrl) boardCtrl.abort();
    boardCtrl = new AbortController();
    renderStatus('<span class="spinner"></span> chargement…');
    try {
      const r = await getJSON(`${API}/stationboard?id=${enc(current.id)}&limit=${BOARD_LIMIT}`, boardCtrl.signal);
      departures = (r.stationboard || []).map(normalize)
        .sort((a, b) => (a.real || a.sched) - (b.real || b.sched));
      if (r.station && r.station.name) $('stationName').textContent = r.station.name;
      lastLoad = Date.now();
      renderLines(); renderDepartures(); renderStatus();
    } catch (e) {
      if (e.name === 'AbortError') return;
      renderStatus('');
      $('departures').innerHTML = '<li class="error">Impossible de charger les départs. <button id="retry">Réessayer</button></li>';
      $('retry').onclick = loadBoard;
    }
  }

  function openStop(st) {
    current = { id: st.id, name: st.name };
    recordVisit(st);
    renderRecent();
    $('results').hidden = true;
    $('q').value = '';
    $('q').blur();
    $('board').hidden = false;
    $('stationName').textContent = st.name;
    $('lines').innerHTML = '';
    $('departures').innerHTML = '';
    departures = []; lastLoad = null;
    loadBoard();
    clearInterval(refreshTimer); clearInterval(tickTimer);
    refreshTimer = setInterval(() => { if (document.visibilityState === 'visible') loadBoard(); }, REFRESH_MS);
    tickTimer = setInterval(() => { renderDepartures(); renderStatus(); }, TICK_MS);
    $('board').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ---------- Événements ----------
  let debounce;
  $('q').addEventListener('input', e => {
    clearTimeout(debounce);
    const q = e.target.value.trim();
    if (q.length < 2) { $('results').hidden = true; if (searchCtrl) searchCtrl.abort(); $('searchStatus').textContent = ''; return; }
    debounce = setTimeout(() => search(q), 300);
  });
  $('q').addEventListener('keydown', e => {
    if (e.key === 'Enter') { const first = $('results').querySelector('button[data-id]'); if (first) first.click(); }
  });
  $('allCH').addEventListener('change', () => { const q = $('q').value.trim(); if (q.length >= 2) search(q); });
  $('near').addEventListener('click', nearMe);

  const pick = (e) => {
    const b = e.target.closest('button[data-id]');
    if (b) openStop({ id: b.dataset.id, name: b.dataset.name, mode: b.dataset.mode });
  };
  $('results').addEventListener('click', pick);
  $('recent').addEventListener('click', pick);
  $('clearRecent').addEventListener('click', () => { store.set('stops', {}); renderRecent(); });

  $('lines').addEventListener('click', e => {
    const b = e.target.closest('.line-chip');
    if (!b) return;
    const set = hiddenSet();
    set.has(b.dataset.key) ? set.delete(b.dataset.key) : set.add(b.dataset.key);
    saveHidden(set);
    renderLines(); renderDepartures();
  });
  $('allLines').addEventListener('click', () => { saveHidden(new Set()); renderLines(); renderDepartures(); });
  $('noLines').addEventListener('click', () => {
    saveHidden(new Set(departures.map(d => d.key))); renderLines(); renderDepartures();
  });
  $('refresh').addEventListener('click', loadBoard);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && current && lastLoad && Date.now() - lastLoad > REFRESH_MS) loadBoard();
  });

  // ---------- Démarrage : accès direct au dernier arrêt consulté ----------
  renderRecent();
  const lastId = store.get('lastStop', null);
  const last = lastId && getStops()[lastId];
  if (last) {
    // on rouvre sans incrémenter le compteur de consultation
    current = { id: last.id, name: last.name };
    $('board').hidden = false;
    $('stationName').textContent = last.name;
    loadBoard();
    refreshTimer = setInterval(() => { if (document.visibilityState === 'visible') loadBoard(); }, REFRESH_MS);
    tickTimer = setInterval(() => { renderDepartures(); renderStatus(); }, TICK_MS);
  }
})();
</script>
</body>
</html>
