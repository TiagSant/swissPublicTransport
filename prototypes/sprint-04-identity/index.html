<!DOCTYPE html>
<!--
  swissPublicTransport — Sprint 4 prototype: visual identity and languages
  - US-10: English UI by default, French when the phone's language is French (EN/FR switch in the header).
  - US-11: official Swiss public transport pictograms (modes) and SBB timetable icons (train products),
           used unmodified from SBB's design-system repositories — see assets/sbb/NOTICE.md.
  - US-12: each line in its operator's colour (TPG, Léman Express, Mouettes) — see assets/line-colors.js.
  Everything from Sprints 1-3 is kept: stop search in the Unireso area, real-time departures, line and
  direction filters, frequent stops, and the usage-based preselection of usual lines (US-06).
  Data: https://transport.opendata.ch (no key, CORS enabled).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>swissPublicTransport — Sprint 4 prototype</title>
<script src="../../assets/line-colors.js"></script>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --text: #111827; --muted: #6b7280; --line: #e5e7eb;
    --accent: #c8102e; --late: #d9480f; --ok: #2b8a3e; --badge-ring: transparent;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1220; --card: #141c2e; --text: #e8ecf3; --muted: #94a0b4; --line: #26314a;
            --late: #ff922b; --ok: #69db7c; --badge-ring: rgba(255,255,255,.28); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 12px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 2px 12px; }
  header h1 { font-size: 1.15rem; margin: 0; letter-spacing: -.01em; }
  header h1 span { color: var(--accent); }
  header .right { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: .75rem; }
  .lang { border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; font-size: .75rem; font-weight: 700; color: var(--muted); background: none; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; }
  .search-row { display: flex; gap: 8px; }
  input[type=search] { flex: 1; min-width: 0; font-size: 1rem; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--bg); color: var(--text);
    border-radius: 10px; padding: 10px 12px; }
  button:active { transform: scale(.98); }
  .ghost { border: none; background: none; color: var(--muted); padding: 6px 8px; font-size: .85rem; }
  .opts { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; color: var(--muted); font-size: .8rem; }
  .opts label { display: flex; gap: 6px; align-items: center; }
  ul { list-style: none; margin: 0; padding: 0; }
  .results li button { width: 100%; text-align: left; display: flex; gap: 10px; align-items: center;
    border: none; border-bottom: 1px solid var(--line); border-radius: 0; background: none; padding: 11px 4px; }
  .results li:last-child button { border-bottom: none; }
  .results .dist { margin-left: auto; color: var(--muted); font-size: .8rem; }
  .section-title { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .stop-chip { border-radius: 999px; padding: 7px 12px; font-size: .9rem; background: var(--bg); }
  .stop-chip .n { color: var(--muted); font-size: .75rem; margin-left: 4px; }
  .board-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .board-head h2 { margin: 0; font-size: 1.2rem; }
  .status { color: var(--muted); font-size: .78rem; margin-top: 2px; }

  /* Mode pictograms (SBB pictogram library, unmodified) */
  .picto { width: 22px; height: 22px; flex: none; display: block; }
  .picto.sm { width: 18px; height: 18px; }
  .picto-none { width: 22px; height: 22px; flex: none; border-radius: 4px; border: 1.5px dashed var(--line); }

  /* Line badges: operator colours, SBB timetable icons, or a neutral fallback */
  .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 38px; height: 24px; padding: 0 8px;
    font-weight: 800; font-size: .9rem; line-height: 1; white-space: nowrap; box-shadow: 0 0 0 1px var(--badge-ring); }
  .badge.pill { border-radius: 999px; }
  .badge.hexagon { border-radius: 0; box-shadow: none; padding: 0 12px;
    clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 8px 100%, 0 50%); }
  .badge.neutral { border-radius: 4px; background: var(--card); color: var(--text); border: 1.5px solid currentColor; box-shadow: none; }
  .tt { display: inline-flex; height: 24px; }
  .tt img { height: 24px; width: auto; display: block; }
  .line-id { display: inline-flex; align-items: center; gap: 6px; }

  .line-chip { padding: 5px 8px; border-radius: 10px; display: inline-flex; gap: 6px; align-items: center; background: var(--bg);
    border: 1px solid var(--line); color: var(--text); }
  .line-chip[aria-pressed="false"] { opacity: .45; filter: grayscale(1); }
  .line-chip[aria-pressed="false"] .badge, .line-chip[aria-pressed="false"] .tt { text-decoration: line-through; }
  .line-chip[aria-pressed="mixed"] { border-style: dashed; }
  .line-chip .cnt { font-size: .68rem; font-weight: 700; color: var(--muted); }
  .line-chip .fav { font-size: .75rem; color: var(--accent); }

  .dir-toggle { padding-left: 0; margin-top: 6px; }
  .auto-info { font-size: .8rem; color: var(--muted); background: var(--bg); border-radius: 10px; padding: 6px 4px 6px 10px;
    margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .auto-info button { padding: 4px 8px; font-size: .8rem; color: var(--accent); font-weight: 600; }
  #dirs { border-top: 1px solid var(--line); margin-top: 4px; }
  .dir-group { display: grid; grid-template-columns: 84px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .dir { width: 100%; display: flex; gap: 10px; align-items: center; text-align: left; border: none; background: none; padding: 6px 2px; border-radius: 8px; }
  .dir .box { width: 22px; height: 22px; flex: none; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; font-size: .8rem; color: #fff; }
  .dir[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
  .dir[aria-pressed="true"] .box::after { content: "✓"; }
  .dir[aria-pressed="false"] .lbl b { color: var(--muted); text-decoration: line-through; font-weight: 500; }
  .dir .lbl { min-width: 0; }
  .dir .lbl b { display: block; font-weight: 600; }
  .dir .lbl small { color: var(--muted); font-size: .75rem; }
  .filter-actions { display: flex; gap: 4px; }

  .dep { display: grid; grid-template-columns: 108px 1fr auto; gap: 10px; align-items: center; padding: 10px 2px;
    border-bottom: 1px solid var(--line); cursor: pointer; }
  .dep:last-child { border-bottom: none; }
  .dep .to { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dep .meta { color: var(--muted); font-size: .78rem; }
  .dep .meta .late { color: var(--late); font-weight: 600; }
  .dep .when { text-align: right; font-variant-numeric: tabular-nums; }
  .dep .when b { font-size: 1.25rem; display: block; line-height: 1.1; }
  .dep .when .now { color: var(--ok); }
  .dep .when small { color: var(--muted); font-size: .75rem; }
  .dep .stops { grid-column: 1 / -1; margin: 2px 0 0 118px; padding: 0; font-size: .8rem; color: var(--muted); }
  .dep .stops li { display: flex; justify-content: space-between; padding: 2px 0 2px 10px; border-left: 2px solid var(--line); }
  .dep .stops li span:last-child { font-variant-numeric: tabular-nums; }

  .empty, .error { color: var(--muted); text-align: center; padding: 18px 8px; font-size: .9rem; }
  .error { color: var(--late); }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer { color: var(--muted); font-size: .72rem; text-align: center; margin-top: 16px; }
  footer a { color: inherit; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1 class="brand">swiss<span>Public</span>Transport</h1>
    <div class="right">
      <span data-i18n="prototype"></span>
      <button id="lang" class="lang" type="button"></button>
    </div>
  </header>

  <!-- Stop search -->
  <section class="card" data-i18n-aria="searchSection">
    <div class="search-row">
      <input id="q" type="search" data-i18n-placeholder="searchPlaceholder" autocomplete="off" enterkeyhint="search">
      <button id="near" data-i18n-title="nearMe" data-i18n-aria="nearMe">📍</button>
    </div>
    <div class="opts">
      <label><input id="allCH" type="checkbox"> <span data-i18n="allSwitzerland"></span></label>
      <span id="searchStatus"></span>
    </div>
    <ul id="results" class="results" hidden></ul>
  </section>

  <!-- Most visited stops -->
  <section id="recentCard" class="card" hidden>
    <p class="section-title"><span data-i18n="yourStops"></span> <button id="clearRecent" class="ghost" data-i18n="clear"></button></p>
    <div id="recent" class="chips"></div>
  </section>

  <!-- Departure board -->
  <section id="board" class="card" hidden>
    <div class="board-head">
      <div>
        <h2 id="stationName"></h2>
        <div id="boardStatus" class="status"></div>
      </div>
      <button id="refresh" data-i18n-title="refresh" data-i18n-aria="refresh">↻</button>
    </div>

    <div style="margin:14px 0 6px">
      <p class="section-title"><span data-i18n="lines"></span>
        <span class="filter-actions">
          <button id="allLines" class="ghost" data-i18n="all"></button>
          <button id="noLines" class="ghost" data-i18n="none"></button>
        </span>
      </p>
      <div id="autoInfo" class="auto-info" hidden></div>
      <div id="lines" class="chips"></div>
      <button id="dirToggle" class="ghost dir-toggle" aria-expanded="false"></button>
      <div id="dirs" hidden></div>
    </div>

    <ul id="departures"></ul>
  </section>

  <footer>
    <span data-i18n="dataSource"></span>
    <a href="https://transport.opendata.ch" target="_blank" rel="noopener">transport.opendata.ch</a>
    · <span data-i18n="credits"></span>
  </footer>
</main>

<script>
(() => {
  'use strict';

  // ---------- Configuration ----------
  const API = 'https://transport.opendata.ch/v1';
  const ASSETS = '../../assets';
  // Approximate Unireso + Léman Pass / Léman Express area (Geneva, Nyon district, Ain, Haute-Savoie)
  const ZONE = { latMin: 45.85, latMax: 46.50, lonMin: 5.80, lonMax: 6.65 };
  // The API only returns journeys whose *scheduled* time is at or after `datetime`. A bus scheduled at 17:10
  // running +8 min would vanish at 17:11, so we ask from LOOKBACK_MIN minutes ago and filter on the real time.
  const LOOKBACK_MIN = 30;
  const BOARD_LIMIT = 150;      // departures requested: the look-back window plus enough upcoming ones for a busy stop
  const GONE_MS = 60000;        // a departure is dropped one minute after it has left
  const SHOW_MAX = 25;          // departures shown after filtering
  const REFRESH_MS = 30000;     // data refresh
  const TICK_MS = 15000;        // countdown refresh

  // ---------- Strings (US-10) ----------
  // English is the default; French is used when the phone's language is French, or when chosen in the header.
  // The switch label names the target language in that language (standard practice), hence French in the EN block.
  const STRINGS = {
    en: {
      title: 'Departures', prototype: 'Prototype · Sprint 4', switchTo: 'FR', switchToLabel: 'Afficher en français',
      searchSection: 'Stop search', searchPlaceholder: 'Stop: Bel-Air, Cornavin, Pâquis…', nearMe: 'Stops near me',
      allSwitzerland: 'Include all of Switzerland', yourStops: 'Your stops', clear: 'Clear', refresh: 'Refresh',
      lines: 'Lines', all: 'All', none: 'None', chooseDirections: 'Choose directions ▾', hideDirections: 'Hide directions ▴',
      dataSource: 'Data:', credits: 'Pictograms © SBB CFF FFS · Line colours from the operators',
      noStopInZone: 'No stop found in the Unireso area. Tick "Include all of Switzerland" to widen the search.',
      noStop: 'No stop found.', searchFailed: 'Search failed (network?).', geoUnavailable: 'Geolocation not available.',
      locating: 'locating…', noNearby: 'No stop nearby.', nearbyFailed: 'Could not load nearby stops.',
      geoDenied: 'Location denied or unavailable.', nextStop: 'next stop: {name}',
      manual: 'Manual selection', backToHabits: 'Back to my habits', allLinesShown: 'All lines', myLines: '★ My lines',
      usualLines: '★ Your usual lines at this stop', seeAll: 'See all',
      noLinesInBoard: 'No lines in the upcoming departures.', noDepartures: 'No departures coming up.',
      noUsualDepartures: 'No upcoming departures on your usual lines.', noSelectedDepartures: 'No selected line in the upcoming departures.',
      platform: 'Platform {p}', track: 'Track {p}', nextStopsUnavailable: 'Next stops not available',
      justNow: 'just now', updatedAgo: 'updated {n} ago', loading: 'loading…',
      loadFailed: 'Could not load departures.', retry: 'Retry',
      mode: { tram: 'Tram', bus: 'Bus', train: 'Train', ship: 'Boat', funicular: 'Funicular', cableway: 'Cable car', other: 'Other' }
    },
    fr: {
      title: 'Départs', prototype: 'Prototype · Sprint 4', switchTo: 'EN', switchToLabel: 'Show in English',
      searchSection: 'Recherche d’arrêt', searchPlaceholder: 'Arrêt : Bel-Air, Cornavin, Pâquis…', nearMe: 'Arrêts autour de moi',
      allSwitzerland: 'Inclure toute la Suisse', yourStops: 'Vos arrêts', clear: 'Effacer', refresh: 'Rafraîchir',
      lines: 'Lignes', all: 'Toutes', none: 'Aucune', chooseDirections: 'Choisir les directions ▾', hideDirections: 'Masquer les directions ▴',
      dataSource: 'Données :', credits: 'Pictogrammes © SBB CFF FFS · Couleurs des lignes : exploitants',
      noStopInZone: 'Aucun arrêt trouvé dans la zone Unireso. Cochez « Inclure toute la Suisse » pour élargir.',
      noStop: 'Aucun arrêt trouvé.', searchFailed: 'Recherche impossible (réseau ?).', geoUnavailable: 'Géolocalisation non disponible.',
      locating: 'localisation…', noNearby: 'Aucun arrêt à proximité.', nearbyFailed: 'Impossible de charger les arrêts proches.',
      geoDenied: 'Position refusée ou indisponible.', nextStop: 'prochain arrêt : {name}',
      manual: 'Sélection manuelle', backToHabits: 'Revenir à mes habitudes', allLinesShown: 'Toutes les lignes', myLines: '★ Mes lignes',
      usualLines: '★ Vos lignes habituelles à cet arrêt', seeAll: 'Tout voir',
      noLinesInBoard: 'Aucune ligne dans les prochains départs.', noDepartures: 'Aucun départ prévu prochainement.',
      noUsualDepartures: 'Aucun départ de vos lignes habituelles prochainement.', noSelectedDepartures: 'Aucune ligne sélectionnée dans les prochains départs.',
      platform: 'Quai {p}', track: 'Voie {p}', nextStopsUnavailable: 'Prochains arrêts non disponibles',
      justNow: 'à l’instant', updatedAgo: 'mis à jour il y a {n}', loading: 'chargement…',
      loadFailed: 'Impossible de charger les départs.', retry: 'Réessayer',
      mode: { tram: 'Tram', bus: 'Bus', train: 'Train', ship: 'Bateau', funicular: 'Funiculaire', cableway: 'Téléphérique', other: 'Autre' }
    }
  };
  const LOCALE = { en: 'en-GB', fr: 'fr-CH' };   // en-GB keeps the 24-hour clock

  // ---------- Local storage (user preferences, on this device) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('tpp:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('tpp:' + k, JSON.stringify(v)); } catch { /* storage unavailable */ } }
  };

  function detectLang() {
    const saved = store.get('lang', null);
    if (saved && STRINGS[saved]) return saved;
    const prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
    return prefs.some(l => /^fr\b/i.test(l)) ? 'fr' : 'en';
  }
  let lang = detectLang();
  function t(key, vars) {
    let s = STRINGS[lang][key] ?? STRINGS.en[key] ?? key;
    if (vars) for (const [k, v] of Object.entries(vars)) s = s.replace('{' + k + '}', v);
    return s;
  }
  const modeName = m => STRINGS[lang].mode[m] || STRINGS[lang].mode.other;

  // ---------- Helpers ----------
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const enc = encodeURIComponent;

  async function getJSON(url, signal) {
    const r = await fetch(url, { signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  // "2026-11-09T23:41:00+0100" → Date (the +0100 offset without a colon is not parsed everywhere, e.g. Safari)
  function parseTime(s) {
    if (!s) return null;
    const d = new Date(String(s).replace(/([+-]\d{2})(\d{2})$/, '$1:$2'));
    return isNaN(d) ? null : d;
  }
  const hhmm = (d) => d.toLocaleTimeString(LOCALE[lang], { hour: '2-digit', minute: '2-digit', hour12: false });
  // API `datetime` parameter: Swiss local time "YYYY-MM-DD HH:mm" (the sv-SE locale formats exactly like that)
  const apiDateTime = (d) => new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Zurich', year: 'numeric', month: '2-digit',
    day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).format(d);

  function inZone(loc) {
    const c = loc.coordinate;
    if (!c || c.x == null || c.y == null) return false;
    return c.x >= ZONE.latMin && c.x <= ZONE.latMax && c.y >= ZONE.lonMin && c.y <= ZONE.lonMax;
  }

  // ---------- Modes and pictograms (US-11) ----------
  // API category codes → transport mode (validated against real data, see docs/real-data-validation.md)
  const CATS = {
    tram:      ['T', 'TRAM', 'NFT', 'STR'],
    bus:       ['B', 'BUS', 'NFB', 'BN', 'EV', 'KB', 'EXB', 'BP', 'TX', 'NB', 'RUB', 'CAR'],
    ship:      ['BAT', 'BAV', 'FAE', 'SCH', 'SHIP'],
    funicular: ['FUN'],
    cableway:  ['PB', 'GB'],
    train:     ['S', 'SN', 'SL', 'L', 'R', 'RE', 'IR', 'IRE', 'IC', 'ICE', 'ICN', 'EC', 'EN', 'NJ', 'TGV',
                'TER', 'RJ', 'RJX', 'PE', 'EXT', 'RB', 'IN', 'TRN']
  };
  const MODE_ORDER = { train: 0, tram: 1, bus: 2, ship: 3, funicular: 4, cableway: 5, other: 6 };
  // Swiss public transport pictograms (SBB pictogram library, pictos/svg-digital), used unmodified
  const PICTOGRAMS = { tram: 'Tram_r', bus: 'Bus_r', train: 'Zug_r', ship: 'Schiff_r',
                       funicular: 'Standseilbahn_r', cableway: 'Luftseilbahn_r' };
  // SBB timetable icons available in assets/sbb/timetable (each with a -negative variant for dark mode)
  const SBB_TIMETABLE_ICONS = new Set(['ic-1', 'ic-5', 'ir-15', 'ir-57', 'ir-90', 'ir-95', 're-33', 'r-55', 'ter', 'tgv']);

  function pictoHtml(mode, small) {
    const p = PICTOGRAMS[mode];
    return p ? `<img class="picto${small ? ' sm' : ''}" src="${ASSETS}/sbb/pictograms/${p}.svg" alt="${esc(modeName(mode))}">`
             : `<span class="picto-none" aria-hidden="true"></span>`;
  }

  function modeOfCategory(cat) {
    const c = String(cat || '').toUpperCase().trim();
    for (const m of ['tram', 'bus', 'ship', 'funicular', 'cableway', 'train']) if (CATS[m].includes(c)) return m;
    return 'other';
  }
  function modeOfIcon(icon, name) {
    const m = ({ tram: 'tram', bus: 'bus', train: 'train', ship: 'ship', boat: 'ship', funicular: 'funicular', cableway: 'cableway' })[icon];
    if (m) return m;
    // Real data: some piers come without an icon (e.g. "Genève-Jardin-Anglais (lac)")
    return /\(lac\)/i.test(name || '') ? 'ship' : 'other';
  }

  // Readable line label: "12" for a tram, "L2" for the Léman Express, "IR 90" for a train
  function lineLabel(j, mode) {
    const n = String(j.number || '').trim();
    const c = String(j.category || '').trim();
    if (mode !== 'train') return n || c || '?';
    if (/^[A-Za-z]/.test(n)) return n;                     // e.g. L1…L6, S1
    if (n && n.length <= 3) return (c + ' ' + n).trim();   // e.g. IR 90, RE 33
    return c || n || '?';                                  // a long number is a run number: keep the category
  }

  // ---------- Line colours (US-12) ----------
  // Priority: Léman Express colour (whatever the operator: SBB "R L2" and SNCF "TER L2" are the same line)
  // → SBB timetable icon (other trains) → operator colour (TPG, Mouettes) → neutral badge
  function lineStyle(j, mode, label) {
    const nets = (window.LINE_COLORS && window.LINE_COLORS.networks) || {};
    const isLex = mode === 'train' && /^L\d+$/.test(label);
    if (isLex) {
      const c = nets.LEX && nets.LEX[label];
      return c ? { bg: c[0], fg: c[1], shape: c[2] } : { neutral: true };
    }
    const cat = String(j.category || '').toLowerCase().trim();
    const num = String(j.number || '').trim();
    if (mode === 'train') {
      const icon = /^\d{1,3}$/.test(num) ? `${cat}-${num}` : cat;
      if (SBB_TIMETABLE_ICONS.has(icon)) return { icon };
    }
    const op = String(j.operator || '');
    let c = null;
    if (/^tpg$/i.test(op)) c = nets.TPG && nets.TPG[label];
    else if (mode === 'ship' && (/^mgsa$|mouettes/i.test(op) || /^M\d$/.test(label))) c = nets.MGN && nets.MGN[label];
    return c ? { bg: c[0], fg: c[1], shape: c[2] } : { neutral: true };
  }

  function badgeHtml(style, label) {
    if (style.icon) {
      const base = `${ASSETS}/sbb/timetable/${style.icon}`;
      return `<picture class="tt"><source srcset="${base}-negative.svg" media="(prefers-color-scheme: dark)">` +
             `<img src="${base}.svg" alt="${esc(label)}"></picture>`;
    }
    if (style.neutral) return `<span class="badge neutral">${esc(label)}</span>`;
    return `<span class="badge ${style.shape}" style="background:${style.bg};color:${style.fg}">${esc(label)}</span>`;
  }
  const lineIdHtml = (mode, style, label, small) => `<span class="line-id">${pictoHtml(mode, small)}${badgeHtml(style, label)}</span>`;

  // ---------- State ----------
  let current = null;        // { id, name }
  let departures = [];       // normalised departures from the last load
  let lastLoad = null;
  let refreshTimer = null, tickTimer = null;
  let searchCtrl = null, boardCtrl = null;
  let lastResults = null;    // { stations, noteKey } so a language switch can re-render them

  // ---------- Frequent stops (adapting to the user) ----------
  function getStops() { return store.get('stops', {}); }
  function recordVisit(st) {
    const stops = getStops();
    const s = stops[st.id] || { id: st.id, name: st.name, mode: st.mode || 'other', count: 0 };
    s.name = st.name; if (st.mode && st.mode !== 'other') s.mode = st.mode;
    s.count += 1; s.last = Date.now();
    stops[st.id] = s;
    store.set('stops', stops);
    store.set('lastStop', st.id);
  }
  function renderRecent() {
    const list = Object.values(getStops())
      .sort((a, b) => b.count - a.count || b.last - a.last)
      .slice(0, 8);
    $('recentCard').hidden = list.length === 0;
    $('recent').innerHTML = list.map(s =>
      `<button class="stop-chip" data-id="${esc(s.id)}" data-name="${esc(s.name)}" data-mode="${esc(s.mode)}">` +
      `${esc(s.name)}<span class="n">${s.count}×</span></button>`).join('');
  }

  // ---------- Search ----------
  function renderResults(stations, noteKey) {
    lastResults = { stations, noteKey };
    const ul = $('results');
    ul.hidden = false;
    if (!stations.length) { ul.innerHTML = `<li class="empty">${esc(t(noteKey || 'noStopInZone'))}</li>`; return; }
    ul.innerHTML = stations.slice(0, 10).map(s => {
      const m = modeOfIcon(s.icon, s.name);
      const dist = s.distance != null ? `<span class="dist">${Math.round(s.distance)} m</span>` : '';
      return `<li><button data-id="${esc(s.id)}" data-name="${esc(s.name)}" data-mode="${m}">` +
             `${pictoHtml(m)}<span>${esc(s.name)}</span>${dist}</button></li>`;
    }).join('');
  }

  function uniqueById(arr) {
    const seen = new Set();
    return arr.filter(s => s.id && !seen.has(s.id) && seen.add(s.id));
  }

  async function search(q) {
    if (searchCtrl) searchCtrl.abort();
    searchCtrl = new AbortController();
    const signal = searchCtrl.signal;
    const allCH = $('allCH').checked;
    $('searchStatus').innerHTML = '<span class="spinner"></span>';
    try {
      const r1 = await getJSON(`${API}/locations?type=station&query=${enc(q)}`, signal);
      let stations = uniqueById(r1.stations || []);
      let inside = stations.filter(inZone);
      // Short names ("Bel-Air", "Gare") often return other towns first: retry targeting Geneva
      if (!allCH && inside.length < 3 && !/gen[eè]v/i.test(q)) {
        const r2 = await getJSON(`${API}/locations?type=station&query=${enc('Genève ' + q)}`, signal);
        stations = uniqueById([...stations, ...(r2.stations || [])]);
        inside = stations.filter(inZone);
      }
      renderResults(allCH ? stations : inside, allCH ? 'noStop' : 'noStopInZone');
      $('searchStatus').textContent = '';
    } catch (e) {
      if (e.name === 'AbortError') return;
      $('searchStatus').textContent = '';
      renderResults([], 'searchFailed');
    }
  }

  function nearMe() {
    if (!navigator.geolocation) { renderResults([], 'geoUnavailable'); return; }
    $('searchStatus').innerHTML = `<span class="spinner"></span> ${esc(t('locating'))}`;
    navigator.geolocation.getCurrentPosition(async pos => {
      try {
        const { latitude: x, longitude: y } = pos.coords;
        const r = await getJSON(`${API}/locations?x=${x}&y=${y}`);
        const st = uniqueById((r.stations || []).filter(s => s.id)).sort((a, b) => (a.distance ?? 1e9) - (b.distance ?? 1e9));
        $('searchStatus').textContent = '';
        renderResults(st, 'noNearby');
      } catch {
        $('searchStatus').textContent = '';
        renderResults([], 'nearbyFailed');
      }
    }, () => {
      $('searchStatus').textContent = '';
      renderResults([], 'geoDenied');
    }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  }

  // ---------- Departure board ----------
  function normalize(j) {
    const stop = j.stop || {};
    const sched = stop.departureTimestamp ? new Date(stop.departureTimestamp * 1000) : parseTime(stop.departure);
    // Live data: the real-time estimate, or the scheduled time + delay when only the delay is known.
    // Without live data, `real` stays null and the departure follows its scheduled time.
    const prognosis = parseTime(stop.prognosis && stop.prognosis.departure);
    let delay = stop.delay != null && stop.delay !== '' && !isNaN(Number(stop.delay)) ? Number(stop.delay) : null;
    const real = prognosis || (sched && delay != null ? new Date(sched.getTime() + delay * 60000) : null);
    if (prognosis && sched) delay = Math.round((prognosis - sched) / 60000);
    const mode = modeOfCategory(j.category);
    const label = lineLabel(j, mode);
    const lineKey = mode + '|' + label;
    // Direction = next stop after the current station (groups short runs in the same direction).
    // Without a passList, fall back to the terminus.
    const hereId = stop.station && stop.station.id;
    const pl = Array.isArray(j.passList) ? j.passList : [];
    const nxt = pl.find((p, i) => i > 0 && p && p.station && p.station.name && p.station.id !== hereId);
    const nextStop = nxt ? nxt.station.name : '';
    const dirKey = lineKey + '>' + (nxt ? (nxt.station.id || nextStop) : 'to:' + (j.to || ''));
    return {
      lineKey, dirKey, nextStop, label, mode, style: lineStyle(j, mode, label),
      to: j.to || '', sched, real, live: !!real, time: real || sched, delay: delay || 0,
      platform: (stop.prognosis && stop.prognosis.platform) || stop.platform || '',
      operator: j.operator || '',
      // next stops (shown when the departure is tapped)
      stops: pl.slice(1).filter(p => p && p.station && p.station.name && p.station.id !== hereId).slice(0, 8)
        .map(p => ({ name: p.station.name,
                     time: p.arrivalTimestamp ? new Date(p.arrivalTimestamp * 1000) : parseTime(p.arrival || p.departure) }))
    };
  }

  // ---------- Manual filter (Sprints 1-2) ----------
  function hiddenSet() { return new Set(store.get('hidden:' + current.id, [])); }
  function saveHidden(set) { store.set('hidden:' + current.id, [...set]); store.set('mode:' + current.id, 'manual'); }
  // Manual mode if the user has already set their lines (including a filter inherited from Sprints 1-2)
  function isManual() {
    const m = store.get('mode:' + current.id, null);
    if (m) return m === 'manual';
    return store.get('hidden:' + current.id, []).length > 0;
  }

  // ---------- Habits (US-06) ----------
  const HALF_LIFE_DAYS = 30;   // a 30-day-old use weighs half as much
  // "Usual" threshold: 2 uses less than 30 days apart (1 + 0.5^(Δ/30 d) ≥ 1.5).
  // Not 2: with decay, two uses always score slightly less than 2.
  const FAV_MIN = 1.5;
  const DEBOUNCE_MS = 10 * 60 * 1000; // several taps within 10 min = one use
  let peekAll = false;         // temporary "See all", forgotten when changing stop

  const decayed = (u, now) => u ? u.s * Math.pow(0.5, (now - u.t) / (HALF_LIFE_DAYS * 864e5)) : 0;
  function getUsage() { return store.get('usage:' + current.id, {}); }
  function recordUse(dirKey) {
    const usage = getUsage(), now = Date.now(), u = usage[dirKey];
    if (u && now - u.t < DEBOUNCE_MS) return false;
    usage[dirKey] = { s: decayed(u, now) + 1, t: now };
    store.set('usage:' + current.id, usage);
    return true;
  }
  function dirScore(dirKey, usage = getUsage(), now = Date.now()) { return decayed(usage[dirKey], now); }
  function favoriteDirs() {
    const usage = getUsage(), now = Date.now(), fav = new Set();
    lineModel.forEach(l => l.dirs.forEach(d => { if (dirScore(d.key, usage, now) >= FAV_MIN) fav.add(d.key); }));
    return fav;
  }

  // Set actually applied: manual > "See all" > auto (usual directions only) > everything
  function effectiveHidden() {
    if (isManual()) return hiddenSet();
    const fav = favoriteDirs();
    if (peekAll || fav.size === 0) return new Set();
    const set = new Set();
    lineModel.forEach(l => l.dirs.forEach(d => { if (!fav.has(d.key)) set.add(d.key); }));
    return set;
  }
  // First manual change: start from what the user currently sees
  function materialize() {
    if (!isManual()) saveHidden(effectiveHidden());
    peekAll = false;
  }

  function renderAutoInfo() {
    const fav = favoriteDirs(), box = $('autoInfo');
    let html = '';
    if (isManual()) {
      if (fav.size) html = `<span>${esc(t('manual'))}</span><button id="backAuto" class="ghost">${esc(t('backToHabits'))}</button>`;
    } else if (fav.size) {
      html = peekAll
        ? `<span>${esc(t('allLinesShown'))}</span><button id="peek" class="ghost">${esc(t('myLines'))}</button>`
        : `<span>${esc(t('usualLines'))}</span><button id="peek" class="ghost">${esc(t('seeAll'))}</button>`;
    }
    box.hidden = !html; box.innerHTML = html;
  }

  function compareLines(a, b) {
    return (MODE_ORDER[a.mode] - MODE_ORDER[b.mode]) ||
      a.label.localeCompare(b.label, 'en', { numeric: true, sensitivity: 'base' });
  }

  // Hidden if the whole line is (line key, Sprint 1 compatible) or if this direction is
  const isHidden = (d, set) => set.has(d.lineKey) || set.has(d.dirKey);
  // Still to come? Real time when live data exists, otherwise the scheduled time (#19)
  const upcoming = (d, now) => !!d.time && d.time - now > -GONE_MS;

  let lineModel = [];
  function buildLines() {
    const lines = new Map();
    for (const d of departures) {
      let l = lines.get(d.lineKey);
      if (!l) lines.set(d.lineKey, l = { key: d.lineKey, label: d.label, mode: d.mode, style: d.style, dirs: new Map() });
      let dir = l.dirs.get(d.dirKey);
      if (!dir) l.dirs.set(d.dirKey, dir = { key: d.dirKey, next: d.nextStop, termini: new Map() });
      dir.termini.set(d.to, (dir.termini.get(d.to) || 0) + 1);
    }
    const usage = getUsage(), now = Date.now();
    const lineScore = l => [...l.dirs.keys()].reduce((acc, k) => acc + dirScore(k, usage, now), 0);
    return [...lines.values()].sort((a, b) => (lineScore(b) - lineScore(a)) || compareLines(a, b)).map(l => ({
      key: l.key, label: l.label, mode: l.mode, style: l.style,
      dirs: [...l.dirs.values()].map(x => ({
        key: x.key, next: x.next,
        // termini in the same direction, most frequent first: "Moillesulaz / Genève, Rive"
        label: [...x.termini.entries()].sort((a, b) => b[1] - a[1]).map(e => e[0]).join(' / ')
      })).sort((a, b) => a.label.localeCompare(b.label, 'fr'))
    }));
  }
  const visibleDirs = (l, set) => set.has(l.key) ? 0 : l.dirs.filter(d => !set.has(d.key)).length;

  function renderLines() {
    lineModel = buildLines();
    const hidden = effectiveHidden();
    const fav = favoriteDirs();
    renderAutoInfo();
    $('lines').innerHTML = lineModel.length ? lineModel.map(l => {
      const n = visibleDirs(l, hidden), total = l.dirs.length;
      const state = n === 0 ? 'false' : n === total ? 'true' : 'mixed';
      const cnt = state === 'mixed' ? `<span class="cnt">${n}/${total}</span>` : '';
      const star = l.dirs.some(d => fav.has(d.key)) ? '<span class="fav">★</span>' : '';
      return `<button class="line-chip" data-key="${esc(l.key)}" aria-pressed="${state}" title="${esc(modeName(l.mode) + ' ' + l.label)}">` +
        `${lineIdHtml(l.mode, l.style, l.label, true)}${star}${cnt}</button>`;
    }).join('') : `<span class="status">${esc(t('noLinesInBoard'))}</span>`;
    $('dirToggle').hidden = lineModel.length === 0;
    renderDirs(hidden);
  }

  function renderDirs(hidden) {
    $('dirs').innerHTML = lineModel.map(l => {
      const rows = l.dirs.map(d => {
        const on = !hidden.has(l.key) && !hidden.has(d.key);
        const next = d.next ? `<small>${esc(t('nextStop', { name: d.next }))}</small>` : '';
        return `<button class="dir" data-line="${esc(l.key)}" data-dir="${esc(d.key)}" aria-pressed="${on}">` +
          `<span class="box"></span><span class="lbl"><b>${esc(d.label || '—')}</b>${next}</span></button>`;
      }).join('');
      return `<div class="dir-group">${lineIdHtml(l.mode, l.style, l.label, true)}<div>${rows}</div></div>`;
    }).join('');
  }

  function toggleLine(lineKey) {
    const l = lineModel.find(x => x.key === lineKey); if (!l) return;
    materialize();
    const set = hiddenSet();
    const anyVisible = visibleDirs(l, set) > 0;
    l.dirs.forEach(d => set.delete(d.key));
    anyVisible ? set.add(l.key) : set.delete(l.key);
    saveHidden(set);
  }

  function toggleDir(lineKey, dirKey) {
    const l = lineModel.find(x => x.key === lineKey); if (!l) return;
    materialize();
    const set = hiddenSet();
    if (set.has(l.key)) {
      // whole line hidden: enable this direction only
      set.delete(l.key);
      l.dirs.forEach(d => { if (d.key !== dirKey) set.add(d.key); });
      set.delete(dirKey);
    } else {
      set.has(dirKey) ? set.delete(dirKey) : set.add(dirKey);
      // every direction hidden → hide the line (including its future directions)
      if (l.dirs.every(d => set.has(d.key))) { l.dirs.forEach(d => set.delete(d.key)); set.add(l.key); }
    }
    saveHidden(set);
  }

  function whenHtml(d, now) {
    const time = d.time;
    if (!time) return '<b>–</b>';
    const min = Math.floor((time - now) / 60000);
    if (min <= 0) return `<b class="now">0′</b><small>${hhmm(time)}</small>`;
    if (min < 60) return `<b>${min}′</b><small>${hhmm(time)}</small>`;
    return `<b>${hhmm(time)}</b><small>&nbsp;</small>`;
  }

  let expanded = null;  // expanded departure (unique key)
  const depId = d => d.dirKey + '@' + (d.sched ? d.sched.getTime() : '');

  function renderDepartures() {
    const now = Date.now();
    const hidden = effectiveHidden();
    const list = departures
      .filter(d => !isHidden(d, hidden))
      .filter(d => upcoming(d, now))   // drop vehicles that have already left
      .slice(0, SHOW_MAX);
    const ul = $('departures');
    if (!departures.length) { ul.innerHTML = `<li class="empty">${esc(t('noDepartures'))}</li>`; return; }
    if (!list.length) {
      ul.innerHTML = !isManual() && !peekAll && favoriteDirs().size
        ? `<li class="empty">${esc(t('noUsualDepartures'))} <button id="peekEmpty">${esc(t('seeAll'))}</button></li>`
        : `<li class="empty">${esc(t('noSelectedDepartures'))}</li>`;
      return;
    }
    ul.innerHTML = list.map(d => {
      const plat = d.platform ? t(d.mode === 'train' ? 'track' : 'platform', { p: esc(d.platform) }) : '';
      const late = d.delay > 0 ? `<span class="late">+${d.delay} min</span>` : '';
      const meta = [plat, late].filter(Boolean).join(' · ');
      const id = depId(d), open = id === expanded;
      const stops = open ? `<ul class="stops">${d.stops.length ? d.stops.map(st =>
          `<li><span>${esc(st.name)}</span><span>${st.time ? hhmm(st.time) : ''}</span></li>`).join('')
          : `<li><span>${esc(t('nextStopsUnavailable'))}</span><span></span></li>`}</ul>` : '';
      return `<li class="dep" data-dep="${esc(id)}" data-dir="${esc(d.dirKey)}" aria-expanded="${open}">${lineIdHtml(d.mode, d.style, d.label)}` +
        `<div style="min-width:0"><div class="to">${esc(d.to)}</div><div class="meta">${meta || esc(modeName(d.mode))}</div></div>` +
        `<div class="when">${whenHtml(d, now)}</div>${stops}</li>`;
    }).join('');
  }

  function renderStatus(html) {
    if (html !== undefined) { $('boardStatus').innerHTML = html; return; }
    if (!lastLoad) return;
    const s = Math.round((Date.now() - lastLoad) / 1000);
    $('boardStatus').textContent = s < 10 ? t('justNow') : t('updatedAgo', { n: s < 60 ? s + ' s' : Math.round(s / 60) + ' min' });
  }

  async function loadBoard() {
    if (!current) return;
    if (boardCtrl) boardCtrl.abort();
    boardCtrl = new AbortController();
    renderStatus(`<span class="spinner"></span> ${esc(t('loading'))}`);
    try {
      const from = apiDateTime(new Date(Date.now() - LOOKBACK_MIN * 60000));
      const r = await getJSON(`${API}/stationboard?id=${enc(current.id)}&limit=${BOARD_LIMIT}&datetime=${enc(from)}`, boardCtrl.signal);
      const now = Date.now();
      departures = (r.stationboard || []).map(normalize)
        .filter(d => upcoming(d, now))   // the look-back window also returns departures that have already left
        .sort((a, b) => a.time - b.time);
      if (r.station && r.station.name) $('stationName').textContent = r.station.name;
      lastLoad = Date.now();
      renderLines(); renderDepartures(); renderStatus();
    } catch (e) {
      if (e.name === 'AbortError') return;
      renderStatus('');
      $('departures').innerHTML = `<li class="error">${esc(t('loadFailed'))} <button id="retry">${esc(t('retry'))}</button></li>`;
      $('retry').onclick = loadBoard;
    }
  }

  function startTimers() {
    clearInterval(refreshTimer); clearInterval(tickTimer);
    refreshTimer = setInterval(() => { if (document.visibilityState === 'visible') loadBoard(); }, REFRESH_MS);
    tickTimer = setInterval(() => { renderDepartures(); renderStatus(); }, TICK_MS);
  }

  function openStop(st) {
    current = { id: st.id, name: st.name };
    recordVisit(st);
    renderRecent();
    $('results').hidden = true; lastResults = null;
    $('q').value = '';
    $('q').blur();
    $('board').hidden = false;
    $('stationName').textContent = st.name;
    $('lines').innerHTML = '';
    $('departures').innerHTML = '';
    departures = []; lastLoad = null; peekAll = false; expanded = null;
    loadBoard();
    startTimers();
    $('board').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ---------- Language (US-10) ----------
  function applyLanguage() {
    document.documentElement.lang = lang;
    document.title = lang === 'fr' ? 'swissPublicTransport — Prototype Sprint 4' : 'swissPublicTransport — Sprint 4 prototype';
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
    document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
    document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
    $('lang').textContent = t('switchTo');
    $('lang').setAttribute('aria-label', t('switchToLabel'));
    $('dirToggle').textContent = $('dirs').hidden ? t('chooseDirections') : t('hideDirections');
    if (lastResults && !$('results').hidden) renderResults(lastResults.stations, lastResults.noteKey);
    if (current && lastLoad) { renderLines(); renderDepartures(); renderStatus(); }
  }

  // ---------- Events ----------
  let debounce;
  $('q').addEventListener('input', e => {
    clearTimeout(debounce);
    const q = e.target.value.trim();
    if (q.length < 2) { $('results').hidden = true; if (searchCtrl) searchCtrl.abort(); $('searchStatus').textContent = ''; return; }
    debounce = setTimeout(() => search(q), 300);
  });
  $('q').addEventListener('keydown', e => {
    if (e.key === 'Enter') { const first = $('results').querySelector('button[data-id]'); if (first) first.click(); }
  });
  $('allCH').addEventListener('change', () => { const q = $('q').value.trim(); if (q.length >= 2) search(q); });
  $('near').addEventListener('click', nearMe);
  $('lang').addEventListener('click', () => { lang = lang === 'fr' ? 'en' : 'fr'; store.set('lang', lang); applyLanguage(); });

  const pick = (e) => {
    const b = e.target.closest('button[data-id]');
    if (b) openStop({ id: b.dataset.id, name: b.dataset.name, mode: b.dataset.mode });
  };
  $('results').addEventListener('click', pick);
  $('recent').addEventListener('click', pick);
  $('clearRecent').addEventListener('click', () => { store.set('stops', {}); renderRecent(); });

  $('lines').addEventListener('click', e => {
    const b = e.target.closest('.line-chip');
    if (!b) return;
    toggleLine(b.dataset.key);
    renderLines(); renderDepartures();
  });
  $('dirs').addEventListener('click', e => {
    const b = e.target.closest('.dir');
    if (!b) return;
    toggleDir(b.dataset.line, b.dataset.dir);
    renderLines(); renderDepartures();
  });
  function setDirPanel(open) {
    $('dirs').hidden = !open;
    $('dirToggle').setAttribute('aria-expanded', String(open));
    $('dirToggle').textContent = open ? t('hideDirections') : t('chooseDirections');
    store.set('dirOpen', open);
  }
  $('dirToggle').addEventListener('click', () => setDirPanel($('dirs').hidden));
  setDirPanel(store.get('dirOpen', false));
  $('allLines').addEventListener('click', () => { peekAll = false; saveHidden(new Set()); renderLines(); renderDepartures(); });
  $('noLines').addEventListener('click', () => {
    peekAll = false; saveHidden(new Set(lineModel.map(l => l.key))); renderLines(); renderDepartures();
  });
  $('autoInfo').addEventListener('click', e => {
    if (e.target.id === 'peek') peekAll = !peekAll;
    else if (e.target.id === 'backAuto') { store.set('hidden:' + current.id, []); store.set('mode:' + current.id, 'auto'); peekAll = false; }
    else return;
    renderLines(); renderDepartures();
  });
  $('departures').addEventListener('click', e => {
    if (e.target.id === 'peekEmpty') { peekAll = true; renderLines(); renderDepartures(); return; }
    const li = e.target.closest('.dep'); if (!li) return;
    const opening = expanded !== li.dataset.dep;
    expanded = opening ? li.dataset.dep : null;
    if (opening && recordUse(li.dataset.dir)) renderLines();   // a use may move the line up
    renderDepartures();
  });
  $('refresh').addEventListener('click', loadBoard);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && current && lastLoad && Date.now() - lastLoad > REFRESH_MS) loadBoard();
  });

  // ---------- Start-up: straight to the last stop viewed ----------
  applyLanguage();
  renderRecent();
  const lastId = store.get('lastStop', null);
  const last = lastId && getStops()[lastId];
  if (last) {
    // reopen without incrementing the visit count
    current = { id: last.id, name: last.name };
    $('board').hidden = false;
    $('stationName').textContent = last.name;
    loadBoard();
    startTimers();
  }
})();
</script>
</body>
</html>
