name: Update platform positions

# Rebuilds assets/quays.js from the official ATLAS traffic points (opentransportdata.swiss).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # every Monday, 03:17 UTC
  push:
    paths:
      - scripts/build_quays.py
      - .github/workflows/update-quays.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build assets/quays.js
        run: python scripts/build_quays.py assets/quays.js
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/quays.js
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update platform positions from ATLAS ($(date -u +%F))"
            git push
          fi
