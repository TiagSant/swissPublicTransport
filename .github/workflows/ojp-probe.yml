name: OJP probe

# Sends real OJP 2.0 requests for Geneva and commits the raw answers as test fixtures (TECH-05, TECH-07).
# Needs the repository secret OJP_TOKEN (opentransportdata.swiss API key). The token is never printed or stored.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/ojp_probe.mjs
      - assets/ojp.js
      - .github/workflows/ojp-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the official OJP SDK (request builder only)
        run: npm install --no-save --no-package-lock ojp-sdk@0.23.5
      - name: Probe OJP 2.0
        env:
          OJP_TOKEN: ${{ secrets.OJP_TOKEN }}
        run: node scripts/ojp_probe.mjs tests/fixtures/ojp
      - name: Commit the fixtures
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/ojp
          if git diff --cached --quiet; then echo "No change"; else
            git commit -m "OJP probe: real answers for Geneva ($(date -u +%F))"
            git push
          fi
