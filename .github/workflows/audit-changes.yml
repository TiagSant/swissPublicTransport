name: Audit of changes (temporary)
on:
  push:
    branches: [audit-changes]
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: Audit
        env:
          OJP_TOKEN: ${{ secrets.OJP_TOKEN }}
          OUT: audit-out
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2
          python tools/audit/audit_changes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: audit-out, path: audit-out }
