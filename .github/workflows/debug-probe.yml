name: Probe (temporary)
on:
  push:
    branches: [debug-probe-ste-clotilde]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env:
          OJP_TOKEN: ${{ secrets.OJP_TOKEN }}
        run: python tools/probe/probe_situations.py
